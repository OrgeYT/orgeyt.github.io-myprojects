<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jumpscare Prank</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background-color: #f0f0f0;
            overflow: hidden;
        }

        #start-btn {
            background-color: #000000;
            color: #ffffff;
            padding: 20px 40px;
            font-size: 1.5rem;
            border: none;
            cursor: pointer;
            border-radius: 8px;
        }

        #black-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            z-index: 1000;
        }

        #jumpscare-img {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 2000;
        }

        #final-screen {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #ffffff;
            color: #000000;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            font-size: 2rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <button id="start-btn">Start jumpscare prank</button>

    <div id="black-screen"></div>
    <img id="jumpscare-img" src="https://file.garden/Zj01o_oh-G9Y8APf/boo/images.jpg" alt="Jumpscare">
    <audio id="jumpscare-audio" src="https://file.garden/Zj01o_oh-G9Y8APf/boo/Jumpscare.mp3"></audio>

    <div id="final-screen">
        <p>It was just a prank bro ;D</p>
        <p style="font-size: 1rem;">Press unfullscreen (ESC)</p>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const blackScreen = document.getElementById('black-screen');
        const jumpscareImg = document.getElementById('jumpscare-img');
        const audio = document.getElementById('jumpscare-audio');
        const finalScreen = document.getElementById('final-screen');

        let prankStarted = false;

        startBtn.addEventListener('click', () => {
            const docEl = document.documentElement;
            
            // Try to enter full screen
            if (docEl.requestFullscreen) {
                docEl.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable full-screen mode: ${err.message}`);
                });
            }
            
            blackScreen.style.display = 'block';
            prankStarted = true;
        });

        window.addEventListener('keydown', () => {
            if (prankStarted && jumpscareImg.style.display !== 'block') {
                jumpscareImg.style.display = 'block';
                audio.play().catch(e => console.error("Audio playback blocked", e));
            }
        });

        audio.addEventListener('ended', () => {
            jumpscareImg.style.display = 'none';
            blackScreen.style.display = 'none';
            finalScreen.style.display = 'flex';
        });
    </script>
</body>
</html>
