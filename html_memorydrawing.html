<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Drawing Challenge</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        
        .canvas-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            aspect-ratio: 3/2;
            margin: 0 auto;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            touch-action: none; /* Prevent scrolling while drawing on touch devices */
        }

        #originalCanvas {
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            z-index: 10;
        }

        #originalCanvas.show {
            opacity: 1;
        }

        .tool-btn {
            transition: all 0.2s;
        }
        
        .tool-btn:hover {
            transform: translateY(-1px);
        }
        
        .tool-btn.active {
            border-color: #3b82f6;
            background-color: #eff6ff;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.5);
        }

        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #d1d5db;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .color-btn:hover {
            transform: scale(1.1);
        }

        .color-btn.active {
            border-color: #1f2937;
            transform: scale(1.1);
            box-shadow: 0 0 0 2px white, 0 0 0 4px #1f2937;
        }

        /* Center marker styles */
        .center-crosshair {
            position: absolute;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 20;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
        }
        
        .center-crosshair.visible {
            opacity: 1;
        }

        .grid-line {
            position: absolute;
            background-color: rgba(31, 41, 55, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.5);
        }

        .grid-line-h {
            width: 100%;
            height: 1px;
            left: 0;
        }

        .grid-line-v {
            width: 1px;
            height: 100%;
            top: 0;
        }

        .grid-center-dot {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ef4444;
            border: 1px solid white;
            transform: translate(-50%, -50%);
            box-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #e5e7eb;
            border-radius: 2px;
        }

        /* Modal styling */
        #resultModal {
            backdrop-filter: blur(4px);
        }

        /* Bot Cursor styling */
        #botCursor {
            pointer-events: none;
            z-index: 10000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
            will-change: transform;
        }
        #botCursor svg {
            transition: transform 0.1s ease;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
    </style>
</head>

            <path d="M5.5 3.21V20.8c0 .45.54.67.85.35l4.86-4.86a.5.5 0 01.35-.15h6.42c.41 0 .75-.34.75-.75V3.21c0-.41-.34-.75-.75-.75H6.25c-.41 0-.75.34-.75.75z" stroke="#fff" stroke-width="2"/>
        </svg>
    </div>

    <script>
        // --- State Variables ---
        const drawCanvas = document.getElementById('drawCanvas');
        const drawCtx = drawCanvas.getContext('2d', { willReadFrequently: true });
        
        const perfectCanvas = document.getElementById('perfectCanvas');
        const perfectCtx = perfectCanvas.getContext('2d', { willReadFrequently: true });
        
        const originalCanvas = document.getElementById('originalCanvas');
        const originalCtx = originalCanvas.getContext('2d');

        let isDrawing = false;
        let currentColor = '#000000';
        let currentTool = 'brush'; // 'brush', 'fill', 'line', 'rect', 'circle', 'triangle'
        let brushSize = 10;
        let selectedChallenge = 'brazil';
        
        let startX = 0;
        let startY = 0;
        let canvasSnapshot = null;
        let isCenterVisible = false;

        let brushAxis = null;
        let lastDrawX = 0;
        let lastDrawY = 0;

        let previousChallenge = 'brazil';
        let customSvgImage = null;
        
        let lastScoreUpdateTime = 0;

        // Bot State Variables
        let botScript = [];
        let isBotRunning = false;
        let botCursorState = { x: 0, y: 0 };

        // Proxy to intercept and record drawing commands for the Bot
        const getProxyCtx = (targetCtx) => {
            return new Proxy(targetCtx, {
                get(target, prop) {
                    if (typeof target[prop] === 'function') {
                        return function(...args) {
                            if (prop !== 'getImageData' && prop !== 'putImageData') {
                                botScript.push({ type: 'method', prop, args });
                            }
                            return target[prop].apply(target, args);
                        };
                    }
                    return target[prop];
                },
                set(target, prop, value) {
                    botScript.push({ type: 'setter', prop, value });
                    target[prop] = value;
                    return true;
                }
            });
        };

        // Internal resolution for logical drawing (keeps things consistent regardless of screen size)
        const LOGICAL_WIDTH = 600;
        const LOGICAL_HEIGHT = 400;

        // --- Flag & Logo Definitions (Colors and drawing logic) ---
        const challenges = {
            brazil: {
                colors: ['#009c3b', '#ffdf00', '#002776', '#ffffff'],
                grid: { type: 'center' }, // Default center crosshair
                draw: (ctx, w, h) => {
                    ctx.fillStyle = '#009c3b'; ctx.fillRect(0, 0, w, h); // Green bg
                    ctx.fillStyle = '#ffdf00'; // Yellow rhombus
                    ctx.beginPath(); ctx.moveTo(w/2, h*0.1); ctx.lineTo(w*0.9, h/2); ctx.lineTo(w/2, h*0.9); ctx.lineTo(w*0.1, h/2); ctx.fill();
                    ctx.fillStyle = '#002776'; // Blue circle
                    ctx.beginPath(); ctx.arc(w/2, h/2, h*0.25, 0, Math.PI*2); ctx.fill();
                    // Simplified: White band across circle
                    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = h*0.04;
                    ctx.beginPath(); ctx.arc(w/2, h*1.1, h*0.7, -Math.PI*0.35, -Math.PI*0.15); ctx.stroke();
                }
            },
            canada: {
                colors: ['#ff0000', '#ffffff'],
                grid: { type: 'vertical', sections: 4 }, // Technically 1:2:1, so quarters help
                draw: (ctx, w, h) => {
                    ctx.fillStyle = '#ff0000'; ctx.fillRect(0, 0, w, h); // Red bg
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(w/4, 0, w/2, h); // White center
                    // Simplified Maple Leaf
                    ctx.fillStyle = '#ff0000';
                    ctx.beginPath();
                    ctx.moveTo(w/2, h*0.2); // Top tip
                    ctx.lineTo(w*0.55, h*0.4); ctx.lineTo(w*0.65, h*0.35); // Right top lobe
                    ctx.lineTo(w*0.6, h*0.5); ctx.lineTo(w*0.7, h*0.6); // Right side lobe
                    ctx.lineTo(w*0.55, h*0.6); ctx.lineTo(w*0.52, h*0.8); // Stem right
                    ctx.lineTo(w*0.48, h*0.8); ctx.lineTo(w*0.45, h*0.6); // Stem left
                    ctx.lineTo(w*0.3, h*0.6); ctx.lineTo(w*0.4, h*0.5); // Left side lobe

        function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, rot) {
            let x = cx, y = cy, step = Math.PI / spikes;
            ctx.beginPath();
            ctx.moveTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
            for (let i = 0; i < spikes; i++) {
                x = cx + Math.cos(rot) * outerRadius; y = cy + Math.sin(rot) * outerRadius; ctx.lineTo(x, y); rot += step;
                x = cx + Math.cos(rot) * innerRadius; y = cy + Math.sin(rot) * innerRadius; ctx.lineTo(x, y); rot += step;
            }
            ctx.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
            ctx.closePath();
            ctx.fill();
        }

        //
        // Get coordinates adjusted for canvas scaling
        function getPos(e) {
            const rect = drawCanvas.getBoundingClientRect();
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            const scaleX = drawCanvas.width / rect.width;
            const scaleY = drawCanvas.height / rect.height;

            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startDrawing(e) {
            e.preventDefault();
            if (isBotRunning) abortBot();

            const pos = getPos(e);
            startX = pos.x;
            startY = pos.y;
            lastDrawX = pos.x;
            lastDrawY = pos.y;
            brushAxis = null;
            isDrawing = true;

            drawCtx.lineWidth = brushSize;
            drawCtx.strokeStyle = currentColor;
            drawCtx.fillStyle = currentColor;
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';

            if (currentTool === 'brush') {
                drawCtx.beginPath();
                drawCtx.moveTo(pos.x, pos.y);
            } else if (currentTool === 'fill') {
                const fillColor = hexToRgb(currentColor);
                floodFill(Math.floor(pos.x), Math.floor(pos.y), fillColor);
                updateLiveScore();
                isDrawing = false;
            } else if (['line', 'rect', 'circle', 'triangle'].includes(currentTool)) {
                // Snapshot so we can preview the shape while dragging
                canvasSnapshot = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
            }
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault();

            const pos = getPos(e);
            
            if (currentTool === 'brush') {
                let targetX = pos.x;
                let targetY = pos.y;

                if (e.shiftKey) {
                    if (!brushAxis) {
                        if (Math.abs(pos.x - lastDrawX) > Math.abs(pos.y - lastDrawY)) {
                            brushAxis = 'x';
                        } else if (Math.abs(pos.y - lastDrawY) > Math.abs(pos.x - lastDrawX)) {
                            brushAxis = 'y';
                        }
                    }
                    if (brushAxis === 'x') targetY = startY;
                    if (brushAxis === 'y') targetX = startX;
                } else {
                    brushAxis = null;
                    startX = targetX;
                    startY = targetY;
                }

                drawCtx.lineTo(targetX, targetY);
                drawCtx.stroke();
                drawCtx.beginPath();
                drawCtx.moveTo(targetX, targetY);
                
                lastDrawX = targetX;
                lastDrawY = targetY;
            } else if (['line', 'rect', 'circle', 'triangle'].includes(currentTool)) {
                // Restore the snapshot so we don't draw overlapping shapes while moving
                drawCtx.putImageData(canvasSnapshot, 0, 0);
                
                drawCtx.fillStyle = currentColor;
                drawCtx.strokeStyle = currentColor;
                drawCtx.lineWidth = brushSize;
                
                if (currentTool === 'line') {
                    let endX = pos.x;
                    let endY = pos.y;
                    
                    if (e.shiftKey) {
                        const dx = pos.x - startX;
                        const dy = pos.y - startY;
                        const angle = Math.atan2(dy, dx);
                        // Snap to 45 degrees (PI/4)
                        const snappedAngle = Math.round(angle / (Math.PI / 4)) * (Math.PI / 4);
                        const dist = Math.sqrt(dx*dx + dy*dy);
                        endX = startX + Math.cos(snappedAngle) * dist;
                        endY = startY + Math.sin(snappedAngle) * dist;
                    }
                    
                    drawCtx.beginPath();
                    drawCtx.moveTo(startX, startY);
                    drawCtx.lineTo(endX, endY);
                    drawCtx.stroke();
                } else if (currentTool === 'rect') {
                    let width = pos.x - startX;
                    let height = pos.y - startY;
                    
                    if (e.shiftKey) {
                        const size = Math.max(Math.abs(width), Math.abs(height));
                        width = width < 0 ? -size : size;
                        height = height < 0 ? -size : size;
                    }
                    
                    drawCtx.fillRect(startX, startY, width, height);
                } else if (currentTool === 'circle') {
                    drawCtx.beginPath();
                    const radius = Math.sqrt(Math.pow(pos.x - startX, 2) + Math.pow(pos.y - startY, 2));
                    drawCtx.arc(startX, startY, radius, 0, Math.PI * 2);
                    drawCtx.fill();
                } else if (currentTool === 'triangle') {
                    drawCtx.beginPath();
                    // Define a triangle bound by the start and current cursor positions
                    drawCtx.moveTo(startX + (pos.x - startX) / 2, startY); // Top middle
                    drawCtx.lineTo(pos.x, pos.y); // Bottom right
                    drawCtx.lineTo(startX, pos.y); // Bottom left
                    drawCtx.closePath();
                    drawCtx.fill();
                }
            }
            
            // Real-time accuracy update (throttled to keep drawing smooth)
            const now = Date.now();
            if (now - lastScoreUpdateTime > 100) {
                updateLiveScore();
                lastScoreUpdateTime = now;
            }
        }

        function stopDrawing(e) {
            if (e) e.preventDefault();
            if (isDrawing) {
                isDrawing = false;
                updateLiveScore();
            }
        }

        // Helper to convert hex to {r,g,b,a}
        function hexToRgb(hex) {
            let result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16),
                a: 255
            } : {r:0, g:0, b:0, a:255};
        }

        // Flood Fill Algorithm
        function floodFill(startX, startY, fillColor) {
            const imageData = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height);
            const data = imageData.data;
            
            const startPos = (startY * drawCanvas.width + startX) * 4;
            const startR = data[startPos];
            const startG = data[startPos + 1];
            const startB = data[startPos + 2];
            const startA = data[startPos + 3];

            // If clicking on same color, do nothing
            if (startR === fillColor.r && startG === fillColor.g && startB === fillColor.b) return;

            const width = drawCanvas.width;
            const height = drawCanvas.height;
            const stack = [[startX, startY]];

            function matchStartColor(pos) {
                return data[pos] === startR && data[pos+1] === startG && data[pos+2] === startB && data[pos+3] === startA;
            }

            function colorPixel(pos) {
                data[pos] = fillColor.r;
                data[pos+1] = fillColor.g;
                data[pos+2] = fillColor.b;
                data[pos+3] = fillColor.a;
            }

            while(stack.length) {
                const newPos = stack.pop();
                let x = newPos[0];
                let y = newPos[1];
                let pixelPos = (y * width + x) * 4;

                while (y-- >= 0 && matchStartColor(pixelPos)) {
                    pixelPos -= width * 4;
                }
                pixelPos += width * 4;
                y++;
                
                let reachLeft = false;
                let reachRight = false;

                while (y++ < height - 1 && matchStartColor(pixelPos)) {
                    colorPixel(pixelPos);

                    if (x > 0) {
                        if (matchStartColor(pixelPos - 4)) {
                            if (!reachLeft) {
                                stack.push([x - 1, y]);
                                reachLeft = true;
                            }
                        } else if (reachLeft) {
                            reachLeft = false;
                        }
                    }

                    if (x < width - 1) {
                        if (matchStartColor(pixelPos + 4)) {
                            if (!reachRight) {
                                stack.push([x + 1, y]);
                                reachRight = true;
                            }
                        } else if (reachRight) {
                            reachRight = false;
                        }
                    }
                    pixelPos += width * 4;
                }
            }
            drawCtx.putImageData(imageData, 0, 0);
        }

        // --- STREAMING_CHUNK:Implementing live scoring logic... ---

        function getAccuracy() {
            const drawData = drawCtx.getImageData(0, 0, drawCanvas.width, drawCanvas.height).data;
            const perfData = perfectCtx.getImageData(0, 0, perfectCanvas.width, perfectCanvas.height).data;
            
            let diffPixels = 0;
            const tolerance = 40; 
            const step = 8; // Faster check for real-time (every 8th pixel)
            let pixelsChecked = 0;

            for (let i = 0; i < drawData.length; i += step * 4) {
                pixelsChecked++;
                let rDiff = Math.abs(drawData[i] - perfData[i]);
                let gDiff = Math.abs(drawData[i+1] - perfData[i+1]);
                let bDiff = Math.abs(drawData[i+2] - perfData[i+2]);

                if (rDiff > tolerance || gDiff > tolerance || bDiff > tolerance) {
                    diffPixels++;
                }
            }

            const matchingPixels = pixelsChecked - diffPixels;
            let score = (matchingPixels / pixelsChecked) * 100;
            score = Math.max(0, Math.min(100, Math.round(score)));
            
            // Heuristic penalty for mostly blank canvas
            if (score > 80) {
                let isMostlyWhite = true;
                for(let i=0; i<drawData.length; i+=40) {
                    if(drawData[i] < 240 || drawData[i+1] < 240 || drawData[i+2] < 240) {
                        isMostlyWhite = false; break;
                    }
                }
                const perfHasNonWhite = Array.from(perfData).some((val, i) => i%4 !== 3 && val < 240);
                if(isMostlyWhite && perfHasNonWhite) {
                    score = 0; 
                }
            }

            return score;
        }

        function formatFlagLabel(key) {
            if (key === 'custom_loaded') return 'Custom SVG';

            if (key === 'youtube') return 'YouTube';
            return key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
        }

        function isGalleryCompact() {
            const el = document.getElementById('galleryCompactToggle');
            return !!(el && el.checked);
        }

        function buildChallengeCollage(mode) {
            // mode: 'flags' | 'all'
            galleryMode = mode;
            const compact = isGalleryCompact();

            const logoKeys = new Set(['mcdonalds', 'amazon', 'youtube', 'facebook', 'snapchat', 'pringles']);
            let keys = Object.keys(challenges);
            if (mode === 'flags') {
                keys = keys.filter(k => !logoKeys.has(k) && k !== 'custom_loaded');
            }

            const cellW = 180;
            const cellH = 120;
            const gap = compact ? 0 : 12;
            const labelH = compact ? 0 : 22;
            const cols = Math.max(1, Math.ceil(Math.sqrt(keys.length)));
            const rows = Math.max(1, Math.ceil(keys.length / cols));
            const pad = compact ? 0 : 24;
            const titleH = compact ? 0 : 40;

            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, pad * 2 + cols * cellW + (cols - 1) * gap);
            canvas.height = Math.max(1, pad * 2 + titleH + rows * (cellH + labelH) + (rows - 1) * gap);
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = compact ? '#ffffff' : '#f3f4f6';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (!compact) {
                const title = mode === 'all'
                    ? 'Flag Drawing Challenge — Every Challenge'
                    : 'Flag Drawing Challenge — Every Flag';
                ctx.fillStyle = '#111827';
                ctx.font = 'bold 22px Inter, Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(title, canvas.width / 2, pad + 22);
            }

            const off = document.createElement('canvas');
            off.width = cellW;
            off.height = cellH;
            const offCtx = off.getContext('2d');

            keys.forEach((key, i) => {
                const col = i % cols;
                const row = Math.floor(i / cols);
                const x = pad + col * (cellW + gap);
                const y = pad + titleH + row * (cellH + labelH + gap);

                offCtx.clearRect(0, 0, cellW, cellH);
                offCtx.fillStyle = '#ffffff';
                offCtx.fillRect(0, 0, cellW, cellH);
                try {
                    challenges[key].draw(offCtx, cellW, cellH);
                } catch (err) {
                    offCtx.fillStyle = '#ef4444';
                    offCtx.font = '12px sans-serif';
                    offCtx.textAlign = 'center';
                    offCtx.fillText('Error', cellW / 2, cellH / 2);
                }

                if (!compact) {
                    ctx.fillStyle = '#e5e7eb';
                    ctx.fillRect(x + 2, y + 2, cellW, cellH);

            drawCanvas.addEventListener('touchmove', draw, {passive: false});
            window.addEventListener('touchend', stopDrawing);
            window.addEventListener('touchcancel', stopDrawing);

            // Controls
            document.getElementById('clearBtn').addEventListener('click', () => { clearCanvas(); updateLiveScore(); });
            document.getElementById('toggleCenterBtn').addEventListener('click', toggleCenterMarker);
            document.getElementById('compareBtn').addEventListener('click', calculateScore);
            document.getElementById('challengeSelect').addEventListener('change', () => { changeChallenge(); updateLiveScore(); });
            document.getElementById('autoDrawBtn').addEventListener('click', runAutoDraw);
            document.getElementById('showAllFlagsBtn').addEventListener('click', showEveryFlag);
            document.getElementById('showAllChallengesBtn').addEventListener('click', showEveryChallenge);
            document.getElementById('closeAllFlagsBtn').addEventListener('click', closeAllFlagsModal);
            document.getElementById('downloadAllFlagsBtn').addEventListener('click', downloadAllFlagsJPG);
            document.getElementById('galleryCompactToggle').addEventListener('change', refreshGalleryFromToggle);

            // Custom SVG Uploader — parse paths so Auto Draw can stroke/fill like flags
            document.getElementById('svgUploader').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    const svgText = event.target.result;
                    const extractedColors = extractColorsFromSVG(svgText);
                    
                    const defaultColors = ['#000000', '#ffffff', '#ff0000', '#00ff00', '#0000ff', '#ffff00', '#00ffff', '#ff00ff'];
                    const finalColors = extractedColors.length > 0 ? extractedColors : defaultColors;

                    // Build a real canvas draw function from SVG elements (paths, rects, circles, etc.)
                    const parsedDraw = createSVGDrawFunction(svgText);

                    customSvgImage = new Image();
                    customSvgImage.onload = function() {
                        challenges['custom_loaded'] = {
                            colors: finalColors,
                            grid: { type: 'center' },
                            draw: (ctx, w, h) => {
                                if (parsedDraw) {
                                    // Path-based draw — records moveTo/lineTo/fill/stroke for Auto Draw
                                    parsedDraw(ctx, w, h);
                                } else {
                                    // Fallback: raster drawImage if parse failed
                                    ctx.fillStyle = '#ffffff';
                                    ctx.fillRect(0, 0, w, h);
                                    const scale = Math.min(w / customSvgImage.width, h / customSvgImage.height) * 0.9;
                                    const dw = customSvgImage.width * scale;
                                    const dh = customSvgImage.height * scale;
                                    const dx = (w - dw) / 2;
                                    const dy = (h - dh) / 2;
                                    ctx.drawImage(customSvgImage, dx, dy, dw, dh);
                                }
                            }
                        };
                        
                        // Add or update the dropdown option
                        let customOpt = document.getElementById('customLoadedOpt');
                        if (!customOpt) {
                            customOpt = document.createElement('option');
                            customOpt.id = 'customLoadedOpt';
                            customOpt.value = 'custom_loaded';
                            document.getElementById('customOptGroup').appendChild(customOpt);
                        }
                        customOpt.text = 'Custom: ' + file.name;
                        
                        // Switch to the new custom challenge
                        document.getElementById('challengeSelect').value = 'custom_loaded';
                        changeChallenge();
                        updateLiveScore();
                    };
                    
                    // Also load as image for fallback + size hints
                    const blob = new Blob([svgText], {type: 'image/svg+xml'});
                    customSvgImage.src = URL.createObjectURL(blob);

                    // If image fails to load, still register the parsed draw
                    customSvgImage.onerror = function() {
                        if (!parsedDraw) return;
                        challenges['custom_loaded'] = {
                            colors: finalColors,
                            grid: { type: 'center' },
                            draw: (ctx, w, h) => parsedDraw(ctx, w, h)
                        };
                        let customOpt = document.getElementById('customLoadedOpt');
                        if (!customOpt) {
                            customOpt = document.createElement('option');
                            customOpt.id = 'customLoadedOpt';
                            customOpt.value = 'custom_loaded';
                            document.getElementById('customOptGroup').appendChild(customOpt);
                        }
                        customOpt.text = 'Custom: ' + file.name;
                        document.getElementById('challengeSelect').value = 'custom_loaded';
                        changeChallenge();
                        updateLiveScore();
                    };
                };
                reader.readAsText(file);
                
                // Reset file input so the same file could be selected again if needed
                e.target.value = '';
            });

            // Tools
            const toolIds = ['brushTool', 'fillTool', 'lineTool', 'rectTool', 'circleTool', 'triangleTool'];
            toolIds.forEach(id => {
                document.getElementById(id).addEventListener('click', (e) => {
                    currentTool = id.replace('Tool', ''); // Extracts 'brush', 'fill', 'line', etc.
                    updateToolUI(e.target);
                    
                    const brushUI = document.getElementById('brushSizeContainer');
                    const brushInput = document.getElementById('brushSize');
                    if (currentTool === 'fill') {
                        brushUI.style.opacity = '0.5';
                        brushInput.disabled = true;
                    } else {
                        brushUI.style.opacity = '1';
                        brushInput.disabled = false;
                    }
                });
            });

            // Brush Size
            const sizeSlider = document.getElementById('brushSize');
            const sizeLabel = document.getElementById('brushSizeLabel');
            sizeSlider.addEventListener('input', (e) => {
                brushSize = e.target.value;
                sizeLabel.innerText = brushSize;
            });

            // Initial color setup
            setupColorListeners();
            
            // Custom Color Picker Listener
            const customColorPicker = document.getElementById('customColorPicker');
            const customColorWrapper = document.getElementById('customColorWrapper');
            if (customColorPicker && customColorWrapper) {
                customColorPicker.addEventListener('input', (e) => {
                    currentColor = e.target.value;
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    customColorWrapper.style.boxShadow = '0 0 0 2px white, 0 0 0 4px #1f2937';
                    customColorWrapper.style.borderColor = '#1f2937';
                });
            }
        }

        function setupColorListeners() {
            document.querySelectorAll('.color-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    currentColor = e.target.dataset.color;
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    
                    // Reset custom picker active styling
                    const customWrapper = document.getElementById('customColorWrapper');
                    if (customWrapper) {
                        customWrapper.style.boxShadow = '';
                        customWrapper.style.borderColor = '';
                    }
                });
            });
        }

        function updateToolUI(activeBtn) {
            document.querySelectorAll('.tool-btn').forEach(b => {
                if (b.id !== 'clearBtn' && b.id !== 'toggleCenterBtn' && b.id !== 'compareBtn' && b.id !== 'showOriginalBtn' && b.id !== 'autoDrawBtn') {
                    b.classList.remove('active');
                }
            });
            activeBtn.classList.add('active');
        }

        // --- STREAMING_CHUNK:Implementing Bot Logic... ---
        
        function wait(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function updateCursorPosition() {
            const botCursor = document.getElementById('botCursor');
            botCursor.style.transform = `translate(${botCursorState.x}px, ${botCursorState.y}px)`;
        }

        function getCanvasScreenPos(logicalX, logicalY) {
            const rect = drawCanvas.getBoundingClientRect();
            const scaleX = rect.width / LOGICAL_WIDTH;
            const scaleY = rect.height / LOGICAL_HEIGHT;
            
            // Account for any active canvas transformations (like rotations)
            const matrix = drawCtx.getTransform();
            const transformedX = matrix.a * logicalX + matrix.c * logicalY + matrix.e;
            const transformedY = matrix.b * logicalX + matrix.d * logicalY + matrix.f;
            
            return {
                x: rect.left + (transformedX * scaleX),
                y: rect.top + (transformedY * scaleY)
            };
        }

        function moveCursorTo(targetX, targetY, baseDuration = 220) {
            return new Promise(resolve => {
                if (!isBotRunning) return resolve();
                const startX = botCursorState.x;
                const startY = botCursorState.y;
                
                const dist = Math.hypot(targetX - startX, targetY - startY);
                if (dist < 2) {
                    botCursorState.x = targetX;
                    botCursorState.y = targetY;
                    updateCursorPosition();
                    return resolve();
                }
                const duration = Math.min(Math.max(dist * 0.45, 50), 380) * (baseDuration / 220);

                const startTime = performance.now();
                function animate(currentTime) {
                    if (!isBotRunning) return resolve();
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const easeProgress = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;
                    
                    botCursorState.x = startX + (targetX - startX) * easeProgress;
                    botCursorState.y = startY + (targetY - startY) * easeProgress;
                    updateCursorPosition();
                    
                    if (progress < 1) requestAnimationFrame(animate);
                    else resolve();
                }
                requestAnimationFrame(animate);
            });
        }

        // Move cursor along a line in logical canvas space (does NOT stroke — preserves path for fill)
        function moveAlongLogical(fromLX, fromLY, toLX, toLY, duration = 160) {
            return new Promise(resolve => {
                if (!isBotRunning) return resolve();
                const startScreen = getCanvasScreenPos(fromLX, fromLY);
                const endScreen = getCanvasScreenPos(toLX, toLY);
                const sx = startScreen.x, sy = startScreen.y;
                const ex = endScreen.x, ey = endScreen.y;

                const startTime = performance.now();
                function animate(currentTime) {
                    if (!isBotRunning) return resolve();
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = progress < 0.5 ? 2 * progress * progress : 1 - Math.pow(-2 * progress + 2, 2) / 2;

                    botCursorState.x = sx + (ex - sx) * ease;
                    botCursorState.y = sy + (ey - sy) * ease;
                    updateCursorPosition();

                    if (progress < 1) requestAnimationFrame(animate);
                    else resolve();
                }
                requestAnimationFrame(animate);
            });
        }

        // Animate fillRect: cursor traces outline, then fill appears
        async function animateFillRect(x, y, w, h) {
            const corners = [
                [x, y],
                [x + w, y],
                [x + w, y + h],
                [x, y + h],
                [x, y]
            ];
            for (let i = 0; i < corners.length - 1; i++) {
                if (!isBotRunning) return;
                const [x0, y0] = corners[i];
                const [x1, y1] = corners[i + 1];
                const p0 = getCanvasScreenPos(x0, y0);
                await moveCursorTo(p0.x, p0.y, i === 0 ? 140 : 60);
                if (!isBotRunning) return;
                await moveAlongLogical(x0, y0, x1, y1, 100);
            }
            if (!isBotRunning) return;
            drawCtx.fillRect(x, y, w, h);
            updateLiveScore();
            await wait(40);
        }

        // Cursor orbits an arc/ellipse center
        async function animateArcTrace(cx, cy, r) {
            const center = getCanvasScreenPos(cx, cy);
            await moveCursorTo(center.x, center.y, 120);
            if (!isBotRunning) return;

            const duration = Math.min(Math.max(r * 2.5, 180), 420);
            const startTime = performance.now();
            await new Promise(resolve => {
                function animate(t) {
                    if (!isBotRunning) return resolve();
                    const elapsed = t - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const angle = -Math.PI / 2 + progress * Math.PI * 2;
                    const lx = cx + Math.cos(angle) * r;
                    const ly = cy + Math.sin(angle) * r;
                    const sp = getCanvasScreenPos(lx, ly);
                    botCursorState.x = sp.x;
                    botCursorState.y = sp.y;
                    updateCursorPosition();
                    if (progress < 1) requestAnimationFrame(animate);
                    else resolve();
                }
                requestAnimationFrame(animate);
            });
        }

        // Progressive reveal for drawImage / custom SVGs (cursor scans top → bottom)
        async function animateDrawImage(img, dx, dy, dw, dh) {
            if (!img) return;
            const strips = 28;
            const stripH = dh / strips;

            // Move to top-left of image area first
            const topLeft = getCanvasScreenPos(dx, dy);
            await moveCursorTo(topLeft.x, topLeft.y, 180);
            if (!isBotRunning) return;

            for (let i = 0; i < strips; i++) {
                if (!isBotRunning) return;
                const sy = i * stripH;
                // Source mapping (handles SVG / raster)
                const srcH = (img.naturalHeight || img.height || dh);
                const srcW = (img.naturalWidth || img.width || dw);
                const srcStripH = srcH / strips;

                try {
                    drawCtx.drawImage(
                        img,
                        0, i * srcStripH, srcW, srcStripH + 0.5,
                        dx, dy + sy, dw, stripH + 0.5
                    );
                } catch (err) {
                    // Fallback: draw full image once if strip draw fails
                    drawCtx.drawImage(img, dx, dy, dw, dh);
                    updateLiveScore();
                    return;
                }

                const left = getCanvasScreenPos(dx, dy + sy + stripH / 2);
                const right = getCanvasScreenPos(dx + dw, dy + sy + stripH / 2);
                botCursorState.x = left.x;
                botCursorState.y = left.y;
                updateCursorPosition();
                await moveCursorTo(right.x, right.y, 28);
            }
            updateLiveScore();
        }

        // Progressive reveal from perfectCanvas (used when custom SVG path is complex)
        async function animateRevealFromPerfect() {
            const strips = 30;
            const stripH = LOGICAL_HEIGHT / strips;
            const topLeft = getCanvasScreenPos(0, 0);
            await moveCursorTo(topLeft.x, topLeft.y, 150);
            if (!isBotRunning) return;

            for (let i = 0; i < strips; i++) {
                if (!isBotRunning) return;
                const sy = i * stripH;
                drawCtx.drawImage(
                    perfectCanvas,
                    0, sy, LOGICAL_WIDTH, stripH + 0.5,
                    0, sy, LOGICAL_WIDTH, stripH + 0.5
                );
                const left = getCanvasScreenPos(0, sy + stripH / 2);
                const right = getCanvasScreenPos(LOGICAL_WIDTH, sy + stripH / 2);
                botCursorState.x = left.x;
                botCursorState.y = left.y;
                updateCursorPosition();
                await moveCursorTo(right.x, right.y, 22);
            }
            updateLiveScore();
        }

        function abortBot() {
            if (isBotRunning) {
                isBotRunning = false;
                const botCursor = document.getElementById('botCursor');
                botCursor.style.opacity = '0';
                setTimeout(() => botCursor.style.display = 'none', 300);
            }
        }

        async function runAutoDraw() {
            if (isBotRunning) return;
            isBotRunning = true;

            const botCursor = document.getElementById('botCursor');
            botCursor.style.display = 'block';
            requestAnimationFrame(() => { botCursor.style.opacity = '1'; });

            const canvasRect = drawCanvas.getBoundingClientRect();
            botCursorState.x = canvasRect.left + canvasRect.width / 2;
            botCursorState.y = canvasRect.bottom + 40;
            updateCursorPosition();

            clearCanvas(false);
            drawCtx.resetTransform();
            drawCtx.lineCap = 'round';
            drawCtx.lineJoin = 'round';
            drawCtx.beginPath();

            await wait(300);

            // If script is empty (parse failed), fall back to progressive reveal from perfect canvas
            if (!botScript || botScript.length === 0) {
                await animateRevealFromPerfect();
                await wait(400);
                abortBot();
                return;
            }

            let pathPoints = [];
            let lastPt = null;

            for (let action of botScript) {
                if (!isBotRunning) break;

                if (action.type === 'setter') {
                    // Always apply style state to the drawing context
                    try {
                        drawCtx[action.prop] = action.value;
                    } catch (_) {}

                    if (action.prop === 'fillStyle' || action.prop === 'strokeStyle') {
                        const colorVal = String(action.value).toLowerCase();
                        const targetBtn = Array.from(document.querySelectorAll('.color-btn')).find(b =>
                            (b.dataset.color || '').toLowerCase() === colorVal
                        );
                        if (targetBtn) {
                            const rect = targetBtn.getBoundingClientRect();
                            await moveCursorTo(rect.left + rect.width / 2, rect.top + rect.height / 2, 160);
                            if (!isBotRunning) break;
                            botCursor.querySelector('svg').style.transform = 'scale(0.75)';
                            // Update palette UI without firing side effects that clear canvas
                            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                            targetBtn.classList.add('active');
                            currentColor = colorVal;
                            await wait(50);
                            botCursor.querySelector('svg').style.transform = 'scale(1)';
                            await wait(40);
                        }
                    }
                } else if (action.type === 'method') {
                    const { prop, args } = action;

                    if (prop === 'fillRect') {
                        const [x, y, w, h] = args;
                        await animateFillRect(x, y, w, h);
                    } else if (prop === 'strokeRect') {
                        const [x, y, w, h] = args;
                        // Trace outline then stroke
                        const corners = [[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x, y]];
                        for (let i = 0; i < corners.length - 1; i++) {
                            if (!isBotRunning) break;
                            const [x0, y0] = corners[i];
                            const [x1, y1] = corners[i + 1];
                            const p0 = getCanvasScreenPos(x0, y0);
                            await moveCursorTo(p0.x, p0.y, i === 0 ? 120 : 50);
                            if (!isBotRunning) break;
                            await moveAlongLogical(x0, y0, x1, y1, 90);
                        }
                        drawCtx.strokeRect(x, y, w, h);
                        updateLiveScore();
                        await wait(40);
                    } else if (prop === 'clearRect') {
                        drawCtx.clearRect(...args);
                    } else if (prop === 'beginPath') {
                        pathPoints = [];
                        lastPt = null;
                        drawCtx.beginPath();
                    } else if (prop === 'moveTo') {
                        lastPt = [args[0], args[1]];
                        pathPoints = [[args[0], args[1]]];
                        const pos = getCanvasScreenPos(args[0], args[1]);
                        await moveCursorTo(pos.x, pos.y, 120);
                        drawCtx.moveTo(...args);
                    } else if (prop === 'lineTo') {
                        const from = lastPt;
                        if (from) {
                            await moveAlongLogical(from[0], from[1], args[0], args[1], 120);
                        } else {
                            const pos = getCanvasScreenPos(args[0], args[1]);
                            await moveCursorTo(pos.x, pos.y, 100);
                        }
                        drawCtx.lineTo(...args);
                        lastPt = [args[0], args[1]];
                        pathPoints.push([args[0], args[1]]);
                    } else if (prop === 'closePath') {
                        if (pathPoints.length >= 2) {
                            const first = pathPoints[0];
                            const last = pathPoints[pathPoints.length - 1];
                            await moveAlongLogical(last[0], last[1], first[0], first[1], 100);
                            lastPt = first;
                        }
                        drawCtx.closePath();
                    } else if (prop === 'arc' || prop === 'ellipse') {
                        const cx = args[0], cy = args[1];
                        const r = typeof args[2] === 'number' ? args[2] : 20;
                        await animateArcTrace(cx, cy, Math.abs(r));
                        drawCtx[prop](...args);
                        lastPt = [cx + r, cy];
                    } else if (prop === 'fill') {
                        drawCtx.fill(...args);
                        updateLiveScore();
                        await wait(70);
                    } else if (prop === 'stroke') {
                        drawCtx.stroke(...args);
                        updateLiveScore();
                        await wait(60);
                    } else if (prop === 'drawImage') {
                        // drawImage(img, dx, dy, dw, dh) or longer form
                        if (args.length >= 5) {
                            const img = args[0];
                            const dx = args[args.length === 5 ? 1 : 5];
                            const dy = args[args.length === 5 ? 2 : 6];
                            const dw = args[args.length === 5 ? 3 : 7];
                            const dh = args[args.length === 5 ? 4 : 8];
                            await animateDrawImage(img, dx, dy, dw, dh);
                        } else if (args.length >= 3) {
                            const img = args[0];
                            await animateDrawImage(img, args[1], args[2], img.width || LOGICAL_WIDTH, img.height || LOGICAL_HEIGHT);
                        }
                    } else if (prop === 'bezierCurveTo') {
                        const endX = args[4], endY = args[5];
                        if (lastPt) {
                            await moveAlongLogical(lastPt[0], lastPt[1], endX, endY, 200);
                        } else {
                            const pos = getCanvasScreenPos(endX, endY);
                            await moveCursorTo(pos.x, pos.y, 180);
                        }
                        drawCtx.bezierCurveTo(...args);
                        lastPt = [endX, endY];
                        pathPoints.push([endX, endY]);
                    } else if (prop === 'quadraticCurveTo') {
                        const endX = args[2], endY = args[3];
                        if (lastPt) {
                            await moveAlongLogical(lastPt[0], lastPt[1], endX, endY, 160);
                        } else {
                            const pos = getCanvasScreenPos(endX, endY);
                            await moveCursorTo(pos.x, pos.y, 140);
                        }
                        drawCtx.quadraticCurveTo(...args);
                        lastPt = [endX, endY];
                        pathPoints.push([endX, endY]);
                    } else if (prop === 'fillText') {
                        const x = args[1], y = args[2];
                        const pos = getCanvasScreenPos(x, y);
                        await moveCursorTo(pos.x, pos.y, 140);
                        drawCtx.fillText(...args);
                        updateLiveScore();
                        await wait(50);
                    } else if (prop === 'strokeText') {
                        const x = args[1], y = args[2];
                        const pos = getCanvasScreenPos(x, y);
                        await moveCursorTo(pos.x, pos.y, 140);
                        drawCtx.strokeText(...args);
                        updateLiveScore();
                    } else if (prop === 'save' || prop === 'restore' || prop === 'clip' ||
                               prop === 'translate' || prop === 'rotate' || prop === 'scale' ||
                               prop === 'setTransform' || prop === 'resetTransform' ||
                               prop === 'transform') {
                        // Critical transform / state methods — never skip
                        drawCtx[prop](...args);
                    } else {
                        // Any other canvas method — apply so nothing is forgotten
                        try {
                            const result = drawCtx[prop](...args);
                            // If it returned a path-ish thing we ignore it
                        } catch (_) {}
                    }
                }
            }

            updateLiveScore();
            await wait(450);
            abortBot();
        }

        // Initialize on load
        window.onload = () => {
            initCanvas();
            setupListeners();
        };

        // Handle window resize to keep canvas looking sharp despite CSS scaling
        window.addEventListener('resize', () => {
            // Note: because we use logical resolution vs CSS size, 
            // we don't necessarily need to redraw on resize, CSS handles it.
            // But if drawing gets weird on device orientation change, uncomment:
            // initCanvas(); 
        });

    </script>
</body>
