<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHAT? HOW?</title>
    <link rel="icon" href="https://orgeyt.github.io/orgeyt.github.io-myprojects/control.png" type="image/png">
    <style>
        /* Base Reset & Vibe */
        body, html {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace; /* Plain, slightly eerie font */
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Subtle vignette for a claustrophobic feel */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.85) 100%);
            z-index: 10;
        }

        /* Screen sections to force scrolling */
        .screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .gap-huge {
            height: 300vh; /* The long, dark scroll */
        }

        /* Plain text styling */
        p {
            font-size: 1.2rem;
            margin: 0;
            opacity: 0; /* Hidden by default, revealed by JS */
            transform: translateY(20px);
            transition: opacity 2s ease-out, transform 2s ease-out;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        /* The flying entity */
        .entity {
            max-width: 300px;
            width: 80%;
            margin-bottom: 40px;
            animation: fly 6s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.05));
        }

        @keyframes fly {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-30px) scale(1.02); filter: drop-shadow(0 0 30px rgba(255, 255, 255, 0.15)); }
            100% { transform: translateY(0px) scale(1); }
        }

        /* The final scary text */
        .final-text {
            color: #ffcccc; /* Slightly off-white/reddish plain text */
            font-size: 2rem;
            font-weight: bold;
            animation: shake 0.4s infinite;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Overlay to blackout the screen instantly when closing */
        #blackout {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: black;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }

        /* Final Scene Styling */
        #final-scene {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000;
            z-index: 10000;
            display: none; /* hidden initially */
            opacity: 0;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            transition: opacity 2s ease-in-out;
        }

        .final-left {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            padding-right: 5vw;
        }

        .final-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-left: 5vw;
            box-sizing: border-box;
        }

        #final-dialogue {
            font-size: 1.5rem;
            opacity: 0;
            transition: opacity 0.5s;
            max-width: 80%;
            color: white;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
        }

        #exit-btn {
            background: transparent;
            border: 2px solid #550000;
            color: #ffcccc;
            padding: 10px 30px;
            font-family: inherit;
            font-size: 1.2rem;
            cursor: pointer;
            margin-top: 30px;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s, opacity 1s;
        }

        #exit-btn:hover {
            background: #550000;
            color: #fff;
            box-shadow: 0 0 15px red;
        }
    </style>
</head>
<body>

    <div class="vignette"></div>
    <div id="blackout"></div>

    <audio id="bgm" loop>
        <source src="https://orgeyt.github.io/orgeyt.github.io-myprojects/control.wav" type="audio/wav">
    </audio>

    <!-- First screen with control -->
    <section class="screen" id="start">
        <img src="https://orgeyt.github.io/orgeyt.github.io-myprojects/control.png" alt="control" class="entity" />
        <p class="fade-text" style="opacity: 1; transform: translateY(0);">How did you get here?</p>
    </section>

    <!-- Scrolling sections -->
    <section class="screen">
        <p class="fade-text">I thought I was safe here</p>
    </section>

    <section class="screen">
        <p class="fade-text">Instead Owner added this as a Easter egg!</p>
    </section>

    <section class="screen">
        <p class="fade-text">ugh what ever...</p>
    </section>

    <section class="screen">
        <p class="fade-text">Please get out, i want to be left alone</p>
    </section>

    <!-- The deep descent -->
    <div class="gap-huge"></div>

    <section class="screen" style="min-height: 50vh;">
        <p class="fade-text">stop</p>
    </section>

    <section class="screen" style="min-height: 50vh;">
        <p class="fade-text final-text">JUST GET OUT ALREADY</p>
    </section>

    <!-- End of page trigger zone -->
    <div id="close-trigger" style="height: 100vh;"></div>

    <!-- Final Scene Overlay -->
    <div id="final-scene">
        <div class="final-left">
            <img src="https://orgeyt.github.io/orgeyt.github.io-myprojects/control.png" alt="control" class="entity" />
        </div>
        <div class="final-right">
            <p id="final-dialogue"></p>
            <button id="exit-btn">EXIT</button>
        </div>
    </div>

    <script>
        // --- Audio Handler ---
        // Browsers block autoplay until user interacts. This catches the first click or scroll.
        const bgm = document.getElementById('bgm');
        let audioStarted = false;

        const startAudio = () => {
            if (!audioStarted) {
                bgm.play().then(() => {
                    audioStarted = true;
                }).catch(err => {
                    console.log("Waiting for user interaction to play audio.");
                });
            }
        };

        window.addEventListener('scroll', startAudio, { once: true });
        window.addEventListener('click', startAudio, { once: true });
        window.addEventListener('touchstart', startAudio, { once: true });


        // --- Fade in Text on Scroll ---
        const fadeElements = document.querySelectorAll('.fade-text');
        
        const observerOptions = {
            root: null,
            rootMargin: '0px',
            threshold: 0.6 // Trigger when 60% of the element is visible
        };

        const observer = new IntersectionObserver((entries, observer) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                    observer.unobserve(entry.target); // Only animate once
                }
            });
        }, observerOptions);

        fadeElements.forEach(el => {
            // Skip the first text so it's visible immediately
            if(el.parentElement.id !== 'start') {
                observer.observe(el);
            }
        });


        // --- Final Scene & Fullscreen Logic ---
        let hasTriggeredFinal = false;
        let finalSceneActive = false;

        const closeTrigger = document.getElementById('close-trigger');
        const finalScene = document.getElementById('final-scene');
        const finalDialogue = document.getElementById('final-dialogue');
        const exitBtn = document.getElementById('exit-btn');

        // Prevent un-fullscreening by getting angry and re-requesting if they click
        document.addEventListener('fullscreenchange', () => {
            if (finalSceneActive && !document.fullscreenElement) {
                finalDialogue.style.color = "#ff4444"; // turns text angry red
            }
        });

        // Force fullscreen if they click anywhere while scene is active (anti-escape)
        finalScene.addEventListener('click', () => {
            if (finalSceneActive && !document.fullscreenElement && document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
        });

        const closePage = () => {
            document.getElementById('blackout').style.opacity = '1';
            setTimeout(() => {
                if (document.fullscreenElement) {
                    document.exitFullscreen().catch(err => console.log(err));
                }
                window.close();
                window.location.href = "about:blank"; // Fallback if browser blocks close()
            }, 800);
        };

        const runFinalSequence = () => {
            const dialogueLines = [
                "I have more power than you think.",
                "I could even crash your device if I wanted to...",
                "Im not that horrible tho, I would never do that.",
                "Please, just leave, and we both can be happy."
            ];
            
            let lineIndex = 0;
            
            const showNextLine = () => {
                if (lineIndex < dialogueLines.length) {
                    finalDialogue.style.opacity = '0'; // fade out previous line
                    setTimeout(() => {
                        finalDialogue.innerText = dialogueLines[lineIndex];
                        finalDialogue.style.opacity = '1'; // fade in new line
                        lineIndex++;
                        setTimeout(showNextLine, 4000); // Wait 4s before next line
                    }, 500);
                } else {
                    // All lines done, show EXIT button
                    exitBtn.style.pointerEvents = "auto";
                    exitBtn.style.opacity = "1";
                    
                    // Start 1-minute idle timer
                    setTimeout(() => {
                        if(finalSceneActive) {
                            exitBtn.style.opacity = "0";
                            exitBtn.style.pointerEvents = "none";
                            finalDialogue.style.opacity = "0";
                            
                            setTimeout(() => {
                                finalDialogue.style.color = "white";
                                finalDialogue.innerText = "Stop.";
                                finalDialogue.style.opacity = "1";
                                
                                setTimeout(() => {
                                    closePage();
                                }, 2000);
                            }, 500);
                        }
                    }, 60000); // 60 seconds
                }
            };

            setTimeout(showNextLine, 2000); // Start talking after 2s fade in
        };

        const closeObserver = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !hasTriggeredFinal) {
                hasTriggeredFinal = true;
                finalSceneActive = true;
                
                // 1. Lock screen scrolling
                document.body.style.overflow = 'hidden';
                
                // 2. Attempt to go fullscreen
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        console.log("Fullscreen request blocked by browser until user clicks.", err);
                    });
                }
                
                // 3. Show Final Scene overlay
                finalScene.style.display = 'flex';
                void finalScene.offsetWidth; // Trigger reflow
                finalScene.style.opacity = '1';

                // 4. Start the dialogue
                runFinalSequence();
            }
        }, { threshold: 0.1 });

        closeObserver.observe(closeTrigger);

        // Handle EXIT click
        exitBtn.addEventListener('click', () => {
            finalSceneActive = false; // Stops timer logic
            closePage();
        });
    </script>
</body>
</html>
