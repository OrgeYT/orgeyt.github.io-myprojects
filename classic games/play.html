<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing – Classic Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: 'VT323', monospace;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      background: #12121f;
      border-bottom: 2px solid #2a2a40;
      flex-shrink: 0;
      z-index: 100;
    }

    .topbar h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.75rem;
      color: #00f5d4;
      max-width: 55%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .topbar a, .topbar button {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
      color: #e8e8f0;
      background: transparent;
      border: 1px solid #2a2a40;
      padding: 0.4rem 0.7rem;
      text-decoration: none;
      cursor: pointer;
      margin-left: 0.4rem;
    }

    .topbar a:hover, .topbar button:hover {
      border-color: #00f5d4;
      color: #00f5d4;
    }

    /* Full remaining space — same scale as uploaded games */
    .game-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #000;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }

    .emulator-box {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      position: relative;
      border: none;
      background: #000;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    /* Let EmulatorJS manage its own layout (canvas + bottom menu) */
    #game {
      width: 100%;
      height: 100%;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .error-msg {
      color: #ff6b8a;
      font-size: 1.2rem;
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1 id="title">Loading…</h1>
    <div>
      <button id="fs-btn">Fullscreen</button>
      <a href="index.html">← Library</a>
    </div>
  </div>

  <div class="game-area">
    <div class="emulator-box">
      <div id="game"></div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    function resolveGame(raw, systems) {
      const sys = (systems && systems[raw.system]) || {};
      const folder = sys.folder || raw.system;
      const core = raw.core || sys.core || raw.system;
      return {
        id: raw.id,
        title: raw.title,
        system: raw.system,
        core: core,
        rom: raw.rom || ("roms/" + folder + "/" + raw.file),
        year: raw.year || "",
        hack: !!raw.hack,
        homebrew: !!raw.homebrew
      };
    }

    function startGame(game) {
      document.getElementById("title").textContent = game.title;
      document.title = game.title + " – Classic Games";

      window.EJS_player = "#game";
      window.EJS_core = game.core;
      window.EJS_gameUrl = game.rom;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_color = "#00f5d4";
      window.EJS_startOnLoaded = true;
      window.EJS_gameName = game.title;
      window.EJS_fullscreenOnLoaded = false;

      const isDuckHunt = (game.rom || "").toLowerCase().indexOf("duckhunt") !== -1;
      window.EJS_lightgun = isDuckHunt;

      const s = document.createElement("script");
      s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      s.onerror = function () {
        document.getElementById("title").textContent = "Failed to load EmulatorJS";
        document.querySelector(".emulator-box").innerHTML =
          '<p class="error-msg">Could not load EmulatorJS from CDN.<br>Check your internet connection.</p>';
      };
      document.body.appendChild(s);
    }

    function fail(msg) {
      document.getElementById("title").textContent = msg || "Error";
      setTimeout(function () { location.href = "index.html"; }, 2000);
    }

    if (id === "upload") {
      // Legacy path — uploads now run on index.html
      fail("Upload session expired — use Upload on the library page");
    } else {
      fetch("roms.json")
        .then(function (r) {
          if (!r.ok) throw new Error("roms.json missing");
          return r.json();
        })
        .then(function (data) {
          const systems = data.systems || {};
          const games = (data.games || []).map(function (g) { return resolveGame(g, systems); });
          const game = games.find(function (g) { return g.id === id; });
          if (!game) {
            fail("Game not found");
            return;
          }
          startGame(game);
        })
        .catch(function () {
          fail("Failed to load roms.json");
        });
    }

    document.getElementById("fs-btn").addEventListener("click", function () {
      const el = document.querySelector(".emulator-box");
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    });
  </script>
</body>
</html>
