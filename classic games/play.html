<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing – Classic Games</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      font-family: 'VT323', monospace;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.6rem 1rem;
      background: #12121f;
      border-bottom: 2px solid #2a2a40;
      flex-shrink: 0;
      z-index: 100;
    }

    .topbar h1 {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.75rem;
      color: #00f5d4;
    }

    .topbar a, .topbar button {
      font-family: 'Press Start 2P', cursive;
      font-size: 0.55rem;
      color: #e8e8f0;
      background: transparent;
      border: 1px solid #2a2a40;
      padding: 0.4rem 0.7rem;
      text-decoration: none;
      cursor: pointer;
      margin-left: 0.4rem;
    }

    .topbar a:hover, .topbar button:hover {
      border-color: #00f5d4;
      color: #00f5d4;
    }

    .game-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      min-height: 0;
      padding: 0.5rem;
      overflow: hidden;
    }

    .emulator-box {
      width: min(96vw, calc((100vh - 70px) * 4 / 3));
      height: min(calc(100vh - 70px), 72vw);
      aspect-ratio: 4 / 3;
      position: relative;
      border: 2px solid #2a2a40;
      box-shadow: 0 0 24px rgba(0, 245, 212, 0.12);
      background: #000;
      flex-shrink: 0;
    }

    #game {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>

<body>
  <div class="topbar">
    <h1 id="title">Loading…</h1>

    <div>
      <button id="fs-btn">Fullscreen</button>
      <a href="index.html">← Library</a>
    </div>
  </div>

  <div class="game-area">
    <div class="emulator-box">
      <div id="game"></div>
    </div>
  </div>

  <script src="js/games.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");
    const game = GAMES.find(g => g.id === id);

    if (!game) {
      document.getElementById("title").textContent = "Game not found";
      setTimeout(() => location.href = "index.html", 1500);
    } else {
      document.getElementById("title").textContent = game.title;
      document.title = game.title + " – Classic Games";

      window.EJS_player = "#game";
      window.EJS_core = game.core;
      window.EJS_gameUrl = game.rom;
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_color = "#00f5d4";
      window.EJS_startOnLoaded = true;
      window.EJS_gameName = game.title;
      window.EJS_fullscreenOnLoaded = false;

      const s = document.createElement("script");
      s.src = "https://cdn.emulatorjs.org/stable/data/loader.js";
      document.body.appendChild(s);
    }

    document.getElementById("fs-btn").addEventListener("click", () => {
      const el = document.querySelector(".emulator-box");

      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    });
  </script>
</body>
</html>
