<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMMM Plus</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #1e1e1e;
            color: #f0f0f0;
            padding-top: 100px;
        }

        h1 {
            margin-bottom: 30px;
            font-size: 2.5rem;
        }

        .play-button {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .play-button:hover {
            background-color: #45a049;
            transform: translateY(-2px);
        }

        .play-button:active {
            transform: translateY(1px);
        }

        .notes-container {
            margin-top: 40px;
            font-size: 16px;
            color: #aaaaaa;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h1>CMMM Plus</h1>

    <!-- target="_blank" is what forces the link to open in a new tab -->
    <a href="https://html-classic.itch.zone/html/7627238/index.html" target="_blank" class="play-button">Play</a>

    <div class="notes-container">
        <p>I cannot embed this, it won't let me ;-;</p>
        <p>when i tried to embed the game screen was black.</p>
        <p><em>Credits to Traloc_Dheckoa for the game</em></p>
    </div>

</body>
</html>
