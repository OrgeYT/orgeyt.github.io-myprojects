<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pass the Bomb 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="nametags-container"></div>

    <div id="game-ui" class="hidden flex flex-col justify-between p-4">
        <div class="flex justify-center">
            <button id="btn-skip-intro" class="btn hidden bg-white/90 text-black font-bold text-sm px-4 py-2 rounded-lg border border-white">
                Skip Intro (Enter)
            </button>
        </div>
        <div class="flex justify-between items-end">
            <div class="text-white/80 font-bold bg-black/40 px-4 py-2 rounded-lg" id="ui-mode-text">
                WASD to Move | Mouse to Look | Scroll to Zoom | Click to Target (Spectator)
            </div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="z-50">
        <div class="glass-panel p-10 flex flex-col items-center max-w-md w-full text-white">
            <h1 class="game-title text-5xl font-black mb-2 text-transparent bg-clip-text bg-gradient-to-r from-red-500 to-yellow-500 text-center uppercase" style="filter: drop-shadow(0 4px 2px rgba(0,0,0,0.5));">Pass the Bomb<br>3D</h1>
            <p class="mb-8 font-semibold text-gray-300">Don't be left holding it!</p>

            <div class="w-full space-y-4 mb-8">
                <div>
                    <label class="block text-sm font-bold mb-1">Mode:</label>
                    <div class="flex gap-2">
                        <button id="mode-play" class="flex-1 py-2 rounded bg-red-600 font-bold border-2 border-red-400">Play</button>
                        <button id="mode-spectate" class="flex-1 py-2 rounded bg-gray-700 font-bold border-2 border-gray-500 hover:bg-gray-600">Spectate</button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-1">Your Name:</label>
                    <div class="flex gap-2">
                        <input type="text" id="player-name" maxlength="20" class="flex-1 bg-black/40 border border-gray-500 text-white px-3 py-2 rounded outline-none" placeholder="User">
                        <button id="btn-random-name" class="btn px-3 py-2 rounded bg-purple-600 border-2 border-purple-400 hover:bg-purple-700" title="Random NPC name">🎲</button>
                    </div>
                </div>
                
                <button id="btn-settings" class="btn w-full bg-gray-700 text-white font-bold py-3 rounded-lg border-2 border-gray-500 hover:bg-gray-600 flex items-center justify-center gap-2">
                    ⚙️ Game Settings
                </button>
                <button id="btn-customize" class="btn w-full bg-blue-600 text-white font-bold py-3 rounded-lg border-2 border-blue-400 hover:bg-blue-700 flex items-center justify-center gap-2">
                    👕 Customize Player
                </button>
                <div class="flex gap-2">
                    <button id="btn-sfx" class="btn flex-1 py-3 rounded-lg border-2 border-gray-500 flex items-center justify-center gap-2 font-bold" style="background:#4b5563;color:#fff;">
                        🔔 SFX
                    </button>
                    <button id="btn-music" class="btn flex-1 py-3 rounded-lg border-2 border-gray-500 flex items-center justify-center gap-2 font-bold" style="background:#4b5563;color:#fff;">
                        🎵 Music
                    </button>
                </div>
            </div>

            <button id="btn-start" class="btn w-full bg-gradient-to-r from-green-400 to-emerald-600 text-white font-black text-2xl py-4 rounded-xl shadow-lg border border-green-300 uppercase tracking-wide">
                Start Game
            </button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="hidden z-50">
        <div class="glass-panel p-8 flex flex-col items-center max-w-2xl w-full text-white max-h-[90vh] overflow-hidden">
            <h1 class="text-3xl font-black mb-6 uppercase border-b-2 border-white/20 pb-2 w-full text-center">Game Settings</h1>
            
            <div class="w-full flex flex-col md:flex-row gap-6 overflow-hidden h-full">
                <div class="flex-1 space-y-4 overflow-y-auto pr-2 pb-2">
                    <div>
                        <label class="flex justify-between font-bold mb-1">Bots: <span id="npc-val" class="text-yellow-400">5</span></label>
                        <input type="range" id="setting-npcs" min="0" max="100" value="5" class="w-full accent-red-500">
                    </div>
                    <div>
                        <label class="flex justify-between font-bold mb-1">Bomb Timer: <span id="timer-val" class="text-yellow-400">10</span></label>
                        <input type="range" id="setting-timer" min="5" max="20" value="10" class="w-full accent-red-500">
                    </div>
                    <div>
                        <label class="flex justify-between font-bold mb-1">Max Jumps: <span id="jumps-val" class="text-yellow-400">2</span></label>
                        <input type="range" id="setting-jumps" min="1" max="10" value="2" class="w-full accent-red-500">
                    </div>
                    <div>
                        <label class="flex justify-between font-bold mb-1">Map Size: <span id="mapsize-val" class="text-yellow-400">100</span></label>
                        <input type="range" id="setting-mapsize" min="15" max="350" step="1" value="100" class="w-full accent-red-500">
                    </div>
                    <div>
                        <label class="flex justify-between font-bold mb-1">Platform Multiplier: <span id="platmulti-val" class="text-yellow-400">1x</span></label>
                        <input type="range" id="setting-platmulti" min="0" max="3" step="0.5" value="1" class="w-full accent-red-500">
                    </div>
                    <div>
                        <label class="flex justify-between font-bold mb-1 items-center">Walls: <span id="walls-val" class="text-yellow-400 mr-2">On</span></label>
                        <input type="checkbox" id="setting-walls" checked class="w-6 h-6 accent-red-500 cursor-pointer">
                    </div>
                    <div>
                        <label class="flex justify-between font-bold mb-1 items-center">Platforms: <span id="platforms-val" class="text-yellow-400 mr-2">On</span></label>
                        <input type="checkbox" id="setting-platforms" checked class="w-6 h-6 accent-red-500 cursor-pointer">
                    </div>
                    <div>
                        <label class="flex justify-between font-bold mb-1 items-center">Easier Bots Mode: <span id="easierbots-val" class="text-yellow-400 mr-2">Off</span></label>
                        <input type="checkbox" id="setting-easierbots" class="w-6 h-6 accent-red-500 cursor-pointer">
                    </div>
                </div>

                <div class="flex-1 flex flex-col h-full min-h-[200px]">
                    <div class="flex justify-between items-center mb-2">
                        <label class="font-bold">Active Bot Names:</label>
                        <div class="flex gap-2">
                            <button id="btn-names-all" class="text-xs bg-gray-600 hover:bg-gray-500 px-2 py-1 rounded">All</button>
                            <button id="btn-names-none" class="text-xs bg-gray-600 hover:bg-gray-500 px-2 py-1 rounded">None</button>
                        </div>
                    </div>
                    <div id="npc-names-list" class="flex-1 overflow-y-auto bg-black/30 p-2 rounded border border-white/10 grid grid-cols-2 gap-1 content-start">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>

            <button id="btn-settings-back" class="btn mt-6 w-full bg-gray-700 text-white font-bold text-lg py-3 rounded-xl shadow-lg border-2 border-gray-500 hover:bg-gray-600">
                Back to Menu
            </button>
        </div>
    </div>

    <!-- Customize Menu -->
    <div id="customize-menu" class="hidden z-50">
        <div class="glass-panel p-8 flex flex-col items-center max-w-md w-full text-white">
            <h1 class="text-3xl font-black mb-6 uppercase border-b-2 border-white/20 pb-2 w-full text-center">Customize</h1>
            
            <div id="preview-3d" class="w-48 h-48 mb-6 rounded-xl border-2 border-white/20 bg-black/40 overflow-hidden relative shadow-inner flex items-center justify-center"></div>

            <div class="w-full space-y-5">
                <div class="flex justify-between items-center bg-black/20 p-3 rounded border border-white/10">
                    <label class="font-bold">Roblox Styled: <span id="roblox-val" class="text-yellow-400 ml-1">Off</span></label>
                    <input type="checkbox" id="setting-roblox" class="w-6 h-6 accent-red-500 cursor-pointer">
                </div>
                <div id="roblox-colors-container" class="space-y-5 hidden">
                    <div class="flex justify-between items-center bg-black/20 p-3 rounded border border-white/10">
                        <label class="font-bold text-sm">Head & Arms:</label>
                        <input type="color" id="edit-head-color" value="#ffab66" class="w-12 h-12 cursor-pointer bg-transparent border-0 rounded">
                    </div>
                    <div class="flex justify-between items-center bg-black/20 p-3 rounded border border-white/10">
                        <label class="font-bold text-sm">Legs:</label>
                        <input type="color" id="edit-leg-color" value="#000000" class="w-12 h-12 cursor-pointer bg-transparent border-0 rounded">
                    </div>
                </div>
                <div class="flex justify-between items-center bg-black/20 p-3 rounded border border-white/10">
                    <label class="font-bold">Body Color:</label>
                    <input type="color" id="edit-body-color" value="#22c55e" class="w-12 h-12 cursor-pointer bg-transparent border-0 rounded">
                </div>
                <div class="flex justify-between items-center bg-black/20 p-3 rounded border border-white/10">
                    <label class="font-bold">Eye Color:</label>
                    <input type="color" id="edit-eye-color" value="#000000" class="w-12 h-12 cursor-pointer bg-transparent border-0 rounded">
                </div>
                <div class="flex justify-between items-center bg-black/20 p-3 rounded border border-white/10">
                    <label class="font-bold">Hat:</label>
                    <select id="edit-hat" class="bg-gray-700 text-white p-2 rounded outline-none border border-gray-500 font-semibold cursor-pointer">
                        <option value="none">None</option>
                        <option value="santa">Santa Hat</option>
                        <option value="cone">Traffic Cone</option>
                        <option value="beanie">Beanie</option>
                        <option value="bomb">Bomb Hat</option>
                        <option value="crown">OrgeYT's Crown</option>
                        <option value="cap">Baseball Cap</option>
                        <option value="tophat">Top Hat</option>
                        <option value="party">Party Hat</option>
                        <option value="wizard">Wizard Hat</option>
                        <option value="sombrero">Sombrero</option>
                        <option value="propeller">Propeller Cap</option>
                        <option value="headphones">Headphones</option>
                    </select>
                </div>
                <div class="flex justify-between items-center bg-black/20 p-3 rounded border border-white/10">
                    <label class="font-bold text-sm">Hat Color:</label>
                    <input type="color" id="edit-hat-color" value="#ff0000" class="w-12 h-12 cursor-pointer bg-transparent border-0 rounded opacity-30" disabled>
                </div>
            </div>

            <button id="btn-customize-back" class="btn mt-8 w-full bg-blue-600 text-white font-bold text-lg py-3 rounded-xl shadow-lg border-2 border-blue-400 hover:bg-blue-700">
                Save & Back
            </button>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over" class="hidden z-50">
        <div class="glass-panel p-10 flex flex-col items-center max-w-md w-full text-white">
            <h1 id="game-over-title" class="text-5xl font-black mb-4 text-center">Game Over</h1>
            <p id="game-over-desc" class="mb-8 text-xl font-bold text-center">Winner: Red</p>
            <button id="btn-menu" class="btn w-full bg-white text-black font-black text-xl py-3 rounded-xl shadow-lg uppercase">
                Back to Menu
            </button>
        </div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="hidden z-50">
        <div class="glass-panel p-10 flex flex-col items-center max-w-md w-full text-white">
            <h1 class="text-5xl font-black mb-8 text-center uppercase tracking-widest">Paused</h1>
            <div class="w-full space-y-4">
                <button id="btn-resume" class="btn w-full bg-gradient-to-r from-green-400 to-emerald-600 text-white font-black text-2xl py-4 rounded-xl shadow-lg border border-green-300 uppercase tracking-wide">
                    Resume Game
                </button>
                <button id="btn-quit" class="btn w-full bg-red-600 text-white font-black text-xl py-3 rounded-xl shadow-lg border border-red-50 hover:bg-red-700 uppercase">
                    Quit to Menu
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
