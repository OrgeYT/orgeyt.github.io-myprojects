<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magnet Physics Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <button id="toggle-ui-btn">
    <svg id="toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    <span id="toggle-text">Menu</span>
  </button>

  <div class="sidebar" id="sidebar">
    <div class="p-6 pb-2 text-white font-bold text-xl flex items-center gap-2">
      <div class="w-6 h-6 bg-indigo-500 rounded-md"></div>
      Lab Controls
    </div>

    <div class="control-group mt-4">
      <span class="slider-label">
        Magnetic Force <span id="strength-val" class="text-indigo-400">Med</span>
      </span>
      <input type="range" id="strength-slider" min="200" max="8000" value="1500" step="100" class="accent-indigo-500">
    </div>

    <div class="control-group">
      <span class="slider-label">Dynamic Objects</span>
      <div class="grid grid-cols-2 gap-2">
        <button class="btn" data-action="spawn" data-type="dipole">Bar Magnet</button>
        <button class="btn" data-action="spawn" data-type="ring">Ring</button>
        <button class="btn" data-action="spawn" data-type="quad">Quad</button>
        <button class="btn btn-neutral" data-action="spawn" data-type="lead">Neutral Block</button>
        <button class="btn btn-n" data-action="spawn" data-type="north">N-Mono</button>
        <button class="btn btn-s" data-action="spawn" data-type="south">S-Mono</button>
        <button class="btn btn-omni col-span-2" data-action="spawn" data-type="omni">Gravity Well (Attracts All)</button>
      </div>
      <div class="flex flex-col gap-2 mt-2">
        <button class="btn btn-special" data-action="chain">Spawn Magnet Chain</button>
        <button id="rem-mag-btn" class="btn btn-remove w-full" data-action="mode" data-mode="remove-mag">Remove Object</button>
      </div>
    </div>

    <div class="control-group">
      <span class="slider-label">Static Structures</span>
      <div class="grid grid-cols-2 gap-2">
        <button id="wall-n-btn" class="btn btn-n" data-action="mode" data-mode="wall-n">+ N Wall</button>
        <button id="wall-s-btn" class="btn btn-s" data-action="mode" data-mode="wall-s">+ S Wall</button>
        <button id="wall-plain-btn" class="btn" data-action="mode" data-mode="wall-plain">+ Neutral</button>
        <button id="remove-btn" class="btn btn-remove" data-action="mode" data-mode="remove-wall">Remove Wall</button>
      </div>
    </div>

    <div class="mt-auto p-4">
      <button id="reset-btn" class="btn w-full bg-red-900/30 border-red-500/30">Reset Laboratory</button>
    </div>
  </div>

  <div class="game-wrapper" id="game-wrapper">
    <canvas id="canvas"></canvas>
    <div class="instructions">DRAG objects to interact • Multi-step physics enabled</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
