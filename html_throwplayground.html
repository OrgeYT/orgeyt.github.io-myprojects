<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Throw Playground</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            cursor: pointer;
            z-index: 1000;
        }

        #instructions {
            padding: 40px;
            background: rgba(20, 20, 20, 0.9);
            border: 2px solid #555;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            margin-top: 0;
            font-size: 48px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffcc00;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: #ddd;
        }

        .key {
            display: inline-block;
            background: #fff;
            color: #000;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin: 0 2px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            z-index: 100;
        }

        #crosshair::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
        }

        #chargeContainer {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            height: 24px;
            background: rgba(0,0,0,0.5);
            border: 3px solid #fff;
            border-radius: 12px;
            z-index: 100;
            display: none;
            overflow: hidden;
        }

        #chargeBar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #ff0000);
            transition: width 0.05s linear;
        }

        /* Mini Preview Styling */
        #throwPreview {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 240px;
            height: 160px;
            border: 3px solid #ffcc00;
            border-radius: 8px;
            background: #000;
            display: none;
            overflow: hidden;
            z-index: 200;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }

        #previewLabel {
            position: absolute;
            top: 5px;
            left: 5px;
            background: rgba(0,0,0,0.7);
            color: #ffcc00;
            padding: 2px 6px;
            font-size: 10px;
            font-weight: bold;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="blocker">
        <div id="instructions">
            <h1>Throw Playground</h1>
            <p style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">Click to Play</p>
            <p>
                <span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> to Move<br>
                <span class="key">SPACE</span> to Jump<br>
                <strong>Mouse</strong> to Look around<br><br>
                <span class="key">Z</span> or <strong>Left Click</strong> to Grab<br>
                Hold <span class="key">Z</span> or <strong>Click</strong> to Charge, Release to Throw!
            </p>
        </div>
    </div>

    <div id="crosshair"></div>
    
    <div id="chargeContainer">
        <div id="chargeBar"></div>
    </div>

    <div id="throwPreview">
        <div id="previewLabel">Live Tracking</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let world, playerBody;
        
        // Preview Window variables
        let previewRenderer, previewCamera, trackedObject = null, previewTimer = 0;

        const cpus = [];
        const grabbableMeshes = [];
        const clock = new THREE.Clock();
        
        const keys = { w: false, a: false, s: false, d: false, space: false };
        let canJump = false;

        let holdingObject = null;
        let isZDown = false;
        let isMouseDown = false;
        let zAction = 'idle'; 
        let throwCharge = 0;
        const MAX_CHARGE = 100;
        const raycaster = new THREE.Raycaster();

        let leftHand, rightHand;
        let handBobTime = 0;
        let throwAnimTimer = 0; // Timer for the "thrust" animation

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb);
            scene.fog = new THREE.Fog(0x87ceeb, 20, 100);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            scene.add(camera);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // Setup Mini Preview Renderer
            const previewContainer = document.getElementById('throwPreview');
            previewRenderer = new THREE.WebGLRenderer({ antialias: true });
            previewRenderer.setSize(240, 160);
            previewContainer.appendChild(previewRenderer.domElement);
            previewCamera = new THREE.PerspectiveCamera(60, 240 / 160, 0.1, 500);

            controls = new PointerLockControls(camera, document.body);
            const blocker = document.getElementById('blocker');
            const instructions = document.getElementById('instructions');

            instructions.addEventListener('click', () => controls.lock());
            controls.addEventListener('lock', () => {
                instructions.style.display = 'none';
                blocker.style.display = 'none';
            });
            controls.addEventListener('unlock', () => {
                blocker.style.display = 'flex';
                instructions.style.display = '';
            });

            const ambient = new THREE.AmbientLight(0x555555);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(50, 100, 50);
            dirLight.castShadow = true;
            dirLight.shadow.camera.top = 100;
            dirLight.shadow.camera.bottom = -100;
            dirLight.shadow.camera.left = -100;
            dirLight.shadow.camera.right = 100;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            world = new CANNON.World();
            world.gravity.set(0, -30, 0); 
            world.broadphase = new CANNON.NaiveBroadphase();
            world.solver.iterations = 10;

            const physicsMaterial = new CANNON.Material("standard");
            const contactMaterial = new CANNON.ContactMaterial(
                physicsMaterial, physicsMaterial, 
                { friction: 0.1, restitution: 0.1 }
            );
            world.addContactMaterial(contactMaterial);

            createEnvironment(physicsMaterial);

            // Player Physics
            const playerShape = new CANNON.Sphere(0.8);
            playerBody = new CANNON.Body({ 
                mass: 5, 
                shape: playerShape, 
                material: physicsMaterial,
                linearDamping: 0.1,
                fixedRotation: true
            });
            playerBody.position.set(0, 5, 0);
            world.addBody(playerBody);

            const contactNormal = new CANNON.Vec3();
            world.addEventListener("postStep", () => {
                for(let i=0; i<world.contacts.length; i++){
                    let c = world.contacts[i];
                    if(c.bi === playerBody || c.bj === playerBody){
                        if(c.bi === playerBody) c.ni.negate(contactNormal);
                        else contactNormal.copy(c.ni);
                        if(contactNormal.y > 0.5) canJump = true; 
                    }
                }
            });

            const handGeo = new THREE.SphereGeometry(0.15, 16, 16);
            const handMat = new THREE.MeshLambertMaterial({ color: 0xffccaa });
            
            leftHand = new THREE.Mesh(handGeo, handMat);
            leftHand.position.set(-0.35, -0.2, -0.6);
            camera.add(leftHand);

            rightHand = new THREE.Mesh(handGeo, handMat);
            rightHand.position.set(0.35, -0.2, -0.6);
            camera.add(rightHand);

            // Initial Spawn
            for(let i=0; i<12; i++) {
                createCPU((Math.random() - 0.5) * 80, 5, (Math.random() - 0.5) * 80, physicsMaterial);
            }
            for(let i=0; i<20; i++) {
                createBall((Math.random() - 0.5) * 80, 5, (Math.random() - 0.5) * 80, physicsMaterial);
            }
            for(let i=0; i<20; i++) {
                createBox((Math.random() - 0.5) * 80, 5, (Math.random() - 0.5) * 80, 1.2, 1.2, 1.2, physicsMaterial);
            }

            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            document.addEventListener('mousedown', onMouseDown);
            document.addEventListener('mouseup', onMouseUp);
            window.addEventListener('resize', onWindowResize);
        }

        function createEnvironment(material) {
            const groundGeo = new THREE.PlaneGeometry(100, 100);
            const groundMat = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
            const groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            const grid = new THREE.GridHelper(100, 50, 0x000000, 0x000000);
            grid.material.opacity = 0.2;
            grid.material.transparent = true;
            scene.add(grid);

            const groundShape = new CANNON.Plane();
            const groundBody = new CANNON.Body({ mass: 0, material: material });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
            world.addBody(groundBody);

            // Boundary Walls
            createWall(0, 10, -50, 100, 20, 2, material);
            createWall(0, 10, 50, 100, 20, 2, material);
            createWall(-50, 10, 0, 2, 20, 100, material);
            createWall(50, 10, 0, 2, 20, 100, material);

            // Scattered Static Obstacles / Platforms
            for(let i=0; i<15; i++) {
                let w = 2 + Math.random() * 4;
                let h = 2 + Math.random() * 6;
                let d = 2 + Math.random() * 4;
                let x = (Math.random() - 0.5) * 80;
                let z = (Math.random() - 0.5) * 80;
                createWall(x, h/2, z, w, h, d, material, true);
            }

            // ADDED: Specific jumping platforms
            createPlatform(10, 3, 10, 6, 1, 6, material);
            createPlatform(10, 6, 0, 4, 1, 4, material);
            createPlatform(0, 9, 0, 3, 1, 3, material);
            createPlatform(-15, 4, -15, 8, 1, 8, material);
            createPlatform(-15, 8, -25, 6, 1, 6, material);
        }

        function createWall(x, y, z, width, height, depth, material, addVisual = true) {
            if (addVisual) {
                const geo = new THREE.BoxGeometry(width, height, depth);
                const mat = new THREE.MeshLambertMaterial({ color: 0x888888 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                scene.add(mesh);
            }
            const shape = new CANNON.Box(new CANNON.Vec3(width/2, height/2, depth/2));
            const body = new CANNON.Body({ mass: 0, material: material });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }

        function createPlatform(x, y, z, width, height, depth, material) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshLambertMaterial({ color: 0x5cacee }); // Bright blue
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(width/2, height/2, depth/2));
            const body = new CANNON.Body({ mass: 0, material: material });
            body.addShape(shape);
            body.position.set(x, y, z);
            world.addBody(body);
        }

        function createBox(x, y, z, width, height, depth, material) {
            const geo = new THREE.BoxGeometry(width, height, depth);
            const mat = new THREE.MeshLambertMaterial({ color: 0xd2b48c }); // Tan/Wood color
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(width/2, height/2, depth/2));
            const body = new CANNON.Body({ mass: 3, shape: shape, material: material });
            body.position.set(x, y, z);
            body.linearDamping = 0.1;
            body.angularDamping = 0.2;
            world.addBody(body);

            mesh.userData.physicsBody = body;
            mesh.userData.isHeld = false;
            grabbableMeshes.push(mesh);
        }

        function createBall(x, y, z, material) {
            const radius = 0.6;
            const geo = new THREE.SphereGeometry(radius, 32, 32);
            const colors = [0xff3333, 0x33ff33, 0x3333ff, 0xffff33, 0xff33ff, 0x33ffff];
            const color = colors[Math.floor(Math.random() * colors.length)];
            const mat = new THREE.MeshLambertMaterial({ color: color });
            
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Sphere(radius);
            const body = new CANNON.Body({ mass: 2, shape: shape, material: material });
            body.position.set(x, y, z);
            body.linearDamping = 0.1;
            body.angularDamping = 0.1;
            world.addBody(body);

            mesh.userData.physicsBody = body;
            mesh.userData.isBall = true;
            mesh.userData.isHeld = false;
            
            grabbableMeshes.push(mesh);
        }

        function createCPU(x, y, z, material) {
            const group = new THREE.Group();
            const bodyGeo = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const cpuColor = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
            const bodyMat = new THREE.MeshLambertMaterial({ color: cpuColor });
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.castShadow = true;
            bodyMesh.receiveShadow = true;
            group.add(bodyMesh);

            const eyeGeo = new THREE.BoxGeometry(0.1, 0.6, 0.1);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
            leftEye.position.set(-0.3, 0.1, 0.61);
            const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
            rightEye.position.set(0.3, 0.1, 0.61);
            group.add(leftEye);
            group.add(rightEye);

            const handGeo = new THREE.SphereGeometry(0.25, 16, 16);
            const handMat = new THREE.MeshLambertMaterial({ color: 0xffccaa });
            const leftCpuHand = new THREE.Mesh(handGeo, handMat);
            leftCpuHand.position.set(-0.8, -0.1, 0.3);
            const rightCpuHand = new THREE.Mesh(handGeo, handMat);
            rightCpuHand.position.set(0.8, -0.1, 0.3);
            group.add(leftCpuHand);
            group.add(rightCpuHand);

            scene.add(group);

            const shape = new CANNON.Box(new CANNON.Vec3(0.6, 0.6, 0.6));
            const body = new CANNON.Body({ mass: 4, shape: shape, material: material });
            body.position.set(x, y, z);
            body.linearDamping = 0.1;
            body.angularDamping = 0.5;
            world.addBody(body);

            group.userData.physicsBody = body;
            group.userData.isCPU = true;
            group.userData.isHeld = false;
            group.userData.state = 'wander'; 
            group.userData.heldObject = null;
            group.userData.chargeTimer = 0;
            group.userData.recoverTimer = 0;
            group.userData.walkTime = Math.random() * 10;

            grabbableMeshes.push(group);
            cpus.push(group);
        }

        function triggerGrabAction() {
            if (!holdingObject) {
                if (tryPlayerGrab()) {
                    zAction = 'grabbed_this_press';
                } else {
                    zAction = 'idle';
                }
            } else {
                zAction = 'charging';
                throwCharge = 0;
            }
        }

        function triggerReleaseAction() {
            if (holdingObject && zAction === 'charging') {
                throwPlayerObject();
            }
            zAction = 'idle';
            throwCharge = 0;
            document.getElementById('chargeBar').style.width = '0%';
        }

        function onKeyDown(e) {
            switch(e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': keys.space = true; break;
            }

            if (e.code === 'KeyZ' && !isZDown && controls.isLocked) {
                isZDown = true;
                triggerGrabAction();
            }
        }

        function onKeyUp(e) {
            switch(e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
            }

            if (e.code === 'KeyZ') {
                isZDown = false;
                if (!isMouseDown) triggerReleaseAction();
            }
        }

        function onMouseDown(e) {
            if (controls.isLocked && !isMouseDown) {
                isMouseDown = true;
                triggerGrabAction();
            }
        }

        function onMouseUp(e) {
            if (isMouseDown) {
                isMouseDown = false;
                if (!isZDown) triggerReleaseAction();
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function setBodyHeldState(obj, isHeld) {
            obj.userData.isHeld = isHeld;
            const body = obj.userData.physicsBody;
            if (isHeld) {
                body.type = CANNON.Body.KINEMATIC;
                body.collisionFilterGroup = 2;
                body.collisionFilterMask = 0; 
                
                if (obj.userData.isCPU && obj.userData.heldObject) {
                    setBodyHeldState(obj.userData.heldObject, false);
                    obj.userData.heldObject = null;
                    obj.userData.state = 'thrown';
                }
            } else {
                body.type = CANNON.Body.DYNAMIC;
                body.collisionFilterGroup = 1;
                body.collisionFilterMask = -1;
            }
        }

        function tryPlayerGrab() {
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(grabbableMeshes, true);
            
            if (intersects.length > 0) {
                let root = intersects[0].object;
                while (!root.userData.physicsBody && root.parent) {
                    root = root.parent;
                }

                if (root && root.userData.physicsBody && !root.userData.isHeld) {
                    if (root.position.distanceTo(camera.position) < 8) {
                        holdingObject = root;
                        setBodyHeldState(holdingObject, true);
                        return true;
                    }
                }
            }
            return false;
        }

        function throwPlayerObject() {
            if (!holdingObject) return;
            
            let obj = holdingObject;
            holdingObject = null;
            setBodyHeldState(obj, false);

            if (obj.userData.isCPU) {
                obj.userData.state = 'thrown';
                obj.userData.recoverTimer = 2.0;
            }

            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            
            const forceMultiplier = 15 + (throwCharge / MAX_CHARGE) * 45; 
            const body = obj.userData.physicsBody;
            body.velocity.set(dir.x * forceMultiplier, dir.y * forceMultiplier + 5, dir.z * forceMultiplier);
            body.angularVelocity.set((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);

            // Start Hand Throw Animation
            throwAnimTimer = 0.3; 

            // Start Preview Tracking
            trackedObject = obj;
            previewTimer = 4.0;
            document.getElementById('throwPreview').style.display = 'block';
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.1);
            if (controls.isLocked) {
                world.step(1/60, dt, 3);
                updatePlayer(dt);
                updateCPUs(dt);
                syncPhysicsVisuals();
                updatePreview(dt);
            }
            renderer.render(scene, camera);
        }

        function updatePreview(dt) {
            if (trackedObject && previewTimer > 0) {
                previewTimer -= dt;
                
                // Position preview camera behind/above object
                const objPos = trackedObject.position.clone();
                const offset = new THREE.Vector3(0, 4, 8); 
                previewCamera.position.copy(objPos).add(offset);
                previewCamera.lookAt(objPos);
                
                previewRenderer.render(scene, previewCamera);

                if (previewTimer <= 0) {
                    document.getElementById('throwPreview').style.display = 'none';
                    trackedObject = null;
                }
            }
        }

        function updatePlayer(dt) {
            // Jump
            if (keys.space && canJump) {
                playerBody.velocity.y = 12;
                canJump = false;
            }

            const inputDir = new THREE.Vector3();
            if (keys.w) inputDir.z -= 1;
            if (keys.s) inputDir.z += 1;
            if (keys.a) inputDir.x -= 1;
            if (keys.d) inputDir.x += 1;

            if (inputDir.lengthSq() > 0) {
                inputDir.normalize();
                const moveVector = new THREE.Vector3(inputDir.x, 0, inputDir.z);
                moveVector.applyQuaternion(camera.quaternion);
                moveVector.y = 0;
                moveVector.normalize();

                const moveSpeed = 15; 
                playerBody.velocity.x = moveVector.x * moveSpeed;
                playerBody.velocity.z = moveVector.z * moveSpeed;
            } else {
                if (canJump) {
                    playerBody.velocity.x *= 0.5;
                    playerBody.velocity.z *= 0.5;
                }
            }

            camera.position.copy(playerBody.position);
            camera.position.y += 0.8;

            // ANIMATION LOGIC
            let isMoving = inputDir.lengthSq() > 0 && canJump;
            if (isMoving) handBobTime += dt * 12;
            else handBobTime = 0;

            let targetLeftHandPos = new THREE.Vector3(-0.35, -0.2, -0.6);
            let targetRightHandPos = new THREE.Vector3(0.35, -0.2, -0.6);

            // Handle Throw Animation Timer
            if (throwAnimTimer > 0) {
                throwAnimTimer -= dt;
                // Thrust forward
                targetLeftHandPos.z -= 0.6;
                targetRightHandPos.z -= 0.6;
                targetLeftHandPos.y += 0.1;
                targetRightHandPos.y += 0.1;
            } else if (zAction === 'charging') {
                // Pull back for charging
                const pull = (throwCharge / MAX_CHARGE) * 0.3;
                targetLeftHandPos.z += pull;
                targetRightHandPos.z += pull;
                targetLeftHandPos.y -= pull * 0.5;
                targetRightHandPos.y -= pull * 0.5;
            } else if (holdingObject) {
                // Default holding position
                targetLeftHandPos.set(-0.25, -0.15, -0.8);
                targetRightHandPos.set(0.25, -0.15, -0.8);
            }

            if (!canJump) {
                targetLeftHandPos.y += 0.15;
                targetRightHandPos.y += 0.15;
            } else if (isMoving && !holdingObject && throwAnimTimer <= 0) {
                let bobY = Math.sin(handBobTime) * 0.05;
                let bobX = Math.cos(handBobTime * 0.5) * 0.02;
                targetLeftHandPos.y += bobY;
                targetLeftHandPos.x += bobX;
                targetRightHandPos.y += bobY;
                targetRightHandPos.x += bobX;
            }

            leftHand.position.lerp(targetLeftHandPos, 0.2);
            rightHand.position.lerp(targetRightHandPos, 0.2);

            if (holdingObject) {
                const camDir = new THREE.Vector3();
                camera.getWorldDirection(camDir);
                const holdPos = camera.position.clone().add(camDir.multiplyScalar(2.5));
                
                holdingObject.userData.physicsBody.position.copy(holdPos);
                holdingObject.userData.physicsBody.velocity.set(0,0,0);
                holdingObject.userData.physicsBody.angularVelocity.set(0,0,0);

                document.getElementById('chargeContainer').style.display = 'block';

                if (zAction === 'charging') {
                    throwCharge = Math.min(throwCharge + 3, MAX_CHARGE);
                    document.getElementById('chargeBar').style.width = throwCharge + '%';
                }
            } else {
                document.getElementById('chargeContainer').style.display = 'none';
            }
        }

        function updateCPUs(dt) {
            for (let cpu of cpus) {
                if (cpu.userData.isHeld) {
                    cpu.children[0].position.y = 0;
                    cpu.children[3].position.y = -0.1;
                    cpu.children[4].position.y = -0.1;
                    continue;
                }

                let body = cpu.userData.physicsBody;
                let state = cpu.userData.state;

                if (state === 'thrown') {
                    cpu.userData.recoverTimer -= dt;
                    if (cpu.userData.recoverTimer <= 0) cpu.userData.state = 'wander';
                    continue;
                }

                if (state === 'wander') {
                    if (Math.random() < 0.02) {
                        if (Math.random() < 0.3) cpu.userData.moveDir = null;
                        else cpu.userData.moveDir = new THREE.Vector3(Math.random() - 0.5, 0, Math.random() - 0.5).normalize();
                    }

                    if (cpu.userData.moveDir) {
                        const cpuSpeed = 8;
                        body.velocity.x = cpu.userData.moveDir.x * cpuSpeed;
                        body.velocity.z = cpu.userData.moveDir.z * cpuSpeed;
                        const targetRotation = Math.atan2(body.velocity.x, body.velocity.z);
                        body.quaternion.setFromAxisAngle(new CANNON.Vec3(0,1,0), targetRotation);

                        cpu.userData.walkTime += dt * 15;
                        cpu.children[0].position.y = Math.abs(Math.sin(cpu.userData.walkTime)) * 0.15;
                        cpu.children[3].position.y = -0.1 + Math.sin(cpu.userData.walkTime) * 0.1;
                        cpu.children[4].position.y = -0.1 + Math.cos(cpu.userData.walkTime) * 0.1;
                    } else {
                        body.velocity.x *= 0.5;
                        body.velocity.z *= 0.5;
                        cpu.children[0].position.y = 0;
                        cpu.children[3].position.y = -0.1;
                        cpu.children[4].position.y = -0.1;
                    }

                    if (Math.random() < 0.05 && !cpu.userData.heldObject) {
                        let nearest = null;
                        let minDist = 6;
                        for (let obj of grabbableMeshes) {
                            if (obj !== cpu && !obj.userData.isHeld) {
                                let dist = cpu.position.distanceTo(obj.position);
                                if (dist < minDist) {
                                    minDist = dist;
                                    nearest = obj;
                                }
                            }
                        }
                        if (nearest) {
                            cpu.userData.heldObject = nearest;
                            setBodyHeldState(nearest, true);
                            cpu.userData.state = 'charge';
                            cpu.userData.chargeTimer = 0;
                            cpu.userData.moveDir = null;
                        }
                    }
                } else if (state === 'charge') {
                    body.velocity.x *= 0.5;
                    body.velocity.z *= 0.5;
                    let held = cpu.userData.heldObject;
                    if (held) {
                        let forward = new THREE.Vector3(0, 0, 1).applyQuaternion(cpu.quaternion);
                        let holdPos = cpu.position.clone().add(forward.multiplyScalar(1.8));
                        holdPos.y += 0.5;
                        held.userData.physicsBody.position.copy(holdPos);
                        held.userData.physicsBody.velocity.set(0,0,0);
                        held.userData.physicsBody.angularVelocity.set(0,0,0);
                    } else {
                        cpu.userData.state = 'wander';
                    }

                    cpu.userData.chargeTimer += dt;
                    if (cpu.userData.chargeTimer > 1.5) {
                        if (held) {
                            setBodyHeldState(held, false);
                            if (held.userData.isCPU) {
                                held.userData.state = 'thrown';
                                held.userData.recoverTimer = 2.0;
                            }
                            let forward = new THREE.Vector3(0, 0, 1).applyQuaternion(cpu.quaternion);
                            forward.y = 0.5;
                            forward.normalize();
                            let force = 20 + Math.random() * 20;
                            held.userData.physicsBody.velocity.set(forward.x * force, forward.y * force, forward.z * force);
                        }
                        cpu.userData.heldObject = null;
                        cpu.userData.state = 'wander';
                    }
                }
            }
        }

        function syncPhysicsVisuals() {
            for (let mesh of grabbableMeshes) {
                mesh.position.copy(mesh.userData.physicsBody.position);
                mesh.quaternion.copy(mesh.userData.physicsBody.quaternion);
            }
        }
    </script>
