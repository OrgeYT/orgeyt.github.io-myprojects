<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Obby Generator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #87CEEB; /* Sky blue background */
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: white;
            border: 2px solid rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            display: none;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(4px);
            z-index: 10;
        }

        .title {
            color: white;
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 2px 2px 0 #000;
            text-align: center;
        }
        
        .instructions {
            color: #ccc;
            font-size: 1.2rem;
            margin-bottom: 30px;
            text-align: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(180deg, #4CAF50 0%, #2E7D32 100%);
            border: 3px solid #1B5E20;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 6px 0 #1B5E20, 0 10px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #1B5E20, 0 4px 5px rgba(0,0,0,0.3);
        }

        #hud {
            padding: 20px;
            display: none;
        }

        .hud-text {
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #damage-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        /* Emote Menu Styles */
        #emote-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            max-height: 70vh;
            background: rgba(20, 20, 30, 0.92);
            border: 3px solid #FFD700;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            color: white;
            display: none;
            flex-direction: column;
            pointer-events: auto;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        .emote-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 8px;
        }

        .emote-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #FFD700;
        }

        .emote-close-btn {
            background: #ff4444;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .emote-search {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #555;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 1rem;
            margin-bottom: 12px;
            box-sizing: border-box;
        }

        .emote-search:focus {
            outline: none;
            border-color: #FFD700;
        }

        .emote-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            overflow-y: auto;
            max-height: 45vh;
            padding-right: 4px;
        }

        .emote-grid::-webkit-scrollbar {
            width: 8px;
        }
        .emote-grid::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }
        .emote-grid::-webkit-scrollbar-thumb {
            background: #FFD700;
            border-radius: 4px;
        }

        .emote-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 10px 6px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.15s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .emote-card:hover {
            background: rgba(255, 215, 0, 0.25);
            border-color: #FFD700;
            transform: translateY(-2px);
        }

        .emote-card.active {
            background: #FFD700;
            color: #111;
            border-color: #fff;
        }

        #emote-hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
            background: rgba(0,0,0,0.4);
            padding: 6px 14px;
            border-radius: 20px;
        }

        /* Win Screen */
        #win-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            backdrop-filter: blur(6px);
            z-index: 30;
        }
    </style>
    
    <!-- Import Three.js via ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <div id="game-container"></div>
    
    <div id="ui-layer">
        <div id="hud">
            <div class="hud-text" id="stage-counter">Stage: 1 / 15</div>
            <div id="emote-hint">Press <b>[Q]</b> for Dances</div>
        </div>
        <div id="crosshair"></div>
    </div>
    
    <div id="damage-overlay"></div>

    <div id="emote-menu">
        <div class="emote-header">
            <span class="emote-title">🕺 Emotes & Dances</span>
            <button class="emote-close-btn" id="emote-close">✕ Close</button>
        </div>
        <input type="text" id="emote-search-input" class="emote-search" placeholder="Search dance emotes..." />
        <div class="emote-grid" id="emote-grid"></div>
    </div>

    <div id="overlay">
        <div class="title">OBBY GENERATOR</div>
        <div class="instructions">
            WASD - Move<br>
            Space - Jump<br>
            Q - Emote List<br>
            Mouse - Look Around<br><br>
            <i>Avoid the Red Bricks! Touch the Green Pads to Checkpoint.</i>
        </div>
        <button class="btn" id="play-btn">Click to Play</button>
    </div>

    <div id="win-screen">
        <div class="title" style="color: #FFD700;">YOU WIN!</div>
        <div class="instructions" style="color: white; font-size: 1.5rem;">You completed all stages!</div>
        <button class="btn" id="restart-btn" style="background: linear-gradient(180deg, #FFD700 0%, #FF8C00 100%); border-color: #B8860B; box-shadow: 0 6px 0 #B8860B, 0 10px 10px rgba(0,0,0,0.3); color: black;">Play Again</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // --- Core Engine Setup ---
        const container = document.getElementById('game-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 30, 200);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // --- Lighting ---
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 200, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 150;
        dirLight.shadow.camera.bottom = -150;
        dirLight.shadow.camera.left = -150;
        dirLight.shadow.camera.right = 150;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- Game State & Physics Variables ---
        const clock = new THREE.Clock();
        
        let collidables = []; // Standard solid boxes
        let killBricks = [];  // Lava/red boxes
        let checkpoints = []; // Safe zones
        let winPads = [];     // End game pads
        
        const playerHalfExtents = new THREE.Vector3(1, 2.5, 1); // Player size: 2x5x2
        const playerBox = new THREE.Box3();
        
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        const velocity = new THREE.Vector3();
        const moveDirection = new THREE.Vector3();
        let isGrounded = false;
        
        const GRAVITY = 100;
        const JUMP_SPEED = 35;
        const MOVE_SPEED = 20;

        let spawnPoint = new THREE.Vector3(0, 10, 0);
        let currentStage = 1;
        let totalStages = 15;
        let isPlaying = false;
        let hasWon = false;

        // Camera positioning logic
        let yaw = 0;
        let pitch = -0.2; // slight downward angle

        // Inputs
        const keys = { w: false, a: false, s: false, d: false, space: false };

        // --- Sound Engine (Web Audio API) ---
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playJumpSound() {
            if (!audioCtx) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(450, now + 0.15);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        function playOofSound() {
            if (!audioCtx) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(360, now);
            osc.frequency.linearRampToValueAtTime(220, now + 0.18);
            osc.frequency.linearRampToValueAtTime(120, now + 0.35);
            
            gain.gain.setValueAtTime(0.5, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);

            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        }

        function playCheckpointSound() {
            if (!audioCtx) return;
            initAudio();
            const now = audioCtx.currentTime;
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                gain.gain.setValueAtTime(0.2, now + idx * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now + idx * 0.06);
                osc.stop(now + idx * 0.06 + 0.25);
            });
        }

        function playClickSound() {
            if (!audioCtx) return;
            initAudio();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(200, now + 0.05);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.05);
        }

        function playVictorySound() {
            if (!audioCtx) return;
            initAudio();
            const now = audioCtx.currentTime;
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                let startTime = now + idx * 0.15;
                let duration = (idx === notes.length - 1) ? 0.6 : 0.15;
                osc.frequency.setValueAtTime(freq, startTime);
                gain.gain.setValueAtTime(0.3, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        // --- Animation & Emote Variables ---
        let mixer = null;
        const animationActions = {};
        let activeAction = null;

        let noobDanceClips = [];
        let activeDanceAction = null;
        let isDancing = false;
        let isEmoteMenuOpen = false;

        function fadeToAction(name, duration = 0.15) {
            if (!mixer || isDancing) return;
            const nextAction = animationActions[name];
            const actionToPlay = nextAction || animationActions['idle']; 
            
            if (!actionToPlay || activeAction === actionToPlay) return;

            const lastAction = activeAction;
            activeAction = actionToPlay;

            if (lastAction) {
                lastAction.fadeOut(duration);
            }
            activeAction.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(duration).play();
        }

        function stopDance() {
            if (!isDancing) return;
            isDancing = false;
            if (activeDanceAction) {
                activeDanceAction.fadeOut(0.15);
                activeDanceAction = null;
            }
            if (activeAction) {
                activeAction.reset().fadeIn(0.15).play();
            }
            document.querySelectorAll('.emote-card').forEach(c => c.classList.remove('active'));
        }

        function populateEmoteMenu(clips) {
            const emoteGrid = document.getElementById('emote-grid');
            emoteGrid.innerHTML = '';

            if (!clips || clips.length === 0) {
                emoteGrid.innerHTML = '<div style="grid-column: 1/-1; text-align:center;">No dances found.</div>';
                return;
            }

            clips.forEach((clip, index) => {
                let rawName = clip.name || `Dance ${index + 1}`;
                let cleanName = rawName.replace(/^armature\|/i, '').replace(/_/g, ' ');
                cleanName = cleanName.charAt(0).toUpperCase() + cleanName.slice(1);

                const card = document.createElement('div');
                card.className = 'emote-card';
                card.innerText = cleanName;
                card.title = cleanName;

                card.addEventListener('click', () => {
                    playEmote(clip, card);
                });

                emoteGrid.appendChild(card);
            });
        }

        function playEmote(clip, cardElement) {
            if (!mixer || !characterMesh) return;
            playClickSound();

            const validNodes = new Set();
            characterMesh.traverse((child) => { validNodes.add(child.name); });

            const clonedClip = clip.clone();
            clonedClip.tracks = clonedClip.tracks.filter((track) => {
                const nodeName = track.name.split('.')[0];
                return validNodes.has(nodeName);
            });

            if (activeAction) {
                activeAction.fadeOut(0.2);
            }
            if (activeDanceAction) {
                activeDanceAction.fadeOut(0.2);
            }

            const danceAction = mixer.clipAction(clonedClip);
            danceAction.reset().setEffectiveTimeScale(1).setEffectiveWeight(1).fadeIn(0.2).play();

            activeDanceAction = danceAction;
            isDancing = true;

            document.querySelectorAll('.emote-card').forEach(c => c.classList.remove('active'));
            if (cardElement) cardElement.classList.add('active');

            closeEmoteMenu();
            document.body.requestPointerLock();
        }

        // --- STREAMING_CHUNK:Loading the player model & dance animations... ---
        let characterMesh = null;
        const fallbackGeo = new THREE.BoxGeometry(2, 5, 2);
        const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x0055ff });
        const fallbackMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
        fallbackMesh.castShadow = true;
        fallbackMesh.position.y = 0;
        
        const textCanvas = document.createElement('canvas');
        textCanvas.width = 512;
        textCanvas.height = 128;
        const textCtx = textCanvas.getContext('2d');
        textCtx.fillStyle = 'rgba(0, 0, 0, 0)';
        textCtx.fillRect(0, 0, textCanvas.width, textCanvas.height);
        textCtx.font = 'bold 28px sans-serif';
        textCtx.fillStyle = 'white';
        textCtx.textAlign = 'center';
        textCtx.shadowColor = "black";
        textCtx.shadowBlur = 4;
        textCtx.shadowOffsetX = 2;
        textCtx.shadowOffsetY = 2;
        
        textCtx.fillText('Animations and Noob rig', 256, 50);
        textCtx.fillText('might be loading...', 256, 90);
        
        const textTexture = new THREE.CanvasTexture(textCanvas);
        const textMaterial = new THREE.SpriteMaterial({ map: textTexture });
        const textSprite = new THREE.Sprite(textMaterial);
        textSprite.scale.set(8, 2, 1);
        textSprite.position.y = 4;
        fallbackMesh.add(textSprite);

        playerGroup.add(fallbackMesh);
        
        // Attempt to load the GLB player
        const loader = new GLTFLoader();
        loader.load(
            'https://file.garden/Zj01o_oh-G9Y8APf/Peak%20noob%20fixed.glb',
            (gltf) => {
                characterMesh = gltf.scene;
                noobDanceClips = gltf.animations || [];
                
                characterMesh.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });
                
                const bbox = new THREE.Box3().setFromObject(characterMesh);
                const size = bbox.getSize(new THREE.Vector3());
                const targetHeight = 5;
                const scale = targetHeight / size.y;
                characterMesh.scale.set(scale, scale, scale);
                
                characterMesh.position.y = -playerHalfExtents.y;
                characterMesh.rotation.y = -Math.PI / 2;
                
                playerGroup.remove(fallbackMesh);
                playerGroup.add(characterMesh);
                console.log("Player model loaded successfully!");

                populateEmoteMenu(noobDanceClips);

                // Load second GLB (clark.glb) for locomotion animations
                loader.load(
                    'https://file.garden/Zj01o_oh-G9Y8APf/clark.glb',
                    (gltfAnim) => {
                        const anims = gltfAnim.animations;
                        if (anims && anims.length > 0) {
                            const validNodes = new Set();
                            characterMesh.traverse((child) => {
                                validNodes.add(child.name);
                            });

                            mixer = new THREE.AnimationMixer(characterMesh);
                            
                            anims.forEach((clip) => {
                                clip.tracks = clip.tracks.filter((track) => {
                                    const nodeName = track.name.split('.')[0];
                                    return validNodes.has(nodeName);
                                });

                                const name = clip.name.toLowerCase();
                                if (name.includes('idle')) {
                                    animationActions.idle = mixer.clipAction(clip);
                                } else if (name.includes('run')) {
                                    animationActions.run = mixer.clipAction(clip);
                                }
                            });

                            if (animationActions.idle) {
                                activeAction = animationActions.idle;
                                activeAction.play();
                            }
                        }
                    },
                    undefined,
                    (error) => {
                        console.warn('Could not load animation GLB.', error);
                    }
                );
            },
            undefined,
            (error) => {
                console.warn('Could not load custom GLB model, using fallback box.', error);
            }
        );

        // Set initial position
        playerGroup.position.copy(spawnPoint);

        // --- STREAMING_CHUNK:Procedural Level Generation Logic... ---
        
        // Utility to create boxes
        function createBox(w, h, d, color, x, y, z) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            return mesh;
        }

        function addSolid(w, h, d, color, x, y, z) {
            const mesh = createBox(w, h, d, color, x, y, z);
            const box = new THREE.Box3().setFromObject(mesh);
            collidables.push({ mesh, box });
        }

        function addKillBrick(w, h, d, x, y, z) {
            const mesh = createBox(w, h, d, 0xff0000, x, y, z);
            const box = new THREE.Box3().setFromObject(mesh);
            killBricks.push({ mesh, box });
            collidables.push({ mesh, box }); // Make it solid too
        }

        function addCheckpoint(z) {
            // Base
            addSolid(20, 1, 20, 0xaaaaaa, 0, 0, z);
            // Pad
            const mesh = createBox(8, 1.2, 8, 0x005500, 0, 0, z);
            const box = new THREE.Box3().setFromObject(mesh);
            
            const spawnPos = new THREE.Vector3(0, 5, z);
            checkpoints.push({ mesh, box, spawnPos, active: false });
        }

        // Stage 1: Platforms
        function buildPlatforms(zStart) {
            const count = 5;
            for (let i = 0; i < count; i++) {
                // Alternating colors
                const color = i % 2 === 0 ? 0xffff00 : 0x0000ff;
                addSolid(10, 1, 10, color, 0, 0, zStart - 5 - i * 12);
            }
        }

        // Stage 2: Line Jumps
        function buildLineJumps(zStart) {
            // Main path
            addSolid(16, 1, 60, 0x888888, 0, 0, zStart - 30);
            
            const count = 5;
            for (let i = 0; i < count; i++) {
                addKillBrick(16.5, 1.5, 2, 0, 0, zStart - 10 - i * 10);
            }
        }

        // Stage 3: Checker board (Alternating paths)
        function buildCheckerboard(zStart) {
            const rows = 6;
            const cols = 3;
            
            // Solid base plate to prevent falling underneath visually
            addSolid(18, 0.5, 60, 0x333333, 0, -0.5, zStart - 30);

            for (let r = 0; r < rows; r++) {
                // Ensure at least one safe block per row
                let safeCol = Math.floor(Math.random() * cols);
                
                for (let c = 0; c < cols; c++) {
                    let isKill = (c !== safeCol) && (Math.random() > 0.4);
                    let xPos = (c - 1) * 6; // -6, 0, +6
                    let zPos = zStart - 5 - r * 10;
                    
                    if (isKill) {
                        addKillBrick(5.5, 1, 9.5, xPos, 0, zPos);
                    } else {
                        addSolid(5.5, 1, 9.5, 0xdddddd, xPos, 0, zPos);
                    }
                }
            }
        }

        // Stage 4: Tight rope
        function buildTightRope(zStart) {
            addSolid(1.5, 1, 60, 0x8B4513, 0, 0, zStart - 30);
        }

        // Stage 5: Glass Bridge (Choose correct path)
        function buildGlassBridge(zStart) {
            const count = 5;
            for (let i = 0; i < count; i++) {
                let safeSide = Math.random() > 0.5 ? 1 : -1;
                let zPos = zStart - 6 - i * 12;
                
                // Left platform vs Right platform
                if (safeSide === -1) {
                    addSolid(8, 1, 10, 0x44aaff, -5, 0, zPos);
                    addKillBrick(8, 1, 10, 5, 0, zPos); // Red kill brick on right
                } else {
                    addKillBrick(8, 1, 10, -5, 0, zPos); // Red kill brick on left
                    addSolid(8, 1, 10, 0x44aaff, 5, 0, zPos);
                }
            }
        }

        // Stage 6: Offset Platforms (Zig zag jumps)
        function buildOffsetPlatforms(zStart) {
            const count = 5;
            for (let i = 0; i < count; i++) {
                let xPos = i % 2 === 0 ? -6 : 6;
                const color = i % 2 === 0 ? 0xff8800 : 0xaa00ff;
                addSolid(6, 1, 6, color, xPos, 0, zStart - 6 - i * 12);
            }
        }

        // Stage 7: Wall Maze
        function buildWallMaze(zStart) {
            // Solid floor
            addSolid(20, 1, 60, 0x555555, 0, 0, zStart - 30);
            
            // Walls blocking path (forcing zig-zag)
            addSolid(14, 5, 2, 0x333333, 4, 3, zStart - 15);
            addSolid(14, 5, 2, 0x333333, -4, 3, zStart - 30);
            addSolid(14, 5, 2, 0x333333, 4, 3, zStart - 45);

            // Small kill bricks to dodge on the corners
            addKillBrick(4, 1.2, 4, -5, 0.1, zStart - 15);
            addKillBrick(4, 1.2, 4, 5, 0.1, zStart - 30);
            addKillBrick(4, 1.2, 4, -5, 0.1, zStart - 45);
        }

        // Stage 8: Lava Pillars
        function buildLavaPillars(zStart) {
            // Giant lava pit on the floor
            addKillBrick(20, 0.5, 60, 0, -0.25, zStart - 30);
            
            // Safe pillars sticking out of the lava
            addSolid(5, 1.5, 5, 0xcccccc, 0, 0.5, zStart - 10);
            addSolid(5, 1.5, 5, 0xcccccc, -6, 0.5, zStart - 22);
            addSolid(5, 1.5, 5, 0xcccccc, 6, 0.5, zStart - 34);
            addSolid(5, 1.5, 5, 0xcccccc, -6, 0.5, zStart - 46);
            addSolid(5, 1.5, 5, 0xcccccc, 0, 0.5, zStart - 56);
        }

        // --- STREAMING_CHUNK:Building the Obby world... ---
        function generateWorld() {
            let currentZ = 0;
            
            // Spawn point (Center at 0, occupies space from +10 to -10)
            addCheckpoint(0);
            checkpoints[0].active = true;
            checkpoints[0].mesh.material.color.setHex(0x00ff00);
            spawnPoint.copy(checkpoints[0].spawnPos);
            
            currentZ = -10; // Start of first stage exactly at the edge of the checkpoint

            const stageTypes = [
                buildPlatforms, 
                buildLineJumps, 
                buildCheckerboard, 
                buildTightRope,
                buildGlassBridge,
                buildOffsetPlatforms,
                buildWallMaze,
                buildLavaPillars
            ];

            for (let i = 0; i < totalStages; i++) {
                // Pick random stage
                const stageFunc = stageTypes[Math.floor(Math.random() * stageTypes.length)];
                stageFunc(currentZ);
                
                currentZ -= 60; // Advance Z by the exact length of a stage
                
                if (i < totalStages - 1) {
                    addCheckpoint(currentZ - 10); // Center checkpoint so its edge touches the stage
                    currentZ -= 20; // Advance Z by the length of a checkpoint
                } else {
                    // Final win pad
                    const mesh = createBox(30, 1, 30, 0xffd700, 0, 0, currentZ - 15); // Gold pad
                    const box = new THREE.Box3().setFromObject(mesh);
                    winPads.push({ mesh, box });
                    collidables.push({ mesh, box });
                }
            }
        }
        
        generateWorld();

        // --- STREAMING_CHUNK:Handling Inputs & Pointer Lock... ---
        
        // UI Elements
        const overlay = document.getElementById('overlay');
        const playBtn = document.getElementById('play-btn');
        const hud = document.getElementById('hud');
        const crosshair = document.getElementById('crosshair');
        const damageOverlay = document.getElementById('damage-overlay');
        const winScreen = document.getElementById('win-screen');
        const restartBtn = document.getElementById('restart-btn');

        const emoteMenu = document.getElementById('emote-menu');
        const emoteCloseBtn = document.getElementById('emote-close');
        const emoteSearchInput = document.getElementById('emote-search-input');

        function openEmoteMenu() {
            if (!isPlaying) return;
            isEmoteMenuOpen = true;
            emoteMenu.style.display = 'flex';
            document.exitPointerLock();
            playClickSound();
        }

        function closeEmoteMenu() {
            isEmoteMenuOpen = false;
            emoteMenu.style.display = 'none';
        }

        emoteCloseBtn.addEventListener('click', () => {
            closeEmoteMenu();
            document.body.requestPointerLock();
        });

        emoteSearchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.emote-card');
            cards.forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(searchTerm) ? 'block' : 'none';
            });
        });

        playBtn.addEventListener('click', () => {
            initAudio();
            playClickSound();
            document.body.requestPointerLock();
        });

        restartBtn.addEventListener('click', () => {
            initAudio();
            playClickSound();
            hasWon = false;
            
            // Reset player progress
            playerGroup.position.copy(checkpoints[0].spawnPos);
            velocity.set(0, 0, 0);
            updatePlayerBox();
            
            checkpoints.forEach((cp, idx) => {
                cp.active = idx === 0;
                cp.mesh.material.color.setHex(idx === 0 ? 0x00ff00 : 0x005500);
            });
            spawnPoint.copy(checkpoints[0].spawnPos);
            document.getElementById('stage-counter').innerText = `Stage: 1 / ${totalStages}`;
            
            winScreen.style.display = 'none';
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                isPlaying = true;
                overlay.style.display = 'none';
                winScreen.style.display = 'none';
                hud.style.display = 'block';
                crosshair.style.display = 'block';
                closeEmoteMenu();
            } else {
                if (!isEmoteMenuOpen && !hasWon) {
                    isPlaying = false;
                    overlay.style.display = 'flex';
                    hud.style.display = 'none';
                    crosshair.style.display = 'none';
                }
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isPlaying) {
                yaw -= e.movementX * 0.003;
                pitch -= e.movementY * 0.003;
                pitch = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, pitch));
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyQ' && isPlaying && !e.repeat) {
                if (isEmoteMenuOpen) {
                    closeEmoteMenu();
                    document.body.requestPointerLock();
                } else {
                    openEmoteMenu();
                }
                return;
            }

            if (document.activeElement === emoteSearchInput) return;

            switch(e.code) {
                case 'KeyW': keys.w = true; break;
                case 'KeyA': keys.a = true; break;
                case 'KeyS': keys.s = true; break;
                case 'KeyD': keys.d = true; break;
                case 'Space': keys.space = true; break;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (document.activeElement === emoteSearchInput) return;
            switch(e.code) {
                case 'KeyW': keys.w = false; break;
                case 'KeyA': keys.a = false; break;
                case 'KeyS': keys.s = false; break;
                case 'KeyD': keys.d = false; break;
                case 'Space': keys.space = false; break;
            }
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- STREAMING_CHUNK:Physics Engine & Collision Logic... ---
        
        function updatePlayerBox() {
            playerBox.min.copy(playerGroup.position).sub(playerHalfExtents);
            playerBox.max.copy(playerGroup.position).add(playerHalfExtents);
        }

        function die() {
            playOofSound();
            stopDance();

            damageOverlay.style.opacity = '1';
            setTimeout(() => { damageOverlay.style.opacity = '0'; }, 300);

            playerGroup.position.copy(spawnPoint);
            velocity.set(0, 0, 0);
            updatePlayerBox();
        }

        function gameLoop() {
            requestAnimationFrame(gameLoop);

            const dt = Math.min(clock.getDelta(), 0.05);

            if (isPlaying) {
                moveDirection.set(0, 0, 0);
                if (keys.w) moveDirection.z -= 1;
                if (keys.s) moveDirection.z += 1;
                if (keys.a) moveDirection.x -= 1;
                if (keys.d) moveDirection.x += 1;

                if (isDancing && (moveDirection.lengthSq() > 0 || keys.space)) {
                    stopDance();
                }

                if (moveDirection.lengthSq() > 0) {
                    moveDirection.normalize();
                    moveDirection.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
                    
                    if (characterMesh) {
                        const targetAngle = Math.atan2(moveDirection.x, moveDirection.z) - (Math.PI / 2);
                        let angleDiff = targetAngle - characterMesh.rotation.y;
                        angleDiff = (angleDiff + Math.PI * 3) % (Math.PI * 2) - Math.PI;
                        characterMesh.rotation.y += angleDiff * 15 * dt;
                    } else {
                        const targetAngle = Math.atan2(moveDirection.x, moveDirection.z);
                        let angleDiff = targetAngle - fallbackMesh.rotation.y;
                        angleDiff = (angleDiff + Math.PI * 3) % (Math.PI * 2) - Math.PI;
                        fallbackMesh.rotation.y += angleDiff * 15 * dt;
                    }
                }

                velocity.x = moveDirection.x * MOVE_SPEED;
                velocity.z = moveDirection.z * MOVE_SPEED;

                if (keys.space && isGrounded) {
                    velocity.y = JUMP_SPEED;
                    isGrounded = false;
                    playJumpSound();
                }

                velocity.y -= GRAVITY * dt;

                // --- AXIS-BY-AXIS COLLISION RESOLUTION ---
                playerGroup.position.y += velocity.y * dt;
                updatePlayerBox();
                isGrounded = false;
                
                for (let obj of collidables) {
                    if (playerBox.intersectsBox(obj.box)) {
                        if (velocity.y < 0) {
                            playerGroup.position.y = obj.box.max.y + playerHalfExtents.y + 0.001;
                            isGrounded = true;
                        } else if (velocity.y > 0) {
                            playerGroup.position.y = obj.box.min.y - playerHalfExtents.y - 0.001;
                        }
                        velocity.y = 0;
                        updatePlayerBox();
                    }
                }

                playerGroup.position.x += velocity.x * dt;
                updatePlayerBox();
                
                for (let obj of collidables) {
                    if (playerBox.intersectsBox(obj.box)) {
                        if (velocity.x > 0) {
                            playerGroup.position.x = obj.box.min.x - playerHalfExtents.x - 0.001;
                        } else if (velocity.x < 0) {
                            playerGroup.position.x = obj.box.max.x + playerHalfExtents.x + 0.001;
                        }
                        updatePlayerBox();
                    }
                }

                playerGroup.position.z += velocity.z * dt;
                updatePlayerBox();
                
                for (let obj of collidables) {
                    if (playerBox.intersectsBox(obj.box)) {
                        if (velocity.z > 0) {
                            playerGroup.position.z = obj.box.min.z - playerHalfExtents.z - 0.001;
                        } else if (velocity.z < 0) {
                            playerGroup.position.z = obj.box.max.z + playerHalfExtents.z + 0.001;
                        }
                        updatePlayerBox();
                    }
                }

                // --- INTERACTION CHECKS ---
                const triggerBox = playerBox.clone().expandByScalar(0.05);

                for (let kb of killBricks) {
                    if (triggerBox.intersectsBox(kb.box)) {
                        die();
                        break;
                    }
                }

                if (playerGroup.position.y < -30) {
                    die();
                }

                for (let i = 0; i < checkpoints.length; i++) {
                let cp = checkpoints[i];
                if (!cp.active && triggerBox.intersectsBox(cp.box)) {
                    cp.active = true;
                    cp.mesh.material.color.setHex(0x00ff00);
                    spawnPoint.copy(cp.spawnPos);
                    playCheckpointSound();
                    
                    let newStage = Math.min(i + 1, totalStages);
                    document.getElementById('stage-counter').innerText = `Stage: ${newStage} / ${totalStages}`;
                }
            }

            if (!hasWon) {
                for (let wp of winPads) {
                    if (triggerBox.intersectsBox(wp.box)) {
                        hasWon = true;
                        isPlaying = false;
                        stopDance();
                        velocity.set(0, 0, 0);
                        playVictorySound();
                        
                        document.exitPointerLock();
                        hud.style.display = 'none';
                        crosshair.style.display = 'none';
                        winScreen.style.display = 'flex';
                        break;
                    }
                }
            }
        }

        if (isPlaying && !isDancing) {
                let targetAnim = 'idle';
                if (moveDirection.lengthSq() > 0) {
                    targetAnim = 'run';
                }
                fadeToAction(targetAnim, 0.1);
            }

            if (mixer) {
                mixer.update(dt);
            }

            const cameraDist = 16;
            const camOffset = new THREE.Vector3(0, 0, cameraDist);
            
            camOffset.applyAxisAngle(new THREE.Vector3(1, 0, 0), pitch);
            camOffset.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            
            const lookTarget = playerGroup.position.clone().add(new THREE.Vector3(0, 1.5, 0));
            camera.position.copy(lookTarget).add(camOffset);
            camera.lookAt(lookTarget);

            renderer.render(scene, camera);
        }

        gameLoop();
    </script>
</body>
</html>
