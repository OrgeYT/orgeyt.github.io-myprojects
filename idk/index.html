<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Minimal HUD -->
  <div id="hud">
    <div id="level">Level 1 / 500</div>
    <div id="status"></div>
  </div>

  <!-- Touch controls for mobile: left/right/jump -->
  <div id="controls">
    <button id="left" class="ctrl">◀</button>
    <button id="jump" class="ctrl">▲</button>
    <button id="right" class="ctrl">▶</button>
  </div>

  <img id="tenor" src="tenor.gif" alt="tenor" />
  <script type="module" src="main.js"></script>
</body>
</html>
