<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synchronized Souls - Deluxe</title>
    <style>
        :root {
            --bg: #0a0a12;
            --panel: rgba(255, 255, 255, 0.05);
            --text: #e0e0ff;
            --accent: #00ffcc;
        }
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), 0 0 20px rgba(100, 100, 255, 0.2);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 900px;
            height: 500px;
        }
        canvas {
            display: block;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0a0a12 100%);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(10, 10, 18, 0.95);
            z-index: 10;
            backdrop-filter: blur(10px);
            transition: opacity 0.3s;
        }
        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        h1 {
            font-size: 42px;
            margin-bottom: 20px;
            letter-spacing: 8px;
            text-shadow: 0 0 20px var(--accent);
        }
        .btn {
            background: transparent;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 10px 30px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s;
            min-width: 180px;
        }
        .btn:hover {
            background: var(--accent);
            color: #000;
            box-shadow: 0 0 20px var(--accent);
        }
        .btn.active {
            background: var(--accent);
            color: #000;
        }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 5;
        }
        .level-text {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
        .setting-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }
        .level-btn {
            min-width: 60px;
            padding: 15px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="menuScreen" class="screen">
        <h1>SYNCHRONIZED SOULS</h1>
        <button class="btn" onclick="startGame()">Start Game</button>
        <button class="btn" onclick="showScreen('levelSelectScreen')">Level Select</button>
        <button class="btn" onclick="showScreen('settingsScreen')">Settings</button>
    </div>

    <div id="levelSelectScreen" class="screen hidden">
        <h1>SELECT LEVEL</h1>
        <div class="level-grid" id="levelButtons"></div>
        <button class="btn" onclick="showScreen('menuScreen')">Back</button>
    </div>

    <div id="settingsScreen" class="screen hidden">
        <h1>SETTINGS</h1>
        <div style="margin-bottom: 10px; color: var(--accent);">PLAYER COUNT</div>
        <div class="setting-group">
            <button id="btn-1" class="btn" onclick="setPlayerCount(1)">1</button>
            <button id="btn-4" class="btn active" onclick="setPlayerCount(4)">4</button>
            <button id="btn-8" class="btn" onclick="setPlayerCount(8)">8</button>
            <button id="btn-16" class="btn" onclick="setPlayerCount(16)">16</button>
            <button id="btn-20" class="btn" onclick="setPlayerCount(20)">20</button>
            <button id="btn-50" class="btn" onclick="setPlayerCount(50)">50</button>
        </div>
        <button class="btn" onclick="showScreen('menuScreen')">Back</button>
    </div>

    <div class="ui-overlay" id="hud" style="display:none;">
        <div class="level-text" id="levelDisplay">LEVEL 01</div>
        <div style="font-size: 10px; color: rgba(255,255,255,0.4);">ESC TO MENU</div>
    </div>
    
    <canvas id="game"></canvas>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const levelDisplay = document.getElementById("levelDisplay");
const hud = document.getElementById("hud");

canvas.width = 900;
canvas.height = 500;

const WORLD_WIDTH = 1200;
const WORLD_HEIGHT = 800;

const GRAVITY = 0.5;
const FRICTION = 0.8;
const JUMP_FORCE = -12.5; // Slightly increased for better solo navigation
const MOVE_SPEED = 0.6;
const MAX_SPEED = 5;
const TERMINAL_VELOCITY = 12; 
const keys = {};

let gameState = 'MENU';
let currentLevelIndex = 0;
let playerCount = 4;
let screenShake = 0;
let players = [];
let camera = { x: 0, y: 0 };

function createBoundaries() {
    return [
        {x: -50, y: -50, w: 50, h: WORLD_HEIGHT + 100}, 
        {x: WORLD_WIDTH, y: -50, w: 50, h: WORLD_HEIGHT + 100}, 
        {x: -50, y: -50, w: WORLD_WIDTH + 100, h: 50}  
    ];
}

const levels = [
    { // L1: Basic Introduction
        platforms: [
            ...createBoundaries(),
            {x: 0, y: 700, w: WORLD_WIDTH, h: 100},
            {x: 400, y: 550, w: 200, h: 20},
            {x: 700, y: 420, w: 200, h: 20},
            {x: 1000, y: 300, w: 150, h: 20}
        ],
        goal: {x: 1050, y: 220, w: 60, h: 60}
    },
    { // L2: The Wide Gap
        platforms: [
            ...createBoundaries(),
            {x: 0, y: 700, w: 300, h: 100},
            {x: 900, y: 700, w: 300, h: 100},
            {x: 450, y: 580, w: 100, h: 20}, // Solo step
            {x: 650, y: 580, w: 100, h: 20}, // Solo step
            {x: 550, y: 400, w: 100, h: 20}
        ],
        goal: {x: 570, y: 320, w: 60, h: 60}
    },
    { // L3: Zig Zag Climb
        platforms: [
            ...createBoundaries(),
            {x: 0, y: 750, w: WORLD_WIDTH, h: 50},
            {x: 900, y: 620, w: 200, h: 20},
            {x: 600, y: 500, w: 200, h: 20},
            {x: 300, y: 380, w: 200, h: 20},
            {x: 600, y: 260, w: 200, h: 20},
            {x: 900, y: 140, w: 200, h: 20}
        ],
        goal: {x: 970, y: 60, w: 60, h: 60}
    },
    { // L4: The Tunnel (Fixed for Solo and 50 players)
        platforms: [
            ...createBoundaries(),
            {x: 0, y: 750, w: WORLD_WIDTH, h: 50},
            {x: 350, y: 350, w: 40, h: 400}, // Thinner wall for more room
            {x: 350, y: 350, w: 650, h: 40}, // Thicker roof for visual clarity
            {x: 1000, y: 350, w: 40, h: 300}, 
            {x: 150, y: 600, w: 100, h: 20}, // Step up to reach high platforms
            {x: 0, y: 250, w: 250, h: 20}
        ],
        goal: {x: 80, y: 170, w: 60, h: 60}
    },
    { // L5: Sky Pillars
        platforms: [
            ...createBoundaries(),
            {x: 0, y: 750, w: 200, h: 50},
            {x: 300, y: 620, w: 120, h: 20},
            {x: 600, y: 500, w: 120, h: 20},
            {x: 900, y: 380, w: 120, h: 20},
            {x: 600, y: 260, w: 120, h: 20},
            {x: 300, y: 140, w: 120, h: 20}
        ],
        goal: {x: 330, y: 60, w: 60, h: 60}
    },
    { // L6: Great Wall
        platforms: [
            ...createBoundaries(),
            {x: 0, y: 700, w: 200, h: 100},
            {x: 300, y: 0, w: 40, h: 650}, // Huge wall
            {x: 200, y: 550, w: 100, h: 20}, // Steps to get over it solo
            {x: 150, y: 400, w: 100, h: 20},
            {x: 200, y: 250, w: 100, h: 20},
            {x: 450, y: 700, w: 750, h: 100}
        ],
        goal: {x: 1100, y: 620, w: 60, h: 60}
    },
    { // L7: The Summit
        platforms: [
            ...createBoundaries(),
            {x: 0, y: 750, w: WORLD_WIDTH, h: 50},
            {x: 100, y: 600, w: 1000, h: 20},
            {x: 200, y: 450, w: 800, h: 20},
            {x: 400, y: 300, w: 400, h: 20},
            {x: 550, y: 150, w: 100, h: 20}
        ],
        goal: {x: 570, y: 70, w: 60, h: 60}
    }
];

class Player {
    constructor(x, y, color) {
        this.startX = x;
        this.startY = y;
        this.color = color;
        this.reset();
    }
    reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.w = 26; this.h = 26;
        this.vx = 0; this.vy = 0;
        this.onGround = false;
        this.absorbed = false;
        this.scale = 1; this.rotation = 0;
    }
    update(platforms, goal) {
        if (this.absorbed) {
            const centerX = goal.x + goal.w / 2;
            const centerY = goal.y + goal.h / 2;
            this.x += (centerX - (this.x + this.w/2)) * 0.1;
            this.y += (centerY - (this.y + this.h/2)) * 0.1;
            this.scale *= 0.9;
            this.rotation += 0.2;
            return;
        }

        if (keys["ArrowLeft"]) this.vx -= MOVE_SPEED;
        else if (keys["ArrowRight"]) this.vx += MOVE_SPEED;
        else this.vx *= FRICTION;

        if (Math.abs(this.vx) > MAX_SPEED) this.vx = Math.sign(this.vx) * MAX_SPEED;
        
        if (keys["ArrowUp"] && this.onGround) {
            this.vy = JUMP_FORCE;
            this.onGround = false;
        }

        this.vy += GRAVITY;
        if (this.vy > TERMINAL_VELOCITY) this.vy = TERMINAL_VELOCITY;

        this.x += this.vx;
        const nextY = this.y + this.vy;
        let groundFound = false;

        for (let p of platforms) {
            if (this.x + this.w > p.x && this.x < p.x + p.w) {
                if (this.vy >= 0 && this.y + this.h <= p.y && nextY + this.h >= p.y) {
                    this.y = p.y - this.h;
                    this.vy = 0; groundFound = true;
                } else if (this.vy < 0 && this.y >= p.y + p.h && nextY <= p.y + p.h) {
                    this.y = p.y + p.h; this.vy = 0;
                }
            }
            if (this.y + this.h > p.y + 2 && this.y < p.y + p.h - 2) {
                if (this.x + this.w > p.x && this.x < p.x + p.w) {
                    if (this.x + this.w/2 < p.x + p.w/2) this.x = p.x - this.w;
                    else this.x = p.x + p.w;
                    this.vx = 0;
                }
            }
        }

        if (!groundFound) { this.y = nextY; this.onGround = false; }
        else { this.onGround = true; }

        this.constrainToWorld();

        if (this.x < goal.x + goal.w && this.x + this.w > goal.x && this.y < goal.y + goal.h && this.y + this.h > goal.y) {
            if (!this.absorbed) { this.absorbed = true; screenShake = 8; }
        }
    }
    constrainToWorld() {
        if (this.x < 0) this.x = 0;
        if (this.x + this.w > WORLD_WIDTH) this.x = WORLD_WIDTH - this.w;
        if (this.y < 0) { this.y = 0; this.vy = 0; }
        if (this.y + this.h > WORLD_HEIGHT) { this.y = WORLD_HEIGHT - this.h; this.vy = 0; this.onGround = true; }
    }
    draw() {
        if (this.scale <= 0.01) return;
        ctx.save();
        ctx.translate(this.x + this.w/2, this.y + this.h/2);
        ctx.rotate(this.rotation);
        ctx.scale(this.scale, this.scale);
        ctx.shadowBlur = 10; ctx.shadowColor = this.color;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.roundRect(-this.w/2, -this.h/2, this.w, this.h, 4);
        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.8)";
        ctx.fillRect(-6 + (this.vx * 1.2), -this.h * 0.2, 3, 5);
        ctx.fillRect(3 + (this.vx * 1.2), -this.h * 0.2, 3, 5);
        ctx.restore();
    }
}

function setPlayerCount(n) {
    playerCount = n;
    document.querySelectorAll('.setting-group .btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`btn-${n}`).classList.add('active');
}

function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
    const target = document.getElementById(id);
    if (target) target.classList.remove('hidden');
    hud.style.display = id === 'none' ? 'block' : 'none';
}

function generateLevelButtons() {
    const container = document.getElementById('levelButtons');
    container.innerHTML = '';
    levels.forEach((_, i) => {
        const btn = document.createElement('button');
        btn.className = 'btn level-btn';
        btn.innerText = (i + 1).toString().padStart(2, '0');
        btn.onclick = () => { currentLevelIndex = i; startGame(); };
        container.appendChild(btn);
    });
}

function startGame() {
    showScreen('none');
    gameState = 'PLAYING';
    initPlayers();
    hud.style.display = 'block';
}

function initPlayers() {
    players = [];
    const colors = ["#ff4d4d", "#4d4dff", "#4dff4d", "#ffff4d", "#ff4dff", "#4dffff", "#ffa500", "#00ffcc"];
    const startX = 60;
    const startY = 650;
    for(let i=0; i<playerCount; i++) {
        const offset = playerCount > 10 ? (i % 10) * 15 : i * 25;
        const rowOffset = Math.floor(i/10) * 30;
        players.push(new Player(startX + offset, startY - rowOffset, colors[i % colors.length]));
    }
    levelDisplay.innerText = `LEVEL ${(currentLevelIndex + 1).toString().padStart(2, '0')}`;
}

function resolvePlayerCollisions() {
    const iterations = 6; 
    for (let it = 0; it < iterations; it++) {
        const sorted = [...players].sort((a, b) => b.y - a.y);
        for (let i = 0; i < sorted.length; i++) {
            const a = sorted[i]; 
            if (a.absorbed) continue;
            for (let j = 0; j < players.length; j++) {
                const b = players[j];
                if (a === b || b.absorbed) continue;
                const dx = (a.x + a.w/2) - (b.x + b.w/2);
                const dy = (a.y + a.h/2) - (b.y + b.h/2);
                const combinedHalfW = (a.w + b.w) / 2;
                const combinedHalfH = (a.h + b.h) / 2;
                if (Math.abs(dx) < combinedHalfW && Math.abs(dy) < combinedHalfH) {
                    const overlapX = combinedHalfW - Math.abs(dx);
                    const overlapY = combinedHalfH - Math.abs(dy);
                    if (overlapX > overlapY) {
                        if (dy > 0) { b.y = a.y - b.h; b.vy = 0; if (a.onGround) b.onGround = true; } 
                        else { if (!a.onGround) { a.y = b.y - a.h; a.vy = 0; if (b.onGround) a.onGround = true; } }
                    } else {
                        const push = overlapX / 2;
                        if (dx > 0) { a.x += push; b.x -= push; } else { a.x -= push; b.x += push; }
                    }
                }
            }
        }
    }
}

window.addEventListener("keydown", e => {
    keys[e.key] = true;
    if (e.key === 'Escape') {
        gameState = 'MENU';
        showScreen('menuScreen');
    }
});
window.addEventListener("keyup", e => keys[e.key] = false);

let stars = Array.from({length: 120}, () => ({ 
    x: Math.random()*WORLD_WIDTH, 
    y: Math.random()*WORLD_HEIGHT, 
    size: Math.random()*2, 
    speed: Math.random()*0.3+0.1 
}));

function updateCamera() {
    if (players.length === 0) return;
    let activePlayers = players.filter(p => !p.absorbed);
    if (activePlayers.length === 0) activePlayers = players;
    let avgX = 0;
    let avgY = 0;
    activePlayers.forEach(p => { avgX += p.x + p.w/2; avgY += p.y + p.h/2; });
    avgX /= activePlayers.length;
    avgY /= activePlayers.length;
    let targetX = avgX - canvas.width / 2;
    let targetY = avgY - canvas.height / 2;
    targetX = Math.max(0, Math.min(targetX, WORLD_WIDTH - canvas.width));
    targetY = Math.max(0, Math.min(targetY, WORLD_HEIGHT - canvas.height));
    camera.x += (targetX - camera.x) * 0.1;
    camera.y += (targetY - camera.y) * 0.1;
}

function loop() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    if (gameState === 'PLAYING') {
        updateCamera();
        ctx.fillStyle = "white";
        stars.forEach(s => { 
            ctx.globalAlpha = 0.3; 
            let px = (s.x - camera.x * 0.5) % WORLD_WIDTH;
            let py = (s.y - camera.y * 0.5) % WORLD_HEIGHT;
            if (px < 0) px += WORLD_WIDTH;
            if (py < 0) py += WORLD_HEIGHT;
            ctx.fillRect(px, py, s.size, s.size); 
        });
        ctx.globalAlpha = 1;

        ctx.save();
        let sx = (Math.random()-0.5)*screenShake;
        let sy = (Math.random()-0.5)*screenShake;
        screenShake *= 0.9;
        ctx.translate(-camera.x + sx, -camera.y + sy);

        const level = levels[currentLevelIndex];
        ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
        ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
        for (let p of level.platforms) { 
            ctx.fillRect(p.x, p.y, p.w, p.h); 
            ctx.strokeRect(p.x, p.y, p.w, p.h); 
        }

        ctx.save();
        ctx.translate(level.goal.x + level.goal.w/2, level.goal.y + level.goal.h/2);
        ctx.rotate(Date.now() * 0.002);
        ctx.strokeStyle = varProp('--accent');
        ctx.lineWidth = 2;
        ctx.strokeRect(-level.goal.w/2, -level.goal.h/2, level.goal.w, level.goal.h);
        ctx.restore();

        players.forEach(p => p.update(level.platforms, level.goal));
        resolvePlayerCollisions();
        players.forEach(p => p.draw());
        ctx.restore();

        if (players.every(p => p.absorbed && p.scale <= 0.05)) {
            currentLevelIndex++;
            if (currentLevelIndex >= levels.length) {
                gameState = 'MENU';
                showScreen('menuScreen');
            } else {
                initPlayers();
            }
        }
    } else {
        ctx.fillStyle = "white";
        stars.forEach(s => { 
            ctx.globalAlpha = 0.2;
            ctx.fillRect(s.x % canvas.width, s.y % canvas.height, s.size, s.size); 
        });
    }
    requestAnimationFrame(loop);
}

function varProp(name) { return getComputedStyle(document.documentElement).getPropertyValue(name); }

generateLevelButtons();
loop();
</script>
</body>
</html>
