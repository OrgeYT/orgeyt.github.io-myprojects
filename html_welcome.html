<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
        }

        .welcome-container {
            position: relative;
        }

        h1 {
            color: #f8fafc;
            font-size: 5rem;
            letter-spacing: -0.05em;
            margin: 0;
            cursor: default;
            text-transform: uppercase;
            /* Clipping the text to reveal a background gradient animation */
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: shine 3s linear infinite;
        }

        /* Subtle glow effect */
        h1::after {
            content: "WELCOME";
            position: absolute;
            left: 0;
            top: 0;
            z-index: -1;
            filter: blur(25px);
            opacity: 0.4;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body>

    <div class="welcome-container">
        <h1>Welcome</h1>
    </div>

</body>
</html>
