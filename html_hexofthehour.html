<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex of the Hour</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Space+Mono&display=swap');
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000000;
            font-family: 'Outfit', sans-serif;
            color: white;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .glass-panel {
            background: rgba(10, 10, 10, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        /* Custom Select Styling */
        select {
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position-x: 95%;
            background-position-y: 50%;
        }
        select option {
            background-color: #111;
            color: #fff;
        }

        /* History Swatches */
        .history-swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease-out;
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: relative;
        }
        .history-swatch:hover {
            transform: scale(1.3);
            z-index: 10;
        }

        /* Calendar Icon Invert for Dark Mode */
        ::-webkit-calendar-picker-indicator {
            filter: invert(1);
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        ::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="antialiased h-screen w-screen flex items-center justify-center">

    <!-- Audio Player: Tries local file, then web fallback -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
        <source src="https://file.garden/Zj01o_oh-G9Y8APf/music.mp3" type="audio/mpeg">
    </audio>

    <!-- Animated Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- UI Overlay -->
    <main class="relative z-10 w-full max-w-md p-6">
        <div class="glass-panel rounded-3xl p-8 text-center transition-all duration-700 hover:border-white/20 relative">
            
            <!-- Music Toggle Button -->
            <button id="music-toggle" class="absolute top-6 right-6 text-white/30 hover:text-white transition-colors" title="Toggle Music">
                <svg id="icon-music-off" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                    <!-- Muted Icon -->
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
                <svg id="icon-music-on" class="hidden" width="20" height="20" fill="currentColor" viewBox="0 0 24 24">
                    <!-- Playing Icon -->
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>

            <p class="text-white/40 uppercase tracking-[0.4em] text-xs font-semibold mb-4 mt-2">Current Hex</p>
            
            <!-- Hex Code Display -->
            <h1 id="hex-display" class="font-space-mono text-6xl font-light mb-8 tracking-wider transition-colors duration-200 cursor-pointer hover:scale-105 transform inline-block" title="Click to copy">
                #000000
            </h1>

            <div class="space-y-5 text-left bg-black/30 p-5 rounded-2xl border border-white/5">
                <!-- Mode Toggle -->
                <div class="flex bg-black/50 rounded-xl p-1 border border-white/10">
                    <button id="btn-live" class="flex-1 text-[10px] uppercase tracking-widest py-2 rounded-lg bg-white/20 text-white font-semibold transition-all">Live</button>
                    <button id="btn-travel" class="flex-1 text-[10px] uppercase tracking-widest py-2 rounded-lg text-white/40 hover:text-white/80 transition-all">Time Travel</button>
                </div>

                <!-- Time Travel Input -->
                <div id="travel-container" class="hidden">
                    <label for="travel-input" class="block text-white/50 text-[10px] uppercase tracking-widest mb-1.5 ml-1">Destination Time</label>
                    <input type="datetime-local" id="travel-input" class="w-full bg-white/5 border border-white/10 text-white/90 rounded-xl p-3 outline-none focus:border-white/30 transition-colors text-sm font-light">
                </div>

                <!-- Timezone Selector -->
                <div>
                    <label for="tz-select" class="block text-white/50 text-[10px] uppercase tracking-widest mb-1.5 ml-1">Time Zone</label>
                    <select id="tz-select" class="w-full bg-white/5 border border-white/10 text-white/90 rounded-xl p-3 outline-none focus:border-white/30 transition-colors text-sm font-light">
                        <!-- Populated by JS -->
                    </select>
                </div>

                <!-- Frequency Basis Selector -->
                <div>
                    <label for="basis-select" class="block text-white/50 text-[10px] uppercase tracking-widest mb-1.5 ml-1">Color Changes Every</label>
                    <select id="basis-select" class="w-full bg-white/5 border border-white/10 text-white/90 rounded-xl p-3 outline-none focus:border-white/30 transition-colors text-sm font-light">
                        <option value="millisecond">Millisecond</option>
                        <option value="second">Second</option>
                        <option value="minute">Minute</option>
                        <option value="hour" selected>Hour</option>
                        <option value="day">Day</option>
                        <option value="month">Month</option>
                        <option value="year">Year</option>
                        <option value="decade">Decade</option>
                        <option value="century">Century</option>
                    </select>
                </div>
            </div>

            <!-- Current Time Display -->
            <div class="mt-8">
                <p id="time-display" class="font-space-mono text-white/60 text-sm tracking-widest">
                    --:--:--
                </p>
                <p id="date-display" class="font-space-mono text-white/40 text-xs tracking-wider mt-1 mb-4">
                    ---
                </p>
            </div>

            <!-- Past History Section -->
            <div class="border-t border-white/10 pt-4 mt-2">
                <p class="text-white/30 uppercase tracking-[0.2em] text-[10px] font-semibold mb-3">Past 10 Hex Codes</p>
                <div id="hex-history" class="flex flex-wrap gap-2 justify-center">
                    <!-- Populated by JS -->
                </div>
            </div>
            
        </div>
    </main>

    <!-- Project Credit -->
    <div class="fixed bottom-4 left-0 w-full text-center z-10 pointer-events-none">
        <p class="text-white/30 text-[10px] tracking-widest uppercase font-space-mono">
            "Theflyingcar123" from scratch for this project's main idea
        </p>
    </div>

    <script>
        // DOM Elements
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        const hexDisplay = document.getElementById('hex-display');
        const timeDisplay = document.getElementById('time-display');
        const dateDisplay = document.getElementById('date-display');
        const tzSelect = document.getElementById('tz-select');
        const basisSelect = document.getElementById('basis-select');
        const historyContainer = document.getElementById('hex-history');
        const btnLive = document.getElementById('btn-live');
        const btnTravel = document.getElementById('btn-travel');
        const travelContainer = document.getElementById('travel-container');
        const travelInput = document.getElementById('travel-input');
        
        // Audio Elements
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const iconMusicOn = document.getElementById('icon-music-on');
        const iconMusicOff = document.getElementById('icon-music-off');

        // State
        let targetColor = { r: 0, g: 0, b: 0, hex: '#000000' };
        let currentColor = { r: 0, g: 0, b: 0 };
        let currentPeriodString = '';
        let isTimeTravel = false;

        // Format for datetime-local
        function formatForInput(date) {
            const d = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
            return d.toISOString().slice(0, 16);
        }

        // Time Travel Toggle Logic
        btnLive.addEventListener('click', () => {
            isTimeTravel = false;
            btnLive.classList.add('bg-white/20', 'text-white', 'font-semibold');
            btnLive.classList.remove('text-white/40');
            btnTravel.classList.remove('bg-white/20', 'text-white', 'font-semibold');
            btnTravel.classList.add('text-white/40');
            travelContainer.classList.add('hidden');
            currentPeriodString = ''; // force update
            updateTimeAndColor();
        });

        btnTravel.addEventListener('click', () => {
            isTimeTravel = true;
            btnTravel.classList.add('bg-white/20', 'text-white', 'font-semibold');
            btnTravel.classList.remove('text-white/40');
            btnLive.classList.remove('bg-white/20', 'text-white', 'font-semibold');
            btnLive.classList.add('text-white/40');
            travelContainer.classList.remove('hidden');
            
            if (!travelInput.value) {
                travelInput.value = formatForInput(new Date());
            }
            currentPeriodString = ''; // force update
            updateTimeAndColor();
        });

        travelInput.addEventListener('input', () => {
            currentPeriodString = ''; // force update
            updateTimeAndColor();
        });

        // Audio Logic
        musicToggle.addEventListener('click', () => {
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    iconMusicOn.classList.remove('hidden');
                    iconMusicOff.classList.add('hidden');
                    musicToggle.classList.replace('text-white/30', 'text-white/90');
                }).catch(e => console.log("Audio play failed:", e));
            } else {
                bgMusic.pause();
                iconMusicOn.classList.add('hidden');
                iconMusicOff.classList.remove('hidden');
                musicToggle.classList.replace('text-white/90', 'text-white/30');
            }
        });

        // Canvas Setup
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Populate Timezones
        function setupTimezones() {
            let timezones = [];
            try {
                timezones = Intl.supportedValuesOf('timeZone');
            } catch(e) {
                timezones = ['UTC', 'America/New_York', 'America/Los_Angeles', 'Europe/London', 'Asia/Tokyo', 'Australia/Sydney'];
            }
            
            const userTZ = Intl.DateTimeFormat().resolvedOptions().timeZone;
            
            timezones.forEach(tz => {
                const option = document.createElement('option');
                option.value = tz;
                option.textContent = tz.replace(/_/g, ' ');
                if (tz === userTZ) option.selected = true;
                tzSelect.appendChild(option);
            });
        }
        setupTimezones();

        // HSL to Hex Conversion (keeps colors vibrant and calming)
        function HSLToRGB(h, s, l) {
            s /= 100;
            l /= 100;
            let c = (1 - Math.abs(2 * l - 1)) * s,
                x = c * (1 - Math.abs((h / 60) % 2 - 1)),
                m = l - c/2,
                r = 0, g = 0, b = 0;

            if (0 <= h && h < 60) { r = c; g = x; b = 0; }
            else if (60 <= h && h < 120) { r = x; g = c; b = 0; }
            else if (120 <= h && h < 180) { r = 0; g = c; b = x; }
            else if (180 <= h && h < 240) { r = 0; g = x; b = c; }
            else if (240 <= h && h < 300) { r = x; g = 0; b = c; }
            else if (300 <= h && h < 360) { r = c; g = 0; b = x; }

            return {
                r: Math.round((r + m) * 255),
                g: Math.round((g + m) * 255),
                b: Math.round((b + m) * 255)
            };
        }

        function RGBToHex(r, g, b) {
            return "#" + (1 << 24 | r << 16 | g << 8 | b).toString(16).slice(1).toUpperCase();
        }

        // Generate Color from String Hash
        function stringToColor(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                hash = str.charCodeAt(i) + ((hash << 5) - hash);
            }
            
            // Use a seeded pseudo-random function to ensure sequential times produce completely different colors
            const seededRandom = (seed) => {
                const x = Math.sin(seed) * 10000;
                return x - Math.floor(x);
            };

            // Calming colors: Full Hue wheel, Saturation 60-90%, Lightness 50-70%
            const h = Math.floor(seededRandom(hash) * 360);
            const s = 60 + Math.floor(seededRandom(hash + 1) * 30);
            const l = 50 + Math.floor(seededRandom(hash + 2) * 20);
            
            const rgb = HSLToRGB(h, s, l);
            const hex = RGBToHex(rgb.r, rgb.g, rgb.b);
            
            return { ...rgb, hex };
        }

        function getPeriodStringForDate(dateObj, tz, basis) {
            const partsFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', 
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            });
            const partsArray = partsFormatter.formatToParts(dateObj);
            const p = {};
            partsArray.forEach(({type, value}) => p[type] = value);

            let periodString = '';

            if (basis === 'century') {
                periodString = `${Math.floor(parseInt(p.year) / 100) * 100}`;
            } else if (basis === 'decade') {
                periodString = `${Math.floor(parseInt(p.year) / 10) * 10}`;
            } else {
                periodString = `${p.year}`;
                if (['month', 'day', 'hour', 'minute', 'second', 'millisecond'].includes(basis)) periodString += `-${p.month}`;
                if (['day', 'hour', 'minute', 'second', 'millisecond'].includes(basis)) periodString += `-${p.day}`;
                if (['hour', 'minute', 'second', 'millisecond'].includes(basis)) periodString += `-${p.hour}`;
                if (['minute', 'second', 'millisecond'].includes(basis)) periodString += `-${p.minute}`;
                if (['second', 'millisecond'].includes(basis)) periodString += `-${p.second}`;
                if (basis === 'millisecond') periodString += `-${dateObj.getMilliseconds()}`;
            }
            return periodString;
        }

        function updatePastHistory(now, tz, basis) {
            historyContainer.innerHTML = ''; // Clear previous
            
            // Generate the past 10 periods
            for (let i = 1; i <= 10; i++) {
                let pastDate = new Date(now.getTime());
                
                if (basis === 'millisecond') pastDate.setMilliseconds(now.getMilliseconds() - i);
                else if (basis === 'second') pastDate.setSeconds(now.getSeconds() - i);
                else if (basis === 'minute') pastDate.setMinutes(now.getMinutes() - i);
                else if (basis === 'hour') pastDate.setHours(now.getHours() - i);
                else if (basis === 'day') pastDate.setDate(now.getDate() - i);
                else if (basis === 'month') pastDate.setMonth(now.getMonth() - i);
                else if (basis === 'year') pastDate.setFullYear(now.getFullYear() - i);
                else if (basis === 'decade') pastDate.setFullYear(now.getFullYear() - (i * 10));
                else if (basis === 'century') pastDate.setFullYear(now.getFullYear() - (i * 100));

                const pStr = getPeriodStringForDate(pastDate, tz, basis);
                const color = stringToColor(pStr);

                // Create visual swatch
                const swatch = document.createElement('div');
                swatch.className = 'history-swatch';
                swatch.style.backgroundColor = color.hex;
                swatch.style.boxShadow = `0 0 5px ${color.hex}`;
                swatch.title = `Past Hex: ${color.hex} (Click to copy)`;
                
                // Copy on click
                swatch.addEventListener('click', () => copyToClipboard(color.hex, swatch));
                
                historyContainer.appendChild(swatch);
            }
        }

        // Universal Copy Function
        function copyToClipboard(text, element) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                document.execCommand('copy');
                // Brief visual feedback depending on which element was clicked
                if (element.id === 'hex-display') {
                    const originalText = element.textContent;
                    element.textContent = "COPIED!";
                    setTimeout(() => element.textContent = originalText, 1000);
                } else {
                    const originalShadow = element.style.boxShadow;
                    element.style.boxShadow = `0 0 15px white`;
                    setTimeout(() => element.style.boxShadow = originalShadow, 500);
                }
            } catch (err) {
                console.error("Copy failed:", err);
            }
            
            document.body.removeChild(textArea);
        }

        // Time Logic
        function updateTimeAndColor() {
            const tz = tzSelect.value;
            const basis = basisSelect.value;
            
            let now;
            if (isTimeTravel && travelInput.value) {
                now = new Date(travelInput.value);
            } else {
                now = new Date();
            }

            const timeFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true
            });
            const dateFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: tz, year: 'numeric', month: 'long', day: 'numeric'
            });

            // Display time
            timeDisplay.textContent = timeFormatter.format(now);
            dateDisplay.textContent = dateFormatter.format(now);

            // Check current period string
            const periodString = getPeriodStringForDate(now, tz, basis);

            // If period changed, calculate new target color and update history
            if (periodString !== currentPeriodString) {
                currentPeriodString = periodString;
                targetColor = stringToColor(periodString);
                hexDisplay.textContent = targetColor.hex;
                updatePastHistory(now, tz, basis);
            }
        }

        // Animation Particles
        class SpiralParticle {
            constructor() {
                this.reset(true);
            }
            reset(randomRadius = false) {
                this.angle = Math.random() * Math.PI * 2;
                const maxRadius = Math.max(canvas.width, canvas.height) * 0.8;
                this.radius = randomRadius ? Math.random() * maxRadius : maxRadius;
                this.speed = Math.random() * 0.005 + 0.002;
                this.size = Math.random() * 2 + 0.5;
                this.inwardSpeed = Math.random() * 0.5 + 0.1;
            }
            update() {
                this.angle -= this.speed; // Spin
                this.radius -= this.radius * 0.005 + this.inwardSpeed; // Pull inward logarithmically
                
                if (this.radius < 5) {
                    this.reset(); // Respawn at edge
                }
            }
            draw(ctx, r, g, b) {
                const x = canvas.width / 2 + Math.cos(this.angle) * this.radius;
                const y = canvas.height / 2 + Math.sin(this.angle) * this.radius;
                
                // Fade out particles near the center
                const alpha = Math.min(1, this.radius / 50); 

                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha * 0.8})`;
                ctx.beginPath();
                ctx.arc(x, y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class FloatingDot {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.vx = (Math.random() - 0.5) * 0.3;
                this.vy = (Math.random() - 0.5) * 0.3;
                this.life = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life += 0.01;
                
                if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) {
                    this.reset();
                }
            }
            draw(ctx, r, g, b) {
                const alpha = (Math.sin(this.life) + 1) / 4; // Gentle pulse
                ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const spiralParticles = Array.from({ length: 400 }, () => new SpiralParticle());
        const floatingDots = Array.from({ length: 100 }, () => new FloatingDot());

        // Copy to clipboard from main display
        hexDisplay.addEventListener('click', () => copyToClipboard(targetColor.hex, hexDisplay));

        // Trigger update immediately on dropdown change
        tzSelect.addEventListener('change', () => {
            currentPeriodString = ''; // Force update
            updateTimeAndColor();
        });
        basisSelect.addEventListener('change', () => {
            currentPeriodString = ''; // Force update
            updateTimeAndColor();
        });

        // Main Animation Loop
        function animate() {
            updateTimeAndColor();

            // Smoothly interpolate current color to target color (Lerp)
            currentColor.r += (targetColor.r - currentColor.r) * 0.02;
            currentColor.g += (targetColor.g - currentColor.g) * 0.02;
            currentColor.b += (targetColor.b - currentColor.b) * 0.02;

            const { r, g, b } = currentColor;
            const cr = Math.round(r);
            const cg = Math.round(g);
            const cb = Math.round(b);

            // Update UI Glow
            hexDisplay.style.textShadow = `0 0 25px rgba(${cr}, ${cg}, ${cb}, 0.8)`;
            
            // Draw Background (Trails effect)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Ambient Center Glow
            const gradient = ctx.createRadialGradient(
                canvas.width/2, canvas.height/2, 0, 
                canvas.width/2, canvas.height/2, Math.max(canvas.width, canvas.height)/2
            );
            gradient.addColorStop(0, `rgba(${cr}, ${cg}, ${cb}, 0.08)`);
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Elements with global glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = `rgb(${cr}, ${cg}, ${cb})`;

            spiralParticles.forEach(p => {
                p.update();
                p.draw(ctx, cr, cg, cb);
            });

            floatingDots.forEach(d => {
                d.update();
                d.draw(ctx, cr, cg, cb);
            });

            ctx.shadowBlur = 0; // Reset shadow for next frame's clear rect

            requestAnimationFrame(animate);
        }

        // Initialize
        updateTimeAndColor();
        // Snap current color to first target color instantly on load
        currentColor = { r: targetColor.r, g: targetColor.g, b: targetColor.b };
        animate();

    </script>
</body>
</html>
