<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Air Hockey</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fff;
            width: 100vw;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            background-color: #fff;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #gameCanvas {
            display: block;
            background-color: transparent;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        #scoreboard {
            position: absolute;
            top: 20px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            pointer-events: none;
            z-index: 10;
        }

        .score {
            font-size: 60px;
            font-weight: bold;
            opacity: 0.3;
        }

        #cpu-score { color: #007bff; }
        #player-score { color: #dc3545; }

        #message-overlay, #pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            z-index: 20;
            display: none;
        }

        #message-overlay h1, #pause-overlay h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-align: center;
        }

        button {
            padding: 12px 24px;
            font-size: 1.2rem;
            cursor: pointer;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 8px;
            transition: background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #c82333;
        }

        .settings-container {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .setting-btn {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 20px;
            backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .setting-btn:hover {
            background-color: rgba(255, 255, 255, 0.2);
            border-color: #fff;
            transform: scale(1.05);
        }

        .setting-btn.active {
            background-color: #dc3545;
            border-color: #dc3545;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="scoreboard">
        <div id="cpu-score" class="score">0</div>
        <div id="player-score" class="score">0</div>
    </div>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="message-overlay">
        <h1 id="game-message">Air Hockey</h1>
        <div class="settings-container">
            <button id="menu-control-toggle" class="setting-btn">Control: Cursor</button>
            <button id="menu-illegal-toggle" class="setting-btn">Illegal Mode: OFF</button>
        </div>
        <button id="start-btn">Start Game</button>
    </div>
    
    <div id="pause-overlay">
        <h1>Paused</h1>
        <button id="resume-btn">Resume</button>
        <button id="restart-btn">Restart Game</button>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('game-container');
const cpuScoreEl = document.getElementById('cpu-score');
const playerScoreEl = document.getElementById('player-score');
const overlay = document.getElementById('message-overlay');
const msgEl = document.getElementById('game-message');
const startBtn = document.getElementById('start-btn');
const pauseOverlay = document.getElementById('pause-overlay');
const resumeBtn = document.getElementById('resume-btn');
const restartBtn = document.getElementById('restart-btn');
const menuControlBtn = document.getElementById('menu-control-toggle');
const menuIllegalBtn = document.getElementById('menu-illegal-toggle');

const GAME_WIDTH = 400; 
const GAME_HEIGHT = 600; 
let scale = 1;

const FRICTION = 0.99; 
const RESTITUTION = 0.85; 
const PADDLE_MASS = 10;
const PUCK_MASS = 1;
const MAX_SPEED = 25; 

let gameState = 'START'; 
let playerScore = 0;
let cpuScore = 0;
const WINNING_SCORE = 7;
let illegalMode = false;
let controlMode = 'cursor'; 

let mouseX = 0;
let mouseY = 0;
let isInteracting = false;

const keys = {
    ArrowUp: false,
    ArrowDown: false,
    ArrowLeft: false,
    ArrowRight: false
};

class Circle {
    constructor(x, y, radius, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.vx = 0;
        this.vy = 0;
    }

    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        
        const gradient = ctx.createRadialGradient(
            this.x - this.radius/3, this.y - this.radius/3, this.radius/10,
            this.x, this.y, this.radius
        );
        gradient.addColorStop(0, lightenColor(this.color, 40));
        gradient.addColorStop(1, this.color);
        
        ctx.fillStyle = gradient;
        ctx.fill();
        
        if (this.radius > 15) {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius * 0.4, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fill();
        }

        ctx.strokeStyle = 'rgba(0,0,0,0.5)';
        ctx.lineWidth = 2 * scale;
        ctx.stroke();
        ctx.closePath();
    }
}

let puck;
let playerPaddle;
let cpuPaddle;
let goalWidth;

function lightenColor(color, percent) {
    const num = parseInt(color.replace("#",""), 16),
    amt = Math.round(2.55 * percent),
    R = (num >> 16) + amt,
    B = (num >> 8 & 0x00FF) + amt,
    G = (num & 0x0000FF) + amt;
    return "#" + (0x1000000 + (R<255?R<1?0:R:255)*0x10000 + (B<255?B<1?0:B:255)*0x100 + (G<255?G<1?0:G:255)).toString(16).slice(1);
}

function resize() {
    const targetWidth = window.innerWidth;
    const targetHeight = window.innerHeight;

    container.style.width = `${targetWidth}px`;
    container.style.height = `${targetHeight}px`;
    canvas.width = targetWidth;
    canvas.height = targetHeight;
    
    scale = Math.min(targetWidth / GAME_WIDTH, targetHeight / GAME_HEIGHT);
    initEntities();
}

function initEntities() {
    const w = canvas.width;
    const h = canvas.height;
    
    const paddleRadius = 30 * scale;
    const puckRadius = 15 * scale;
    goalWidth = 120 * scale;

    playerPaddle = new Circle(w / 2, h - paddleRadius * 2, paddleRadius, '#dc3545');
    cpuPaddle = new Circle(w / 2, paddleRadius * 2, paddleRadius, '#007bff');
    puck = new Circle(w / 2, h / 2, puckRadius, '#111');
    
    playerPaddle.vx = 0; playerPaddle.vy = 0;
    cpuPaddle.vx = 0; cpuPaddle.vy = 0;
    puck.vx = 0; puck.vy = 0;
}

function drawBoard() {
    const w = canvas.width;
    const h = canvas.height;
    
    ctx.clearRect(0, 0, w, h);

    ctx.fillStyle = '#e8e8e8';
    const dotSpacing = 25 * scale;
    const dotRadius = 1.5 * scale;
    for (let x = dotSpacing / 2; x < w; x += dotSpacing) {
        for (let y = dotSpacing / 2; y < h; y += dotSpacing) {
            ctx.beginPath();
            ctx.arc(x, y, dotRadius, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    ctx.lineWidth = 4 * scale;
    
    ctx.beginPath();
    ctx.moveTo(0, h / 2);
    ctx.lineTo(w, h / 2);
    ctx.strokeStyle = '#007bff';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(w / 2, h / 2, 60 * scale, 0, Math.PI * 2);
    ctx.strokeStyle = '#333';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(w / 2, 0, 80 * scale, 0, Math.PI);
    ctx.strokeStyle = '#007bff';
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(w / 2, h, 80 * scale, Math.PI, 0);
    ctx.strokeStyle = '#dc3545';
    ctx.stroke();
    
    ctx.fillStyle = '#111';
    ctx.fillRect(w/2 - goalWidth/2, -10, goalWidth, 20);
    ctx.fillRect(w/2 - goalWidth/2, h - 10, goalWidth, 20);
}

function resolveCollision(circle1, circle2, mass1, mass2) {
    const dx = circle2.x - circle1.x;
    const dy = circle2.y - circle1.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    
    if (distance < circle1.radius + circle2.radius) {
        const nx = dx / distance;
        const ny = dy / distance;
        
        const dvx = circle1.vx - circle2.vx;
        const dvy = circle1.vy - circle2.vy;
        
        const velAlongNormal = dvx * nx + dvy * ny;
        
        if (velAlongNormal > 0) {
            const e = RESTITUTION;
            
            let j = -(1 + e) * velAlongNormal;
            j /= (1 / mass1) + (1 / mass2);
            
            const impulseX = j * nx;
            const impulseY = j * ny;
            
            circle1.vx += impulseX / mass1;
            circle1.vy += impulseY / mass1;
            circle2.vx -= impulseX / mass2;
            circle2.vy -= impulseY / mass2;
            
            const percent = 0.8;
            const slop = 0.01;
            const penetration = (circle1.radius + circle2.radius) - distance;
            const correctionAmount = Math.max(penetration - slop, 0.0) / ((1/mass1) + (1/mass2)) * percent;
            const cx = correctionAmount * nx;
            const cy = correctionAmount * ny;
            
            circle1.x -= cx / mass1;
            circle1.y -= cy / mass1;
            circle2.x += cx / mass2;
            circle2.y += cy / mass2;
        }
    }
}

function updatePhysics() {
    if (gameState !== 'PLAYING') return;
    const w = canvas.width;
    const h = canvas.height;

    if (controlMode === 'cursor') {
        if (isInteracting) {
            const targetX = Math.max(playerPaddle.radius, Math.min(w - playerPaddle.radius, mouseX));
            const minY = illegalMode ? playerPaddle.radius : h / 2 + playerPaddle.radius;
            const targetY = Math.max(minY, Math.min(h - playerPaddle.radius, mouseY));
            
            playerPaddle.vx = (targetX - playerPaddle.x) * 0.3;
            playerPaddle.vy = (targetY - playerPaddle.y) * 0.3;
            
            playerPaddle.x = targetX;
            playerPaddle.y = targetY;
        } else {
            playerPaddle.vx *= 0.8;
            playerPaddle.vy *= 0.8;
            playerPaddle.x += playerPaddle.vx;
            playerPaddle.y += playerPaddle.vy;
        }
    } else if (controlMode === 'keyboard') {
        const accel = 3 * scale;
        if (keys.ArrowLeft) playerPaddle.vx -= accel;
        if (keys.ArrowRight) playerPaddle.vx += accel;
        if (keys.ArrowUp) playerPaddle.vy -= accel;
        if (keys.ArrowDown) playerPaddle.vy += accel;

        playerPaddle.vx *= 0.82;
        playerPaddle.vy *= 0.82;

        let nextX = playerPaddle.x + playerPaddle.vx;
        let nextY = playerPaddle.y + playerPaddle.vy;

        const minY = illegalMode ? playerPaddle.radius : h / 2 + playerPaddle.radius;

        if (nextX < playerPaddle.radius) { nextX = playerPaddle.radius; playerPaddle.vx *= -0.5; }
        if (nextX > w - playerPaddle.radius) { nextX = w - playerPaddle.radius; playerPaddle.vx *= -0.5; }
        if (nextY < minY) { nextY = minY; playerPaddle.vy *= -0.5; }
        if (nextY > h - playerPaddle.radius) { nextY = h - playerPaddle.radius; playerPaddle.vy *= -0.5; }

        playerPaddle.x = nextX;
        playerPaddle.y = nextY;
    }

    let targetCpuX = cpuPaddle.x;
    let targetCpuY = cpuPaddle.y;
    const cpuSpeed = 5 * scale; 

    const attackCondition = illegalMode ? true : (puck.y < h / 2 + puck.radius);

    if (attackCondition) {
        if (puck.y < cpuPaddle.y) {
            targetCpuX = w / 2;
            targetCpuY = cpuPaddle.radius * 2;
        } else {
            targetCpuX = puck.x + (puck.vx * 2); 
            targetCpuY = puck.y - puck.radius - 5*scale; 
        }
    } else {
        targetCpuX = (w/2 * 0.6) + (puck.x * 0.4); 
        targetCpuY = h * 0.15; 
    }
    
    const maxY = illegalMode ? h - cpuPaddle.radius : h / 2 - cpuPaddle.radius;
    
    targetCpuX = Math.max(cpuPaddle.radius, Math.min(w - cpuPaddle.radius, targetCpuX));
    targetCpuY = Math.max(cpuPaddle.radius, Math.min(maxY, targetCpuY));

    const cpuDx = targetCpuX - cpuPaddle.x;
    const cpuDy = targetCpuY - cpuPaddle.y;
    const cpuDist = Math.sqrt(cpuDx * cpuDx + cpuDy * cpuDy);
    
    if (cpuDist > 0) {
        const moveRatio = Math.min(cpuSpeed / cpuDist, 1);
        cpuPaddle.vx = cpuDx * moveRatio;
        cpuPaddle.vy = cpuDy * moveRatio;
        cpuPaddle.x += cpuPaddle.vx;
        cpuPaddle.y += cpuPaddle.vy;
    }

    puck.vx *= FRICTION;
    puck.vy *= FRICTION;
    
    const speed = Math.sqrt(puck.vx * puck.vx + puck.vy * puck.vy);
    if (speed > MAX_SPEED * scale) {
        puck.vx = (puck.vx / speed) * MAX_SPEED * scale;
        puck.vy = (puck.vy / speed) * MAX_SPEED * scale;
    }
    
    puck.x += puck.vx;
    puck.y += puck.vy;

    const isGoalX = puck.x > (w/2 - goalWidth/2 + puck.radius) && puck.x < (w/2 + goalWidth/2 - puck.radius);
    
    if (puck.x - puck.radius < 0) {
        puck.x = puck.radius;
        puck.vx *= -RESTITUTION;
    } else if (puck.x + puck.radius > w) {
        puck.x = w - puck.radius;
        puck.vx *= -RESTITUTION;
    }

    if (puck.y - puck.radius < 0) {
        if (!isGoalX) {
            puck.y = puck.radius;
            puck.vy *= -RESTITUTION;
        } else if (puck.y + puck.radius < 0) {
            score('player');
        }
    } else if (puck.y + puck.radius > h) {
        if (!isGoalX) {
            puck.y = h - puck.radius;
            puck.vy *= -RESTITUTION;
        } else if (puck.y - puck.radius > h) {
            score('cpu');
        }
    }

    resolveCollision(playerPaddle, puck, PADDLE_MASS, PUCK_MASS);
    resolveCollision(cpuPaddle, puck, PADDLE_MASS, PUCK_MASS);
}

function score(scorer) {
    if (scorer === 'player') {
        playerScore++;
        playerScoreEl.textContent = playerScore;
    } else {
        cpuScore++;
        cpuScoreEl.textContent = cpuScore;
    }

    if (playerScore >= WINNING_SCORE || cpuScore >= WINNING_SCORE) {
        endGame(scorer === 'player' ? 'You Win!' : 'CPU Wins!');
    } else {
        resetBoard(scorer === 'player' ? 'cpu' : 'player');
    }
}

function resetBoard(serveTo) {
    const w = canvas.width;
    const h = canvas.height;
    
    puck.vx = 0;
    puck.vy = 0;
    puck.x = w / 2;
    puck.y = serveTo === 'player' ? h * 0.75 : h * 0.25;
}

function endGame(msg) {
    gameState = 'GAMEOVER';
    msgEl.textContent = msg;
    startBtn.textContent = 'Play Again';
    overlay.style.display = 'flex';
}

function startGame() {
    playerScore = 0;
    cpuScore = 0;
    playerScoreEl.textContent = '0';
    cpuScoreEl.textContent = '0';
    overlay.style.display = 'none';
    pauseOverlay.style.display = 'none';
    initEntities();
    gameState = 'PLAYING';
}

function togglePause() {
    if (gameState === 'PLAYING') {
        gameState = 'PAUSED';
        pauseOverlay.style.display = 'flex';
    } else if (gameState === 'PAUSED') {
        gameState = 'PLAYING';
        pauseOverlay.style.display = 'none';
    }
}

function loop() {
    updatePhysics();
    drawBoard();
    
    if (puck && playerPaddle && cpuPaddle) {
        cpuPaddle.draw();
        playerPaddle.draw();
        puck.draw();
    }
    
    requestAnimationFrame(loop);
}

resize();
window.addEventListener('resize', resize);
overlay.style.display = 'flex';

startBtn.addEventListener('click', startGame);
resumeBtn.addEventListener('click', togglePause);
restartBtn.addEventListener('click', startGame);

menuControlBtn.addEventListener('click', () => {
    controlMode = controlMode === 'cursor' ? 'keyboard' : 'cursor';
    menuControlBtn.textContent = `Control: ${controlMode === 'cursor' ? 'Cursor' : 'Arrows'}`;
});

menuIllegalBtn.addEventListener('click', () => {
    illegalMode = !illegalMode;
    menuIllegalBtn.textContent = `Illegal Mode: ${illegalMode ? 'ON' : 'OFF'}`;
    menuIllegalBtn.classList.toggle('active', illegalMode);
});

window.addEventListener('keydown', (e) => {
    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) {
        keys[e.key] = true;
        if(controlMode === 'keyboard') e.preventDefault(); 
    }
    if (e.key === 'Escape') {
        togglePause();
    }
});

window.addEventListener('keyup', (e) => {
    if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = false;
    }
});

canvas.addEventListener('mousemove', (e) => {
    if (controlMode !== 'cursor') return;
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
    isInteracting = true;
});
canvas.addEventListener('mouseleave', () => isInteracting = false);
canvas.addEventListener('mouseenter', () => {
    if(gameState === 'PLAYING') isInteracting = true;
});

canvas.addEventListener('touchstart', (e) => {
    if (controlMode !== 'cursor') return;
    e.preventDefault(); 
    const rect = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
    mouseY = e.touches[0].clientY - rect.top;
    isInteracting = true;
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
    if (controlMode !== 'cursor') return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    mouseX = e.touches[0].clientX - rect.left;
    mouseY = e.touches[0].clientY - rect.top;
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
    if (controlMode !== 'cursor') return;
    e.preventDefault();
    isInteracting = false;
}, {passive: false});

requestAnimationFrame(loop);
</script>
</body>
</html>
