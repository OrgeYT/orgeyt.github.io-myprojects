<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eye Jump Platformer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent scroll on touch */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            /* Aspect ratio trick for canvas */
            aspect-ratio: 4/3;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* Mobile Controls */
        #mobile-controls {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            height: 100px;
            display: none; /* Hidden by default, shown via JS if touch detected */
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            pointer-events: none;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: auto;
            user-select: none;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }

        .control-btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }

        .d-pad {
            display: flex;
            gap: 15px;
        }

        /* UI Overlays */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .panel {
            background: rgba(0, 0, 0, 0.75);
            padding: 30px 50px;
            border-radius: 20px;
            color: white;
            pointer-events: auto;
            border: 3px solid #78C2FC;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transform: scale(1);
            transition: transform 0.2s;
        }
        
        h1 { margin: 0 0 15px 0; font-size: 40px; color: #fff; text-shadow: 2px 2px 0 #000; }
        p { font-size: 18px; margin-bottom: 25px; line-height: 1.5; color: #ddd; }
        
        button.play-btn {
            background: #6BE879;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 0 #4CA857;
            transition: all 0.1s;
        }
        
        button.play-btn:active {
            transform: translateY(5px);
            box-shadow: 0 0 0 #4CA857;
        }

        .hidden { display: none !important; }

        @media (max-width: 800px) {
            #game-container { aspect-ratio: auto; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="mobile-controls">
        <div class="d-pad">
            <div class="control-btn" id="btn-left">◀</div>
            <div class="control-btn" id="btn-right">▶</div>
        </div>
        <div class="control-btn" id="btn-jump">▲</div>
    </div>

    <div id="ui-layer">
        <div id="menu-panel" class="panel">
            <h1>Eye Jump</h1>
            <p>Use Arrow Keys / WASD to move.<br>Space or UP to jump.<br>Reach the portal to advance.<br>Defeat the boss at Level 8!</p>
            <button class="play-btn" onclick="startGame()">Start Game</button>
        </div>
        
        <div id="game-over-panel" class="panel hidden">
            <h1>Game Over</h1>
            <p>You fell or got squished.</p>
            <button class="play-btn" onclick="resetLevel()">Try Again</button>
        </div>

        <div id="win-panel" class="panel hidden">
            <h1>Victory!</h1>
            <p>You defeated the boss and beat the game!</p>
            <button class="play-btn" onclick="showMenu()">Main Menu</button>
        </div>
        
        <div id="level-title" class="panel hidden" style="background:transparent; border:none; box-shadow:none; pointer-events:none;">
            <h1 id="level-text" style="font-size: 60px; color: rgba(255,255,255,0.8);">Level 1</h1>
        </div>
    </div>
</div>

<script>
    /** --- SOUND ENGINE --- */
    const SoundEngine = {
        ctx: null,
        init() {
            if (this.ctx) return;
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        },
        play(freq, type, duration, volume, slide = 0) {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            if (slide !== 0) {
                osc.frequency.exponentialRampToValueAtTime(freq + slide, this.ctx.currentTime + duration);
            }
            
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        },
        jump() {
            this.play(150, 'triangle', 0.2, 0.3, 400);
        },
        land() {
            this.play(100, 'sine', 0.1, 0.2, -50);
        },
        walk() {
            this.play(60, 'sine', 0.05, 0.1, -20);
        },
        bossHit() {
            this.play(200, 'sawtooth', 0.4, 0.2, -150);
            this.play(100, 'square', 0.2, 0.2, -50);
        },
        levelFinish() {
            this.play(440, 'triangle', 0.1, 0.2, 220);
            setTimeout(() => this.play(660, 'triangle', 0.3, 0.2, 220), 100);
        },
        gameWin() {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((f, i) => {
                setTimeout(() => this.play(f, 'triangle', 0.5, 0.2, 50), i * 150);
            });
        }
    };

    /** --- SETUP & GLOBALS --- */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const uiMenu = document.getElementById('menu-panel');
    const uiGameOver = document.getElementById('game-over-panel');
    const uiWin = document.getElementById('win-panel');
    const uiLevelTitle = document.getElementById('level-title');
    const levelText = document.getElementById('level-text');
    const mobileControls = document.getElementById('mobile-controls');

    // Game Constants
    const GRAVITY = 0.6;
    const TERMINAL_VELOCITY = 15;
    const GAME_WIDTH = 800;
    const GAME_HEIGHT = 600;
    
    // Game State
    let gameState = 'MENU'; // MENU, PLAYING, TRANSITION, GAMEOVER, WIN
    let currentLevel = 0;
    let frameCount = 0;
    let cameraY = 0;
    let keys = { left: false, right: false, up: false };

    // Entities
    let player;
    let platforms = [];
    let portal = null;
    let particles = [];
    let clouds = [];
    let boss = null;

    /** --- INPUT HANDLING --- */
    window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = true;
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
        if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') keys.up = false;
    });

    // Touch Support
    function isTouchDevice() {
        return (('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || (navigator.msMaxTouchPoints > 0));
    }
    
    if (isTouchDevice()) {
        mobileControls.style.display = 'flex';
        
        const bindTouch = (id, key) => {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            el.addEventListener('touchcancel', (e) => { e.preventDefault(); keys[key] = false; });
        };
        bindTouch('btn-left', 'left');
        bindTouch('btn-right', 'right');
        bindTouch('btn-jump', 'up');
    }

    /** --- UTILS --- */
    function lerp(a, b, t) { return a + (b - a) * t; }
    
    // Draw a rounded rectangle
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    }

    /** --- CLASSES --- */
    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * 4;
            this.vy = (Math.random() - 0.5) * 4;
            this.life = 1.0;
            this.decay = Math.random() * 0.03 + 0.02;
            this.size = Math.random() * 6 + 4;
            this.color = color;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life -= this.decay;
            this.size *= 0.95;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function spawnDust(x, y, count=10) {
        for(let i=0; i<count; i++) {
            particles.push(new Particle(x, y, '#dddddd'));
        }
    }

    class Player {
        constructor(x, y) {
            this.w = 56;
            this.h = 56;
            this.x = x;
            this.y = y;
            this.vx = 0;
            this.vy = 0;
            this.speed = 6;
            this.jumpPower = 14;
            this.onGround = false;
            this.wasOnGround = false;
            
            // Squash and stretch parameters
            this.scaleX = 1;
            this.scaleY = 1;
            
            // Eye tracking
            this.targetEyeX = 0;
            this.targetEyeY = 0;
            this.currentEyeX = 0;
            this.currentEyeY = 0;
            
            this.dead = false;
            this.walkTimer = 0;
        }

        update() {
            if (this.dead) return;

            // Physics & Input
            if (keys.left) { this.vx -= 1.5; this.targetEyeX = -1; }
            if (keys.right) { this.vx += 1.5; this.targetEyeX = 1; }
            if (!keys.left && !keys.right) {
                this.vx *= 0.7; // Friction
                this.targetEyeX = 0;
            }
            
            // Walking sound
            if (this.onGround && Math.abs(this.vx) > 0.5) {
                this.walkTimer++;
                if (this.walkTimer % 15 === 0) SoundEngine.walk();
            } else {
                this.walkTimer = 0;
            }

            // Speed cap
            if (this.vx > this.speed) this.vx = this.speed;
            if (this.vx < -this.speed) this.vx = -this.speed;

            // Gravity
            this.vy += GRAVITY;
            if (this.vy > TERMINAL_VELOCITY) this.vy = TERMINAL_VELOCITY;
            
            this.targetEyeY = this.vy > 2 ? 1 : (this.vy < -2 ? -1 : 0);

            // Jump
            if (keys.up && this.onGround) {
                this.vy = -this.jumpPower;
                this.onGround = false;
                SoundEngine.jump();
                // Jump Squash & Stretch
                this.scaleX = 0.6;
                this.scaleY = 1.4;
                spawnDust(this.x + this.w/2, this.y + this.h);
            }

            // Move X
            this.x += this.vx;
            this.checkCollisions(true);

            // Move Y
            this.y += this.vy;
            this.wasOnGround = this.onGround;
            this.onGround = false;
            this.checkCollisions(false);

            // Landing squash
            if (this.onGround && !this.wasOnGround) {
                SoundEngine.land();
                this.scaleX = 1.4;
                this.scaleY = 0.6;
                spawnDust(this.x + this.w/2, this.y + this.h);
            }

            // Animate Squash and Stretch back to normal
            this.scaleX = lerp(this.scaleX, 1, 0.15);
            this.scaleY = lerp(this.scaleY, 1, 0.15);
            
            // Animate Eye
            this.currentEyeX = lerp(this.currentEyeX, this.targetEyeX, 0.2);
            this.currentEyeY = lerp(this.currentEyeY, this.targetEyeY, 0.2);

            // Screen bounds / Death
            if (this.y > GAME_HEIGHT + 100) {
                triggerGameOver();
            }
            if (this.x < 0) this.x = 0;
            if (this.x + this.w > GAME_WIDTH) this.x = GAME_WIDTH - this.w;

            // Portal Collision
            if (portal && portal.active) {
                if (this.x < portal.x + portal.w && this.x + this.w > portal.x &&
                    this.y < portal.y + portal.h && this.y + this.h > portal.y) {
                    nextLevel();
                }
            }
        }

        checkCollisions(isX) {
            for (let p of platforms) {
                if (this.x < p.x + p.w && this.x + this.w > p.x &&
                    this.y < p.y + p.h && this.y + this.h > p.y) {
                    
                    if (isX) {
                        if (this.vx > 0) { // Moving right
                            this.x = p.x - this.w;
                        } else { // Moving left
                            this.x = p.x + p.w;
                        }
                        this.vx = 0;
                    } else {
                        if (this.vy > 0) { // Falling
                            this.y = p.y - this.h;
                            this.onGround = true;
                        } else { // Jumping up into platform
                            this.y = p.y + p.h;
                        }
                        this.vy = 0;
                    }
                }
            }
        }

        draw(ctx) {
            if (this.dead) return;

            ctx.save();
            // Transform around bottom center for correct squash/stretch point
            let cx = this.x + this.w/2;
            let cy = this.y + this.h;
            
            ctx.translate(cx, cy);
            ctx.scale(this.scaleX, this.scaleY);
            ctx.translate(-cx, -cy);

            // Body (Black Rounded Square)
            ctx.fillStyle = '#0a0a0a';
            ctx.roundRect(this.x, this.y, this.w, this.h, 16).fill();

            // Sclera (White Eye)
            let eyeRadius = this.w * 0.32;
            let eyeCenterY = this.y + this.h * 0.45;
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, eyeCenterY, eyeRadius, 0, Math.PI*2);
            ctx.fill();

            // Pupil (Black) tracking
            let maxOffset = eyeRadius * 0.4;
            let pupilX = cx + this.currentEyeX * maxOffset;
            let pupilY = eyeCenterY + this.currentEyeY * maxOffset;
            let pupilRadius = eyeRadius * 0.55;
            
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.arc(pupilX, pupilY, pupilRadius, 0, Math.PI*2);
            ctx.fill();

            // Highlight (White dot)
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(pupilX + pupilRadius*0.3, pupilY - pupilRadius*0.3, pupilRadius*0.25, 0, Math.PI*2);
            ctx.fill();

            ctx.restore();
        }
    }

    class Platform {
        constructor(x, y, w, h) {
            this.x = x;
            this.y = y;
            this.w = w;
            this.h = h;
        }
        draw(ctx) {
            // Dirt base
            ctx.fillStyle = '#8B5A2B';
            ctx.fillRect(this.x, this.y + 15, this.w, this.h - 15);
            
            // Grass top
            ctx.fillStyle = '#6BE879';
            ctx.roundRect(this.x, this.y, this.w, 20, 5).fill();
            
            // Darker grass trim at bottom of grass
            ctx.fillStyle = '#4CA857';
            ctx.fillRect(this.x, this.y + 15, this.w, 5);
        }
    }

    class Boss {
        constructor(x, y) {
            this.w = 120;
            this.h = 120;
            this.x = x;
            this.y = y;
            this.vx = 3;
            this.hp = 3;
            this.maxHp = 3;
            this.scaleX = 1;
            this.scaleY = 1;
            this.invulnTimer = 0;
            this.dead = false;
            this.color = '#ff3333';
        }

        update() {
            if (this.dead) return;

            if (this.invulnTimer > 0) this.invulnTimer--;

            // Hover movement
            this.x += this.vx;
            if (this.x < 100) { this.x = 100; this.vx *= -1; }
            if (this.x + this.w > GAME_WIDTH - 100) { this.x = GAME_WIDTH - 100 - this.w; this.vx *= -1; }

            // Float up and down slightly
            this.y += Math.sin(frameCount * 0.05) * 0.5;

            // Animations
            this.scaleX = lerp(this.scaleX, 1, 0.1);
            this.scaleY = lerp(this.scaleY, 1, 0.1);

            // Collision with player
            if (!player.dead && this.invulnTimer === 0) {
                if (player.x < this.x + this.w && player.x + player.w > this.x &&
                    player.y < this.y + this.h && player.y + player.h > this.y) {
                    
                    // Did player hit from top?
                    if (player.vy > 0 && player.y + player.h < this.y + 30) {
                        this.takeDamage();
                        player.vy = -16; // Bounce player
                        player.scaleX = 0.5;
                        player.scaleY = 1.5;
                        spawnDust(player.x + player.w/2, this.y, 20);
                    } else {
                        // Player hit from side/bottom
                        triggerGameOver();
                    }
                }
            }
        }

        takeDamage() {
            this.hp--;
            this.invulnTimer = 40;
            this.scaleX = 1.5;
            this.scaleY = 0.5;
            SoundEngine.bossHit();
            
            // Spawn explosion particles
            for(let i=0; i<30; i++) {
                let p = new Particle(this.x + this.w/2, this.y + this.h/2, '#ff0000');
                p.vx *= 2; p.vy *= 2; p.size *= 1.5;
                particles.push(p);
            }

            if (this.hp <= 0) {
                this.dead = true;
                // Drop portal
                portal = {
                    x: GAME_WIDTH/2 - 25,
                    y: GAME_HEIGHT - 120,
                    w: 50, h: 80,
                    active: true
                };
            }
        }

        draw(ctx) {
            if (this.dead) return;

            // Flash white if invulnerable
            let isFlashing = this.invulnTimer > 0 && Math.floor(frameCount / 4) % 2 === 0;

            ctx.save();
            let cx = this.x + this.w/2;
            let cy = this.y + this.h;
            ctx.translate(cx, cy);
            ctx.scale(this.scaleX, this.scaleY);
            ctx.translate(-cx, -cy);

            // Boss Body
            ctx.fillStyle = isFlashing ? '#ffffff' : this.color;
            ctx.roundRect(this.x, this.y, this.w, this.h, 25).fill();

            // Boss Eyes (Angry)
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(cx - 25, this.y + 45, 15, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 25, this.y + 45, 15, 0, Math.PI*2); ctx.fill();

            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(cx - 25 + (this.vx > 0 ? 5 : -5), this.y + 45, 6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 25 + (this.vx > 0 ? 5 : -5), this.y + 45, 6, 0, Math.PI*2); ctx.fill();

            // Angry eyebrows
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#000';
            ctx.beginPath(); ctx.moveTo(cx - 45, this.y + 25); ctx.lineTo(cx - 10, this.y + 35); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(cx + 45, this.y + 25); ctx.lineTo(cx + 10, this.y + 35); ctx.stroke();
            
            // Health bar
            ctx.fillStyle = '#000';
            ctx.fillRect(this.x, this.y - 20, this.w, 10);
            ctx.fillStyle = '#22ee22';
            ctx.fillRect(this.x, this.y - 20, this.w * (this.hp / this.maxHp), 10);

            ctx.restore();
        }
    }

    /** --- LEVEL DATA --- */
    const levels = [
        // Level 1: Intro
        () => {
            player = new Player(100, 400);
            platforms = [
                new Platform(-50, 500, 900, 200), // Floor
                new Platform(350, 420, 150, 20),
                new Platform(550, 340, 150, 20),
            ];
            portal = { x: 600, y: 260, w: 50, h: 80, active: true };
            boss = null;
        },
        // Level 2: Gaps
        () => {
            player = new Player(50, 400);
            platforms = [
                new Platform(0, 500, 200, 200),
                new Platform(300, 450, 150, 20),
                new Platform(550, 500, 300, 200),
                new Platform(600, 350, 100, 20),
            ];
            portal = { x: 625, y: 270, w: 50, h: 80, active: true };
            boss = null;
        },
        // Level 3: Vertical Climb
        () => {
            player = new Player(50, 500);
            platforms = [
                new Platform(0, 560, GAME_WIDTH, 50),
                new Platform(150, 450, 100, 20),
                new Platform(350, 360, 100, 20),
                new Platform(150, 270, 100, 20),
                new Platform(350, 180, 100, 20),
                new Platform(550, 100, 200, 20)
            ];
            portal = { x: 625, y: 20, w: 50, h: 80, active: true };
            boss = null;
        },
        // Level 4: Precision
        () => {
            player = new Player(50, 350);
            platforms = [
                new Platform(0, 450, 150, 200),
                new Platform(250, 350, 80, 20),
                new Platform(450, 250, 80, 20),
                new Platform(650, 450, 150, 200)
            ];
            portal = { x: 700, y: 370, w: 50, h: 80, active: true };
            boss = null;
        },
        // Level 5: The Islands
        () => {
            player = new Player(50, 400);
            platforms = [
                new Platform(0, 500, 100, 100),
                new Platform(200, 400, 100, 20),
                new Platform(400, 500, 100, 20),
                new Platform(600, 400, 200, 200)
            ];
            portal = { x: 700, y: 320, w: 50, h: 80, active: true };
            boss = null;
        },
        // Level 6: Zig-Zag Climb
        () => {
            player = new Player(100, 500);
            platforms = [
                new Platform(50, 560, 150, 40),
                new Platform(600, 480, 100, 20),
                new Platform(100, 400, 100, 20),
                new Platform(600, 320, 100, 20),
                new Platform(100, 240, 100, 20),
                new Platform(400, 160, 400, 20)
            ];
            portal = { x: 700, y: 80, w: 50, h: 80, active: true };
            boss = null;
        },
        // Level 7: Long Leap
        () => {
            player = new Player(50, 300);
            platforms = [
                new Platform(0, 400, 100, 200),
                new Platform(350, 300, 40, 300),
                new Platform(700, 400, 100, 200)
            ];
            portal = { x: 725, y: 320, w: 50, h: 80, active: true };
            boss = null;
        },
        // Level 8: Boss Arena
        () => {
            player = new Player(50, 400);
            platforms = [
                new Platform(0, 500, GAME_WIDTH, 200),
                new Platform(0, 350, 150, 20),
                new Platform(GAME_WIDTH-150, 350, 150, 20)
            ];
            portal = { active: false }; // Drops when boss dies
            boss = new Boss(GAME_WIDTH/2 - 60, 200);
        }
    ];

    /** --- GAME FLOW --- */
    function initBackground() {
        clouds = [];
        for(let i=0; i<6; i++) {
            clouds.push({
                x: Math.random() * GAME_WIDTH,
                y: Math.random() * 200 + 20,
                s: Math.random() * 0.5 + 0.5,
                speed: Math.random() * 0.5 + 0.1
            });
        }
    }

    function startGame() {
        SoundEngine.init();
        uiMenu.classList.add('hidden');
        currentLevel = 0;
        initBackground();
        loadLevel(currentLevel);
    }

    function loadLevel(idx) {
        particles = [];
        keys = { left: false, right: false, up: false };
        levels[idx]();
        gameState = 'TRANSITION';
        
        levelText.innerText = idx === levels.length - 1 ? "Boss Stage" : `Level ${idx + 1}`;
        uiLevelTitle.classList.remove('hidden');
        
        setTimeout(() => {
            uiLevelTitle.classList.add('hidden');
            gameState = 'PLAYING';
        }, 1500);
    }

    function nextLevel() {
        currentLevel++;
        if (currentLevel >= levels.length) {
            triggerWin();
        } else {
            SoundEngine.levelFinish();
            loadLevel(currentLevel);
        }
    }

    function triggerGameOver() {
        if (gameState === 'GAMEOVER') return;
        gameState = 'GAMEOVER';
        player.dead = true;
        // Explosion particles
        for(let i=0; i<30; i++) particles.push(new Particle(player.x+player.w/2, player.y+player.h/2, '#000'));
        uiGameOver.classList.remove('hidden');
    }

    function resetLevel() {
        uiGameOver.classList.add('hidden');
        loadLevel(currentLevel);
    }

    function triggerWin() {
        gameState = 'WIN';
        SoundEngine.gameWin();
        uiWin.classList.remove('hidden');
    }

    function showMenu() {
        uiWin.classList.add('hidden');
        uiGameOver.classList.add('hidden');
        gameState = 'MENU';
        uiMenu.classList.remove('hidden');
    }

    /** --- DRAWING --- */
    function drawBackground() {
        // Sky
        ctx.fillStyle = '#78C2FC';
        ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

        // Clouds
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        clouds.forEach(c => {
            c.x -= c.speed;
            if (c.x < -150) c.x = GAME_WIDTH + 50;
            
            ctx.beginPath();
            ctx.arc(c.x, c.y, 30*c.s, 0, Math.PI*2);
            ctx.arc(c.x + 25*c.s, c.y - 15*c.s, 35*c.s, 0, Math.PI*2);
            ctx.arc(c.x + 50*c.s, c.y, 25*c.s, 0, Math.PI*2);
            ctx.fill();
        });
    }

    function drawPortal() {
        if (!portal || !portal.active) return;
        
        let cx = portal.x + portal.w/2;
        let cy = portal.y + portal.h/2;
        
        // Swirl effect
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(frameCount * 0.05);
        
        let gradient = ctx.createRadialGradient(0, 0, 5, 0, 0, portal.w);
        gradient.addColorStop(0, '#fff');
        gradient.addColorStop(0.5, '#ffff00');
        gradient.addColorStop(1, 'rgba(255, 100, 0, 0)');
        
        ctx.fillStyle = gradient;
        ctx.beginPath();
        ctx.ellipse(0, 0, portal.w/2, portal.h/2, 0, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();

        // Portal particles
        if (frameCount % 5 === 0) {
            let p = new Particle(cx + (Math.random()-0.5)*30, cy + (Math.random()-0.5)*50, '#ffaa00');
            p.vy = -Math.random() * 2 - 1;
            p.gravity = 0;
            particles.push(p);
        }
    }

    /** --- MAIN LOOP --- */
    function loop() {
        frameCount++;
        
        // Clear screen
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Draw static/parallax background
        drawBackground();

        if (gameState === 'PLAYING' || gameState === 'TRANSITION' || gameState === 'GAMEOVER') {
            
            if (gameState === 'PLAYING') {
                player.update();
                if (boss) boss.update();
            }

            // Draw Platforms
            platforms.forEach(p => p.draw(ctx));

            // Draw Portal
            drawPortal();

            // Draw Boss
            if (boss) boss.draw(ctx);

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Draw Player
            player.draw(ctx);
        }

        requestAnimationFrame(loop);
    }

    // Handle Resize
    function resizeCanvas() {
        // Keep aspect ratio via CSS, but handle internal resolution mapping if needed
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Start loop
    initBackground();
    loop();

</script>
</body>
</html>
