<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English.zip Translator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    min-height: 100vh;
    padding: 25px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 25px;
}

.box {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
}

h2 {
    margin-top: 0;
}

textarea {
    width: 100%;
    min-height: 150px;
    resize: vertical;
    background: #101010;
    color: white;
    border: 1px solid #444;
    border-radius: 10px;
    padding: 15px;
    font-size: 17px;
    outline: none;
}

textarea:focus {
    border-color: #777;
}

.output {
    white-space: pre-wrap;
    min-height: 100px;
    background: #101010;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 15px;
    font-size: 18px;
    line-height: 1.5;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 15px;
}

button {
    border: none;
    border-radius: 9px;
    padding: 11px 16px;
    background: #333;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    background: #444;
}

.main-button {
    background: white;
    color: #111;
    font-weight: bold;
}

.main-button:hover {
    background: #ddd;
}

.switch {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
}

.switch input {
    width: 17px;
    height: 17px;
}

.stats {
    color: #888;
    margin-top: 10px;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

<h1>English.zip</h1>

<div class="subtitle">
Compress and decompress internet English 💀
</div>


<!-- =====================================================
     ENGLISH → ENGLISH.ZIP
===================================================== -->

<div class="box">

<h2>📦 English → English.zip</h2>

<textarea
id="compressInput"
placeholder="Type normal English here..."
></textarea>

<div class="controls">

<button class="main-button" onclick="compressText()">
Compress English
</button>

<button onclick="clearCompressor()">
Clear
</button>

</div>

<div class="switch">
<input type="checkbox" id="chaos">
<label for="chaos">Maximum internet chaos 💀</label>
</div>

<br>

<div class="output" id="compressOutput">
Your compressed English will appear here...
</div>

<div class="stats" id="compressStats"></div>

<div class="controls">
<button onclick="copyText('compressOutput')">
Copy
</button>
</div>

</div>


<!-- =====================================================
     ENGLISH.ZIP → ENGLISH
===================================================== -->

<div class="box">

<h2>📂 English.zip → English</h2>

<textarea
id="uncompressInput"
placeholder="Type internet English here...

Example:
ngl ts peak fr, gj bro 😭💀"
></textarea>

<div class="controls">

<button class="main-button" onclick="uncompressText()">
Uncompress English
</button>

<button onclick="clearUncompressor()">
Clear
</button>

</div>

<br>

<div class="output" id="uncompressOutput">
Your normal English will appear here...
</div>

<div class="stats" id="uncompressStats"></div>

<div class="controls">
<button onclick="copyText('uncompressOutput')">
Copy
</button>
</div>

</div>

</div>

/* =========================================================
   COMPRESSOR
========================================================= */

function compressText() {

    const input =
        document.getElementById("compressInput").value;

    if (!input.trim()) {

        document.getElementById("compressOutput").textContent =
            "Type something first ;-;";

        document.getElementById("compressStats").textContent = "";

        return;
    }

    let result = input;

    for (const [pattern, replacement]
        of compressReplacements) {

        result =
            result.replace(pattern, replacement);
    }

    /* Number compression */

    result =
        result.replace(/\bto\b/gi, "2");

    result =
        result.replace(/\btoo\b/gi, "2");

    result =
        result.replace(/\bfor\b/gi, "4");

    result = result.toLowerCase();

    /* Maximum chaos */

    if (
        document.getElementById("chaos").checked
    ) {

        result =
            result.replace(/\breally\b/g, "rly");

        result =
            result.replace(/\bvery\b/g, "rly");

        result =
            result.replace(/\bgreat\b/g, "gr8");

        result =
            result.replace(/\bthanks\b/g, "thx");

        result =
            result.replace(/\bsomething\b/g, "smth");

        result =
            result.replace(/\btonight\b/g, "2nite");

        result =
            result.replace(/\btomorrow\b/g, "2moro");

        result =
            result.replace(/\./g, "");

        const endings = [

            " fr",
            " ngl",
            " tbh",
            " ong",
            " frfr",
            " 😭",
            " 💀",
            " 😭💀",
            " 🥹",
            " 👍"

        ];

        if (Math.random() < 0.6) {

            result +=
                endings[
                    Math.floor(
                        Math.random() *
                        endings.length
                    )
                ];
        }
    }

    document.getElementById("compressOutput")
        .textContent = result;

    updateStats(
        input,
        result,
        "compressStats"
    );
}


/* =========================================================
   UNCOMPRESSOR
========================================================= */

function uncompressText() {

    const input =
        document.getElementById("uncompressInput").value;

    if (!input.trim()) {

        document.getElementById("uncompressOutput")
            .textContent =
            "Type some English.zip first ;-;";

        document.getElementById("uncompressStats")
            .textContent = "";

        return;
    }

    let result = input;

    for (const [pattern, replacement]
        of uncompressReplacements) {

        result =
            result.replace(pattern, replacement);
    }

    /* Capitalize sentence beginnings */

    result =
        result.replace(
            /(^\s*[a-z])|([.!?]\s*[a-z])/g,
            match => match.toUpperCase()
        );

    document.getElementById("uncompressOutput")
        .textContent = result;

    updateStats(
        input,
        result,
        "uncompressStats"
    );
}


/* =========================================================
   STATS
========================================================= */

function updateStats(
    input,
    output,
    element
) {

    const saved =
        input.length - output.length;

    let percentage = 0;

    if (input.length > 0) {

        percentage =
            Math.round(
                (saved / input.length) * 100
            );
    }

    document.getElementById(element)
        .textContent =
        `${input.length} characters → ` +
        `${output.length} characters | ` +
        `${saved >= 0
            ? saved + " characters saved"
            : Math.abs(saved) +
              " characters added"} ` +
        `(${percentage}% compression)`;
}


/* =========================================================
   COPY
========================================================= */

function copyText(elementId) {

    const text =
        document.getElementById(elementId)
            .textContent;

    if (
        !text ||
        text.includes("will appear here")
    ) {
        return;
    }

    navigator.clipboard.writeText(text);

    const button = event.target;

    const oldText =
        button.textContent;

    button.textContent =
        "Copied 👍";

    setTimeout(() => {

        button.textContent =
            oldText;

    }, 1200);
}


/* =========================================================
   CLEAR BUTTONS
========================================================= */

function clearCompressor() {

    document.getElementById("compressInput")
        .value = "";

    document.getElementById("compressOutput")
        .textContent =
        "Your compressed English will appear here...";

    document.getElementById("compressStats")
        .textContent = "";
}


function clearUncompressor() {

    document.getElementById("uncompressInput")
        .value = "";

    document.getElementById("uncompressOutput")
        .textContent =
        "Your normal English will appear here...";

    document.getElementById("uncompressStats")
        .textContent = "";
}


/* =========================================================

========================================================= */

    .addEventListener(

        compressText
    );
