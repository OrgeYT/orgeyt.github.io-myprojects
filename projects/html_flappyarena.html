<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird 8-Player VS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #4dc0ca;
            font-family: 'Arial', sans-serif;
            touch-action: none;
        }
        canvas {
            display: block;
            image-rendering: pixelated;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
            z-index: 50;
            background: rgba(0,0,0,0.15);
        }
        .menu-card {
            background: #ded895;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 0 0 6px #543847, 0 20px 0 rgba(0,0,0,0.2);
            text-align: center;
            pointer-events: auto;
            width: 680px;
            max-width: 95%;
            border: 4px solid #fff;
        }
        .btn {
            background: #f7941d;
            color: white;
            padding: 0.8rem;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s;
            border-bottom: 4px solid #b36306;
            text-shadow: 1px 1px 0 #b36306;
        }
        .btn:active {
            transform: translateY(2px);
            border-bottom-width: 2px;
        }
        .slot-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.05);
            padding: 15px;
            border-radius: 12px;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 10px;
            border: 2px solid #543847;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .keybind-btn {
            background: #543847;
            color: #fff;
            font-family: 'monospace';
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.7rem;
            min-width: 55px;
            text-align: center;
            border-bottom: 2px solid #2e1e27;
        }
        .keybind-btn.listening {
            background: #ff4444;
            animation: pulse 0.6s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .preview-canvas {
            background: rgba(255,255,255,0.3);
            border-radius: 6px;
            width: 44px;
            height: 34px;
            cursor: pointer;
            border: 2px solid #543847;
        }
        #hud {
            position: absolute;
            top: 15px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 20px;
            pointer-events: none;
            z-index: 20;
        }
        .score-card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #543847;
            border-radius: 8px;
            padding: 6px;
            box-shadow: 0 4px 0 rgba(0,0,0,0.2);
            transition: opacity 0.3s;
        }
        .powerup-bar-container {
            height: 6px;
            background: rgba(0,0,0,0.1);
            border-radius: 3px;
            margin-top: 4px;
            overflow: hidden;
            display: none;
        }
        #powerup-notif {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: #543847;
            color: #fff;
            padding: 12px 30px;
            border-radius: 40px;
            border: 4px solid #fff;
            font-weight: 900;
            font-size: 1.2rem;
            opacity: 0;
            z-index: 30;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
        }
        .title-text {
            font-weight: 900;
            font-style: italic;
            font-size: 3rem;
            color: #fff;
            -webkit-text-stroke: 2px #543847;
            text-shadow: 4px 4px 0 #543847;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div id="hud" class="hidden"></div>
    <div id="powerup-notif"></div>

    <div id="ui-overlay">
        <div id="main-menu" class="menu-card">
            <h1 class="title-text">FLAPPY ARENA</h1>
            
            <div id="lobby" class="slot-grid"></div>

            <div class="grid grid-cols-4 gap-3 mb-4">
                <button class="btn text-[10px] bg-slate-500 border-slate-700" onclick="setAllSlots(0)">CLEAR</button>
                <button class="btn text-[10px] bg-blue-500 border-blue-700" onclick="setAllSlots(1)">PLAYERS</button>
                <button class="btn text-[10px] bg-red-500 border-red-700" onclick="setAllSlots(2)">CPUS</button>
                <button class="btn text-[10px] bg-purple-500 border-purple-700" onclick="randomizeLobby()">MIX</button>
            </div>

            <div class="flex justify-between items-center bg-black/10 px-4 py-2 rounded-xl mb-4">
                <span class="font-bold text-[#543847] text-sm italic">ITEM BOXES:</span>
                <button id="powerup-toggle" class="btn py-1 px-10 bg-green-500 border-green-700 text-xs" onclick="togglePowerups()">ENABLED</button>
            </div>

            <button class="btn w-full text-xl py-3 uppercase font-black tracking-widest bg-yellow-400 border-yellow-600 text-white" onclick="startParty()">Start Battle!</button>
        </div>

        <div id="game-over" class="menu-card hidden">
            <h2 id="winner-text" class="text-4xl font-black mb-4 text-white italic" style="-webkit-text-stroke: 2px #543847; text-shadow: 4px 4px 0 #543847;">P1 WINS!</h2>
            <div id="final-stats" class="mb-6 grid grid-cols-4 gap-3"></div>
            <div class="flex gap-4">
                <button class="btn flex-1 py-3 bg-gray-500 border-gray-700" onclick="resetToMenu()">MENU</button>
                <button class="btn flex-1 py-3 bg-green-500 border-green-700" onclick="startParty()">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const lobby = document.getElementById('lobby');
        const hud = document.getElementById('hud');
        const mainMenu = document.getElementById('main-menu');
        const gameOverMenu = document.getElementById('game-over');
        
        const sfxPoint = new Audio('https://file.garden/Zj01o_oh-G9Y8APf/sfx_point.wav');
        const sfxHit = new Audio('https://file.garden/Zj01o_oh-G9Y8APf/sfx_hit.wav');
        const sfxFlap = new Audio('https://file.garden/Zj01o_oh-G9Y8APf/flap.mp3');
        const musicBg = new Audio('https://file.garden/Zj01o_oh-G9Y8APf/mondamusic-retro-arcade-game-music-491667.mp3');
        musicBg.loop = true;
        musicBg.volume = 0.3;

        const GRAVITY = 0.25;
        const FLAP_STRENGTH = -4.8;
        const PIPE_SPEED_BASE = 3.8;
        const PIPE_SPAWN_RATE = 95;
        const PIPE_GAP = 190;
        const BIRD_SIZE = 34;

        const BIRD_COLORS = ['#ff5252', '#ffab40', '#ffeb3b', '#69f0ae', '#40c4ff', '#7c4dff', '#e040fb', '#ff4081'];
        
        let slotConfigs = [1, 2, 2, 0, 0, 0, 0, 0]; 
        let playerBinds = ['Space', 'ArrowUp', 'KeyW', 'KeyN', 'KeyE', 'KeyI', 'KeyZ', 'KeyM'];
        let listeningSlot = -1;
        let lastFlapSoundTime = 0;
        const FLAP_SOUND_COOLDOWN = 120;

        let frameCount = 0;
        let gameState = 'MENU';
        let usePowerups = true;
        let pipes = [], birds = [], powerups = [], freezeTimer = 0, freezeInitial = 0;
        let distanceTraveled = 0;
        let lastPipeX = 0;
        let camera = { x: 0, y: 0, targetX: 0, targetY: 0 };

        // Background assets
        let clouds = [];
        let buildings = [];

        function initBackground() {
            clouds = [];
            for (let i = 0; i < 15; i++) {
                clouds.push({
                    x: Math.random() * canvas.width * 2,
                    y: Math.random() * (canvas.height * 0.4),
                    speed: 0.2 + Math.random() * 0.5,
                    scale: 0.5 + Math.random() * 1.2,
                    opacity: 0.3 + Math.random() * 0.4
                });
            }
            buildings = [];
            const buildingWidth = 80;
            for (let i = 0; i < (canvas.width / buildingWidth) + 5; i++) {
                buildings.push({
                    x: i * buildingWidth,
                    height: 100 + Math.random() * 150,
                    width: buildingWidth,
                    color: `hsl(190, 30%, ${20 + Math.random() * 15}%)`
                });
            }
        }

        function drawBackground() {
            // Sky Gradient
            const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            skyGrad.addColorStop(0, '#4dc0ca');
            skyGrad.addColorStop(1, '#82d8e0');
            ctx.fillStyle = skyGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Sun/Glow
            ctx.fillStyle = 'rgba(255, 255, 200, 0.1)';
            ctx.beginPath();
            ctx.arc(canvas.width * 0.8, canvas.height * 0.2, 150, 0, Math.PI * 2);
            ctx.fill();

            // Distant Buildings (Parallax)
            const bXOffset = (camera.x * 0.2) % 80;
            buildings.forEach((b, i) => {
                const x = (i * b.width) - bXOffset;
                ctx.fillStyle = b.color;
                ctx.fillRect(x, canvas.height - 75 - b.height - camera.y * 0.1, b.width + 1, b.height);
                // Windows
                ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
                for(let row = 0; row < b.height/20; row++) {
                    ctx.fillRect(x + 10, canvas.height - 75 - b.height + 10 + (row * 20) - camera.y * 0.1, 15, 10);
                    ctx.fillRect(x + b.width - 25, canvas.height - 75 - b.height + 10 + (row * 20) - camera.y * 0.1, 15, 10);
                }
            });

            // Clouds (Parallax)
            clouds.forEach(c => {
                const cx = (c.x - (camera.x * c.speed)) % (canvas.width * 1.5);
                const drawX = cx < 0 ? cx + canvas.width * 1.5 : cx;
                ctx.save();
                ctx.translate(drawX, c.y - camera.y * 0.05);
                ctx.scale(c.scale, c.scale);
                ctx.fillStyle = `rgba(255, 255, 255, ${c.opacity})`;
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI * 2);
                ctx.arc(15, -10, 25, 0, Math.PI * 2);
                ctx.arc(40, 0, 20, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        function drawBirdSprite(pctx, x, y, w, h, color, rotation = 0, opacity = 1) {
            pctx.save();
            pctx.globalAlpha = opacity;
            pctx.translate(x + w/2, y + h/2);
            pctx.rotate(rotation);
            
            pctx.fillStyle = color;
            pctx.strokeStyle = '#222';
            pctx.lineWidth = 2.5;
            pctx.beginPath();
            pctx.roundRect(-w/2, -h/2, w, h, 6);
            pctx.fill(); pctx.stroke();
            
            pctx.fillStyle = 'rgba(255,255,255,0.4)';
            pctx.fillRect(-w/2 + 4, -h/2 + 4, w-8, 4);

            pctx.fillStyle = 'white';
            pctx.beginPath(); pctx.arc(w*0.25, -h*0.2, w*0.2, 0, Math.PI*2); pctx.fill(); pctx.stroke();
            pctx.fillStyle = 'black';
            pctx.beginPath(); pctx.arc(w*0.3, -h*0.2, w*0.08, 0, Math.PI*2); pctx.fill();

            pctx.fillStyle = '#f7941d';
            pctx.beginPath();
            pctx.roundRect(w/2 - 2, -2, 8, 8, 2);
            pctx.fill(); pctx.stroke();

            pctx.restore();
        }

        function initLobby() {
            lobby.innerHTML = '';
            slotConfigs.forEach((config, i) => {
                const row = document.createElement('div');
                row.className = 'player-row';
                row.style.borderLeft = `8px solid ${BIRD_COLORS[i]}`;
                
                const bindLabel = listeningSlot === i ? '???' : formatBind(playerBinds[i]);
                
                row.innerHTML = `
                    <div class="flex items-center gap-3">
                        <canvas id="preview-${i}" class="preview-canvas" width="44" height="34"></canvas>
                        <div class="flex flex-col">
                            <span class="font-black text-xs text-[#543847] uppercase leading-none mb-1">P${i+1}</span>
                            <div class="keybind-btn ${listeningSlot === i ? 'listening' : ''}" onclick="startListening(${i})">${bindLabel}</div>
                        </div>
                    </div>
                    <button class="btn slot-btn ${config===0?'bg-gray-400 border-gray-600':(config===1?'bg-blue-500 border-blue-700':'bg-orange-500 border-orange-700')}" 
                        style="width: 90px; font-size: 0.75rem; padding: 6px;"
                        onclick="toggleSlot(${i})">${config===0?'OFF':(config===1?'PLAYER':'CPU')}</button>
                `;
                lobby.appendChild(row);
                updatePreview(i);
            });
        }

        function formatBind(key) {
            return key.replace('Key', '').replace('Arrow', '').replace('Space', 'SPC').toUpperCase();
        }

        function startListening(i) {
            listeningSlot = i;
            initLobby();
        }

        function updatePreview(i) {
            const pCanvas = document.getElementById(`preview-${i}`);
            if (!pCanvas) return;
            const pctx = pCanvas.getContext('2d');
            pctx.clearRect(0, 0, pCanvas.width, pCanvas.height);
            const color = slotConfigs[i] === 0 ? '#9ca3af' : BIRD_COLORS[i];
            drawBirdSprite(pctx, 5, 8, 30, 20, color, 0, slotConfigs[i] === 0 ? 0.4 : 1);
            if (gameState === 'MENU') requestAnimationFrame(() => updatePreview(i));
        }

        function toggleSlot(i) {
            slotConfigs[i] = (slotConfigs[i] + 1) % 3;
            initLobby();
        }

        function setAllSlots(type) {
            slotConfigs = slotConfigs.map(() => type);
            initLobby();
        }

        function randomizeLobby() {
            slotConfigs = slotConfigs.map(() => Math.floor(Math.random() * 3));
            initLobby();
        }

        const POWERUP_TYPES = [
            { name: 'Distract', color: '#a855f7', duration: 250 }, 
            { name: 'Invert', color: '#ef4444', duration: 250 },
            { name: 'Dash', color: '#3b82f6', duration: 0 }, 
            { name: 'Rewind', color: '#10b981', duration: 0 }, 
            { name: 'God Mode', color: '#eab308', duration: 300 },
            { name: 'Shrink', color: '#ec4899', duration: 350 },
            { name: 'Freeze', color: '#67e8f9', duration: 180 },
            { name: 'Shield', color: '#6366f1', duration: 0 }
        ];

        class Bird {
            constructor(id, color, type) {
                this.id = id;
                this.baseX = 150; 
                this.x = this.baseX;
                this.y = canvas.height / 2;
                this.velocity = 0;
                this.width = BIRD_SIZE;
                this.height = 22;
                this.color = color;
                this.type = type;
                this.alive = true;
                this.score = 0;
                this.rotation = 0;
                this.distance = 0;
                this.gravityMultiplier = 1;
                this.timers = { god: 0, distract: 0, shrink: 0, invert: 0 };
                this.initialTimers = { god: 0, distract: 0, shrink: 0, invert: 0 };
                this.shieldActive = false;
                this.dashX = 0;

                this.driftOffset = id * (Math.PI / 4); 
                this.driftSpeed = 0.015; 
                this.driftRange = 60; 
                this.currentDrift = 0;

                this.cpuReaction = 2 + Math.floor(Math.random() * 8); 
                this.cpuBuffer = Math.random() * 15 - 7.5; 
                this.cpuErrorChance = 0.001; 
            }

            flap() {
                if (!this.alive) return;
                this.velocity = FLAP_STRENGTH * this.gravityMultiplier;
                
                const now = Date.now();
                if (now - lastFlapSoundTime > FLAP_SOUND_COOLDOWN) {
                    const clone = sfxFlap.cloneNode();
                    clone.volume = 0.25;
                    clone.play().catch(()=>{});
                    lastFlapSoundTime = now;
                }
            }

            update() {
                for (let t in this.timers) {
                    if (this.timers[t] > 0) this.timers[t]--;
                    else {
                        this.timers[t] = 0;
                        this.initialTimers[t] = 0;
                        if (t === 'invert') this.gravityMultiplier = 1;
                    }
                }
                
                this.width = this.timers.shrink > 0 ? BIRD_SIZE * 0.6 : BIRD_SIZE;
                this.height = this.timers.shrink > 0 ? 14 : 22;

                if (!this.alive) { 
                    this.rotation += 0.15; 
                    this.y += 8; 
                    return; 
                }

                this.currentDrift = Math.sin(frameCount * this.driftSpeed + this.driftOffset) * this.driftRange;

                if (this.type === 2 && frameCount % this.cpuReaction === 0) {
                    this.think();
                }

                this.velocity += GRAVITY * this.gravityMultiplier;
                this.y += this.velocity;
                this.rotation = Math.min(Math.PI/4, Math.max(-Math.PI/3, (this.velocity/10) * this.gravityMultiplier));
                
                this.dashX *= 0.96;
                this.x = this.baseX + this.currentDrift + this.dashX + distanceTraveled;
                this.distance = distanceTraveled + this.currentDrift;

                if (this.y + this.height > canvas.height - 75 || this.y < 0) {
                    if (this.timers.god <= 0) this.die();
                    else this.y = Math.max(0, Math.min(this.y, canvas.height - 75 - this.height));
                }
            }

            think() {
                const nextPipe = pipes.find(p => p.x + p.width > this.x - 20);
                let targetY = nextPipe ? nextPipe.top + (PIPE_GAP / 2) : canvas.height / 2;
                
                let jitter = (this.timers.distract > 0 ? Math.sin(frameCount * 0.2) * 80 : 0) + this.cpuBuffer;
                let actualTarget = targetY + jitter - (this.height/2);

                if (Math.random() < this.cpuErrorChance) return;

                if (this.gravityMultiplier === 1) {
                    if (this.y > actualTarget + 10) this.flap();
                } else {
                    if (this.y < actualTarget - 10) this.flap();
                }
            }

            die() {
                if (this.alive) {
                    if (this.shieldActive) { this.shieldActive = false; this.dashX -= 60; return; }
                    this.alive = false; 
                    sfxHit.play().catch(()=>{}); 
                    checkGameOver();
                }
            }

            draw() {
                const drawX = this.x - camera.x;
                const drawY = this.y - camera.y;
                drawBirdSprite(ctx, drawX, drawY, this.width, this.height, this.color, this.rotation, 1);
                if (this.shieldActive && this.alive) {
                    ctx.beginPath(); ctx.arc(drawX + this.width/2, drawY + this.height/2, this.width * 0.8, 0, Math.PI*2);
                    ctx.strokeStyle = '#6366f1'; ctx.lineWidth = 3; ctx.stroke();
                }
                if (this.timers.god > 0) {
                    ctx.strokeStyle = 'gold'; ctx.lineWidth = 4;
                    ctx.strokeRect(drawX-2, drawY-2, this.width+4, this.height+4);
                }
            }
        }

        class Pipe {
            constructor(x) {
                this.width = 85;
                this.x = x;
                this.top = Math.random() * (canvas.height - PIPE_GAP - 350) + 120;
                this.bottom = canvas.height - (this.top + PIPE_GAP) - 75;
                this.scoredBy = new Set();
                
                if (usePowerups && Math.random() < 0.7) {
                    powerups.push({ 
                        x: this.x + 42, y: this.top + PIPE_GAP/2, active: true, 
                        type: POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)]
                    });
                }
            }
            draw() {
                const drawX = this.x - camera.x;
                const topH = this.top;
                const botY = canvas.height - 75 - this.bottom;

                ctx.strokeStyle = '#222';
                ctx.lineWidth = 4;

                const grad = ctx.createLinearGradient(drawX, 0, drawX + this.width, 0);
                grad.addColorStop(0, '#53a018');
                grad.addColorStop(0.3, '#73bf2e');
                grad.addColorStop(1, '#3a7210');
                ctx.fillStyle = freezeTimer > 0 ? '#67e8f9' : grad;

                ctx.fillRect(drawX, 0 - camera.y, this.width, topH);
                ctx.strokeRect(drawX, 0 - camera.y, this.width, topH);
                ctx.fillRect(drawX, botY - camera.y, this.width, this.bottom + 75);
                ctx.strokeRect(drawX, botY - camera.y, this.width, this.bottom + 75);

                ctx.fillRect(drawX - 5, topH - 30 - camera.y, this.width + 10, 30);
                ctx.strokeRect(drawX - 5, topH - 30 - camera.y, this.width + 10, 30);
                ctx.fillRect(drawX - 5, botY - camera.y, this.width + 10, 30);
                ctx.strokeRect(drawX - 5, botY - camera.y, this.width + 10, 30);
            }
        }

        function applyPowerup(bird, type) {
            const others = birds.filter(b => b.alive && b.id !== bird.id);
            const target = others[Math.floor(Math.random() * others.length)];
            const notif = document.getElementById('powerup-notif');
            
            notif.textContent = `${bird.type === 2 ? 'CPU' : 'P'}${bird.id+1} ➔ ${type.name.toUpperCase()}`;
            notif.style.opacity = 1;
            notif.style.transform = 'translateX(-50%) translateY(-10px)';
            setTimeout(() => { 
                notif.style.opacity = 0; 
                notif.style.transform = 'translateX(-50%) translateY(0)';
            }, 1200);

            switch(type.name) {
                case 'Distract': if(target) { target.timers.distract = type.duration; target.initialTimers.distract = type.duration; } break;
                case 'Invert': if(target) { target.gravityMultiplier = -1; target.timers.invert = type.duration; target.initialTimers.invert = type.duration; } break;
                case 'Dash': bird.dashX += 180; break;
                case 'Rewind': if(target) target.dashX -= 180; break;
                case 'God Mode': bird.timers.god = type.duration; bird.initialTimers.god = type.duration; break;
                case 'Shrink': bird.timers.shrink = type.duration; bird.initialTimers.shrink = type.duration; break;
                case 'Freeze': freezeTimer = type.duration; freezeInitial = type.duration; break;
                case 'Shield': bird.shieldActive = true; break;
            }
        }

        function startParty() {
            if (slotConfigs.filter(s => s > 0).length === 0) return;
            gameState = 'PLAYING';
            mainMenu.classList.add('hidden');
            gameOverMenu.classList.add('hidden');
            hud.classList.remove('hidden');
            hud.innerHTML = '';
            pipes = []; birds = []; powerups = []; frameCount = 0; freezeTimer = 0; freezeInitial = 0; distanceTraveled = 0;
            camera = { x: 0, y: 0, targetX: 0, targetY: 0 };
            
            slotConfigs.forEach((type, i) => {
                if (type > 0) {
                    birds.push(new Bird(i, BIRD_COLORS[i], type));
                    const scoreCard = document.createElement('div');
                    scoreCard.id = `score-card-${i}`;
                    scoreCard.className = "score-card";
                    scoreCard.innerHTML = `
                        <div class="flex justify-between items-center text-[10px] font-black text-[#543847] uppercase mb-1">
                            <span>${type===2?'CPU':'P'}${i+1}</span>
                            <span id="score-val-${i}">0</span>
                        </div>
                        <div class="bg-black/10 w-full h-2 rounded-full overflow-hidden">
                            <div id="progress-${i}" class="progress-bar h-full transition-all duration-300" style="background: ${BIRD_COLORS[i]}; width: 0%"></div>
                        </div>
                        <div id="pwr-container-${i}" class="powerup-bar-container">
                            <div id="pwr-bar-${i}" class="h-full bg-yellow-400 transition-all duration-100" style="width: 100%"></div>
                        </div>
                    `;
                    hud.appendChild(scoreCard);
                }
            });
            lastPipeX = canvas.width + 200;
            pipes.push(new Pipe(lastPipeX));
            musicBg.currentTime = 0;
            musicBg.play().catch(() => {});
            requestAnimationFrame(gameLoop);
        }

        function checkGameOver() {
            const alive = birds.filter(b => b.alive);
            if (alive.length === 0 || (birds.length > 1 && alive.length === 1)) {
                setTimeout(endGame, 800);
            }
        }

        function endGame() {
            if (gameState === 'GAMEOVER') return;
            gameState = 'GAMEOVER';
            gameOverMenu.classList.remove('hidden');
            let winner = birds.filter(b => b.alive)[0] || [...birds].sort((a,b)=>b.score-a.score)[0];
            document.getElementById('winner-text').textContent = (winner.type === 2 ? `CPU${winner.id+1}` : `P${winner.id+1}`) + " WINS!";
            document.getElementById('final-stats').innerHTML = birds.map(b => 
                `<div class="bg-white border-2 border-[#543847] p-2 rounded-lg" style="border-bottom: 5px solid ${b.color}">
                    <div class="font-black text-[#543847] text-[10px]">${b.type===2?'CPU':'P'}${b.id+1}</div>
                    <div class="text-lg font-bold">${b.score}</div>
                </div>`
            ).join('');
        }

        function resetToMenu() {
            gameState = 'MENU';
            mainMenu.classList.remove('hidden');
            gameOverMenu.classList.add('hidden');
            hud.classList.add('hidden');
            musicBg.pause();
            initLobby();
        }

        function gameLoop() {
            if (gameState !== 'PLAYING') {
                // Keep menu background moving slightly
                drawBackground();
                // Draw ground
                ctx.fillStyle = '#ded895';
                ctx.fillRect(0, canvas.height - 60, canvas.width, 100);
                ctx.fillStyle = '#9ce659';
                ctx.fillRect(0, canvas.height - 75, canvas.width, 15);
                ctx.strokeStyle = '#543847'; ctx.lineWidth = 2;
                ctx.strokeRect(-10, canvas.height - 75, canvas.width+20, 15);
                return;
            }
            
            const aliveBirds = birds.filter(b => b.alive);
            if (aliveBirds.length > 0) {
                camera.targetX = (aliveBirds.reduce((s,b)=>s+b.x, 0) / aliveBirds.length) - canvas.width * 0.25;
                camera.targetY = (aliveBirds.reduce((s,b)=>s+b.y, 0) / aliveBirds.length - canvas.height / 2) * 0.2;
            }
            camera.x += (camera.targetX - camera.x) * 0.1;
            camera.y += (camera.targetY - camera.y) * 0.1;

            drawBackground();
            
            // Ground
            ctx.fillStyle = '#ded895';
            ctx.fillRect(0, canvas.height - 60 - camera.y, canvas.width, 100);
            ctx.fillStyle = '#9ce659';
            ctx.fillRect(0, canvas.height - 75 - camera.y, canvas.width, 15);
            ctx.strokeStyle = '#543847'; ctx.lineWidth = 2;
            ctx.strokeRect(-10, canvas.height - 75 - camera.y, canvas.width+20, 15);
            
            if (freezeTimer > 0) freezeTimer--;
            else {
                distanceTraveled += PIPE_SPEED_BASE + (frameCount/5000);
                if (distanceTraveled + canvas.width > lastPipeX - 250) {
                    lastPipeX += PIPE_SPAWN_RATE * (PIPE_SPEED_BASE + (frameCount/5000));
                    pipes.push(new Pipe(lastPipeX));
                }
            }

            pipes.forEach(p => {
                p.draw();
                birds.forEach(b => {
                    if (!b.alive) return;
                    if (b.x + b.width*0.8 > p.x && b.x + b.width*0.2 < p.x + p.width && (b.y < p.top || b.y + b.height > canvas.height - 75 - p.bottom)) {
                        if (b.timers.god <= 0) b.die();
                    }
                    if (!p.scoredBy.has(b.id) && b.x > p.x + p.width) { 
                        b.score++; p.scoredBy.add(b.id); 
                        if (slotConfigs[b.id] === 1) sfxPoint.cloneNode().play().catch(()=>{}); 
                    }
                });
            });
            pipes = pipes.filter(p => p.x > camera.x - 300);

            powerups.forEach(pu => {
                if (!pu.active) return;
                const drawX = pu.x - camera.x;
                const drawY = pu.y - camera.y;
                
                ctx.fillStyle = pu.type.color;
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.arc(drawX, drawY, 15, 0, Math.PI*2); ctx.fill(); ctx.stroke();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center';
                ctx.fillText('?', drawX, drawY + 6);
                
                const b = birds.find(b => b.alive && Math.hypot(b.x + b.width/2 - pu.x, b.y + b.height/2 - pu.y) < 32);
                if (b) { pu.active = false; applyPowerup(b, pu.type); }
            });

            const maxProgress = Math.max(...birds.map(b => b.distance), 1);
            birds.forEach(b => {
                b.update(); b.draw();
                
                const scoreElem = document.getElementById(`score-val-${b.id}`);
                const progressElem = document.getElementById(`progress-${b.id}`);
                const scoreCard = document.getElementById(`score-card-${b.id}`);
                const pwrContainer = document.getElementById(`pwr-container-${b.id}`);
                const pwrBar = document.getElementById(`pwr-bar-${b.id}`);
                
                if (scoreElem) scoreElem.textContent = b.score;
                if (progressElem) progressElem.style.width = `${(b.distance/maxProgress)*100}%`;
                
                if (scoreCard && !b.alive) scoreCard.style.opacity = "0.5";

                if (pwrContainer && pwrBar) {
                    let activeTimer = 0;
                    let initialValue = 0;
                    let color = '#facc15';

                    if (b.timers.god > 0) { 
                        activeTimer = b.timers.god; 
                        initialValue = b.initialTimers.god; 
                        color = '#eab308'; 
                    } else if (b.timers.shrink > 0) { 
                        activeTimer = b.timers.shrink; 
                        initialValue = b.initialTimers.shrink; 
                        color = '#ec4899'; 
                    } else if (b.timers.distract > 0) { 
                        activeTimer = b.timers.distract; 
                        initialValue = b.initialTimers.distract; 
                        color = '#a855f7'; 
                    } else if (b.timers.invert > 0) { 
                        activeTimer = b.timers.invert; 
                        initialValue = b.initialTimers.invert; 
                        color = '#ef4444'; 
                    }

                    if (activeTimer > 0) {
                        pwrContainer.style.display = 'block';
                        pwrBar.style.width = `${(activeTimer / initialValue) * 100}%`;
                        pwrBar.style.backgroundColor = color;
                    } else {
                        pwrContainer.style.display = 'none';
                    }
                }
            });
            
            frameCount++;
            requestAnimationFrame(gameLoop);
        }

        window.addEventListener('keydown', (e) => {
            if (listeningSlot !== -1) {
                playerBinds[listeningSlot] = e.code;
                listeningSlot = -1;
                initLobby();
                return;
            }
            playerBinds.forEach((bind, idx) => {
                if (e.code === bind && slotConfigs[idx] === 1) {
                    const b = birds.find(b => b.id === idx);
                    if (b) b.flap();
                }
            });
        });

        function togglePowerups() {
            usePowerups = !usePowerups;
            const btn = document.getElementById('powerup-toggle');
            btn.textContent = usePowerups ? 'ENABLED' : 'DISABLED';
            btn.className = `btn py-1 px-10 ${usePowerups ? 'bg-green-500 border-green-700' : 'bg-red-500 border-red-700'} text-xs`;
        }

        function resize() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            initBackground();
            if (gameState === 'MENU') initLobby();
        }
        window.addEventListener('resize', resize);
        resize();
        initBackground();
        initLobby();
    </script>
</body>
</html>
