<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="OrgeYT Soundboard – play meme and effect sounds instantly" />
  <title>OrgeYT Soundboard</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff6b1a'/%3E%3Cpath d='M8 22V10l14-3v12M8 22c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2zm14-3c0 1.1-1.3 2-3 2s-3-.9-3-2 1.3-2 3-2 3 .9 3 2zM8 14l14-3' stroke='%23fff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <div class="logo-title">Orge<span>YT</span> Soundboard</div>
        <div class="logo-sub">SMASH THE BUTTONS</div>
      </div>

      <div class="controls">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
          </svg>
          <input
            type="search"
            id="search-input"
            placeholder="Search sounds…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search sounds"
          />
        </div>

        <button type="button" class="btn btn-accent" id="random-btn" title="Play a random sound (R)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/>
            <path d="m18 2 4 4-4 4"/>
            <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/>
            <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/>
            <path d="m18 14 4 4-4 4"/>
          </svg>
          Random
        </button>

        <button type="button" class="btn btn-ghost" id="stop-btn" title="Stop playback (Esc)" disabled>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="1"/>
          </svg>
          Stop
        </button>

        <button type="button" class="btn btn-download" id="download-all-btn" title="Download all sounds as ZIP">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download All
        </button>
      </div>
    </header>

    <div class="meta">
      <div id="status-text">Loading…</div>
      <div id="sound-count"></div>
      <div class="kbd-hint">
        <span><kbd class="kbd">/</kbd> search</span>
        <span><kbd class="kbd">R</kbd> random</span>
        <span><kbd class="kbd">Esc</kbd> stop</span>
      </div>
    </div>

    <main>
      <div class="sound-grid" id="sound-grid" role="list" aria-label="Sound buttons">
        <!-- Cards injected by app.js -->
      </div>
    </main>


  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="config.js"></script>
  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
