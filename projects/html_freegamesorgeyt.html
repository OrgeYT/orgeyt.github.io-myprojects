<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>freegamesorgeyt.com</title>
    <style>
        /* Dark orange / Orange Theme */
        body {
            background-color: #1a0a00; /* Very dark orange/almost black */
            color: #ff9d00;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        header {
            background-color: #cc4400; /* Dark orange */
            color: #ffffff;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.5em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            margin: 0;
            font-size: 1.2em;
            font-style: italic;
        }

        .game-controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        button {
            background-color: #ff7300; /* Standard orange */
            color: white;
            border: 2px solid #993300;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        button:hover {
            background-color: #ff8c33;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 115, 0, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        #game-wrapper {
            width: 100%;
            max-width: 1200px;
            height: 700px;
            margin: 0 auto;
            border: 6px solid #cc4400;
            border-radius: 12px;
            background-color: #000000;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            position: relative;
            overflow: hidden;
        }

        /* Message shown before a game is selected */
        #placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff9d00;
            font-size: 1.5em;
            pointer-events: none;
            z-index: 1;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: relative;
            z-index: 2;
            background-color: white; /* Some games need a white background */
            display: none; /* Hidden until a game is loaded */
        }
    </style>
</head>
<body>

    <header>
        <h1>freegamesorgeyt.com</h1>
        <p>Yall ever wanted to play smt, just go here ;) theres not much but yeah</p>
    </header>

    <div class="game-controls">
        <button onclick="loadGame('https://files.twoplayergames.org/files/games/other/TwoBall3D/index.html')">3d ball</button>
        <button onclick="loadGame('https://fnf.run3.io/shaggy-pe/1.25/')">FNF Shaggy</button>
        <button onclick="loadGame('https://turbowarp.org/1331390137/embed?addons=pause,gamepad,mute-project,clones,remove-curved-stage-border&settings-button')">Ultimate Dodging TWO</button>
        <button onclick="loadGame('https://geometrydashweb.on.websim.com/')">Accurate GD</button>
        <button onclick="loadGame('https://skribbl.io/')">Skribbl.io</button>
        <button onclick="loadGame('https://www.coolmathgames.com/0-run-3/play')">Run</button>
        <button onclick="loadGame('https://agar.io/')">Agar</button>
    </div>

    <div id="game-wrapper">
        <div id="placeholder-text">Select a game above to start playing!</div>
        <iframe id="game-frame" src=""></iframe>
    </div>

    <script>
        function loadGame(url) {
            const iframe = document.getElementById('game-frame');
            const placeholder = document.getElementById('placeholder-text');
            
            // Hide the placeholder text and show the iframe
            placeholder.style.display = 'none';
            iframe.style.display = 'block';
            
            // Load the chosen URL into the iframe
            iframe.src = url;
            
            // Scroll down slightly so the game is in full view
            document.getElementById('game-wrapper').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
