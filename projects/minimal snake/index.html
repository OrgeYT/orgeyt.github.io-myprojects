<!DOCTYPE html>
<html>
    <head>
        <style>
            /* Minimal UI */
            html, body {
                height: 100%;
                margin: 0;
                background: #000;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            /* center whole stage in the viewport */
            #stage {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%,-50%);
                display: flex;
                align-items: center;
                justify-content: center;
                width: 100%;
                height: 100%;
                pointer-events: none; /* allow canvas to receive events */
                flex-direction: column;
                gap: 12px;
            }

            /* simple HUD: title + score */
            #hud {
                pointer-events: auto;
                display: flex;
                align-items: center;
                justify-content: space-between;
                width: min(90vw, 880px);
                max-width: 100%;
                color: #fff;
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
                font-size: 16px;
                padding: 4px 8px;
                gap: 10px;
            }
            #title {
                font-weight: 700;
                letter-spacing: 0.2px;
            }
            #score {
                font-weight: 600;
                background: rgba(255,255,255,0.04);
                padding: 6px 10px;
                border-radius: 6px;
                border: 1px solid rgba(255,255,255,0.06);
            }

            /* pause button in HUD */
            #pause-btn {
                appearance: none;
                -webkit-appearance: none;
                background: transparent;
                border: 1px solid rgba(255,255,255,0.08);
                color: #fff;
                padding: 6px 10px;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                min-width: 64px;
            }
            #pause-btn:active { transform: translateY(1px); }
            #pause-btn[aria-pressed="true"] {
                background: rgba(255,255,255,0.06);
            }

            /* canvas: larger, preserved 4:3 ratio, crisp pixels and white outline */
            #g {
                pointer-events: auto;
                background: transparent;
                width: min(90vw, 880px);
                aspect-ratio: 4 / 3;
                image-rendering: crisp-edges;
                box-sizing: content-box;
                border: 4px solid #fff; /* white outline */
                border-radius: 6px;
                box-shadow: 0 6px 20px rgba(0,0,0,0.6);
                display: block;
            }

            /* simplified overlay: subtle, compact and accessible */
            #overlay {
                position: absolute;
                left: 50%;
                top: 50%;
                transform: translate(-50%,-50%);
                background: rgba(0,0,0,0.6);
                color: #e6e6e6;
                padding: 10px 12px;
                border-radius: 6px;
                text-align: center;
                min-width: 180px;
                display: none;
                border: 1px solid rgba(255,255,255,0.06);
                font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
                font-size: 14px;
                z-index: 10;
                pointer-events: auto;
            }
            /* minimal flat button */
            #overlay button {
                margin-top: 10px;
                padding: 8px 10px;
                background: transparent;
                border: 1px solid rgba(255,255,255,0.12);
                color: #e6e6e6;
                font-weight: 600;
                border-radius: 6px;
                min-width: 80px;
                cursor: pointer;
            }
            #overlay button:active { transform: translateY(1px); }
        </style>
    </head>
    <body>
        <div id="stage">
            <div id="hud" aria-hidden="false">
                <div id="title">Minimal Snake</div>
                <div style="display:flex;align-items:center;gap:10px;">
                    <div id="score" aria-live="polite">Score: 0</div>
                    <button id="pause-btn" aria-pressed="false" title="Pause (P / Enter)">Pause</button>
                </div>
            </div>
            <canvas id="g" width="800" height="600"></canvas>
        </div>

        <div id="overlay" role="dialog" aria-live="polite">
            <div id="overlay-msg">Game over</div>
            <button id="restart-btn">Restart</button>
        </div>

        <script type="module" src="main.js"></script>
    </body>
</html>
