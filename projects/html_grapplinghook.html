<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grapple Worlds</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #110a22;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            mix-blend-mode: difference;
        }
        #start-screen {
            background-color: rgba(17, 10, 34, 0.85);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            color: white;
            pointer-events: auto;
            cursor: pointer;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            transition: opacity 0.3s ease;
        }
        #start-screen h1 {
            margin-top: 0;
            color: #00ffff;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }
        #speed-o-meter {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: #00ffff;
            font-family: monospace;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        #sprint-label {
            font-size: 14px;
            color: #ff00ff;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .key {
            display: inline-block;
            background: #333;
            padding: 5px 10px;
            border-radius: 4px;
            margin: 2px;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div id="crosshair"></div>
        <div id="speed-o-meter">
            <div id="sprint-label">BOOST ACTIVE</div>
            <div id="kmh-value">0 km/h</div>
        </div>
        <div id="start-screen">
            <h1>Grapple Worlds</h1>
            <p>3rd Person Grappling Adventure</p>
            <br>
            <p><span class="key">W</span> <span class="key">A</span> <span class="key">S</span> <span class="key">D</span> to move / swing</p>
            <p><span class="key">Shift</span> to Sprint / Boost</p>
            <p><span class="key">Mouse</span> to look around</p>
            <p><span class="key">Click & Hold</span> to grapple (Auto-aim enabled)</p>
            <br>
            <p style="font-size: 1.2em; font-weight: bold; color: #ff00ff;">Click anywhere to start</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- Core Variables ---
        let scene, camera, renderer, clock, sky;
        
        // --- Player & Physics Variables ---
        const playerPos = new THREE.Vector3(0, 50, 0);
        const playerVelocity = new THREE.Vector3(0, 0, 0);
        const playerMesh = new THREE.Mesh(
            new THREE.BoxGeometry(2, 2, 2),
            new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.1, metalness: 0.5 })
        );
        
        let yawObject = new THREE.Group();
        let pitchObject = new THREE.Group();
        const cameraOffset = new THREE.Vector3(0, 5, 15);
        
        const gravity = 40;
        const baseMoveForce = 120;
        const sprintMultiplier = 2.5; // Sprinting power
        const damping = 1.0;   // No speed limit
        const keys = { w: false, a: false, s: false, d: false, shift: false };
        
        // --- Grapple Variables ---
        let isGrappling = false;
        let grapplePoint = new THREE.Vector3();
        let grappleLength = 0;
        const maxGrappleDist = 450;
        let grappleLine;
        
        // --- Wind Effect Variables ---
        const windStreaks = [];
        const windStreakCount = 100;
        let windContainer;
        const speedMeterValue = document.getElementById('kmh-value');
        const sprintLabel = document.getElementById('sprint-label');

        // --- Environment Variables ---
        const spheres = [];
        const sphereCount = 600;
        const worldRadius = 500;
        
        let isLocked = false;
        const startScreen = document.getElementById('start-screen');
        
        init();
        animate();

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            
            const skyGeom = new THREE.SphereGeometry(2500, 32, 32);
            const skyMat = new THREE.ShaderMaterial({
                vertexShader: `
                    varying vec3 vNormal;
                    void main() {
                        vNormal = normal;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
                    }
                `,
                fragmentShader: `
                    varying vec3 vNormal;
                    vec3 hsv2rgb(vec3 c) {
                        vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);
                        vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);
                        return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);
                    }
                    void main() {
                        vec3 dir = normalize(vNormal);
                        float hue = (dir.y * 0.5 + 0.5);
                        vec3 color = hsv2rgb(vec3(hue, 0.8, 0.4));
                        gl_FragColor = vec4(color, 1.0);
                    }
                `,
                side: THREE.BackSide
            });
            sky = new THREE.Mesh(skyGeom, skyMat);
            scene.add(sky);

            scene.fog = new THREE.Fog(0x000000, 200, worldRadius * 2);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 15000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            clock = new THREE.Clock();

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
            dirLight.position.set(100, 200, 100);
            scene.add(dirLight);

            scene.add(yawObject);
            yawObject.add(pitchObject);
            pitchObject.add(camera);
            camera.position.copy(cameraOffset);

            scene.add(playerMesh);

            windContainer = new THREE.Group();
            scene.add(windContainer);
            const streakGeom = new THREE.CylinderGeometry(0.02, 0.02, 1, 4);
            streakGeom.rotateX(Math.PI / 2);
            const streakMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });
            
            for (let i = 0; i < windStreakCount; i++) {
                const streak = new THREE.Mesh(streakGeom, streakMat);
                resetWindStreak(streak);
                windContainer.add(streak);
                windStreaks.push(streak);
            }

            const ropeGeom = new THREE.CylinderGeometry(0.15, 0.15, 1, 6);
            ropeGeom.rotateX(Math.PI / 2);
            const ropeMat = new THREE.MeshStandardMaterial({ 
                color: 0xffffff, 
                emissive: 0xffffff, 
                emissiveIntensity: 1.0 
            });
            grappleLine = new THREE.Mesh(ropeGeom, ropeMat);
            grappleLine.visible = false;
            scene.add(grappleLine);

            const sphereGeom = new THREE.SphereGeometry(1, 16, 16);
            for (let i = 0; i < sphereCount; i++) {
                const color = new THREE.Color().setHSL(Math.random(), 0.9, 0.6);
                const mat = new THREE.MeshStandardMaterial({ 
                    color: color, 
                    roughness: 0.1,
                    metalness: 0.3
                });
                const mesh = new THREE.Mesh(sphereGeom, mat);
                relocateSphere(mesh, playerPos, true);
                scene.add(mesh);
                spheres.push(mesh);
            }

            window.addEventListener('resize', onWindowResize);
            startScreen.addEventListener('click', () => document.body.requestPointerLock());
            document.addEventListener('pointerlockchange', () => {
                isLocked = document.pointerLockElement === document.body;
                startScreen.style.display = isLocked ? 'none' : 'block';
                if (!isLocked) { isGrappling = false; grappleLine.visible = false; }
            });
            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                yawObject.rotation.y -= e.movementX * 0.002;
                pitchObject.rotation.x -= e.movementY * 0.002;
                pitchObject.rotation.x = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 4, pitchObject.rotation.x));
            });
            document.addEventListener('mousedown', (e) => { if (isLocked && e.button === 0) attemptGrapple(); });
            document.addEventListener('mouseup', (e) => { if (e.button === 0) { isGrappling = false; grappleLine.visible = false; } });
            
            document.addEventListener('keydown', (e) => { 
                const key = e.key.toLowerCase();
                if (keys.hasOwnProperty(key)) keys[key] = true;
                if (e.key === 'Shift') keys.shift = true;
            });
            document.addEventListener('keyup', (e) => { 
                const key = e.key.toLowerCase();
                if (keys.hasOwnProperty(key)) keys[key] = false;
                if (e.key === 'Shift') keys.shift = false;
            });
        }

        function resetWindStreak(mesh) {
            const angle = Math.random() * Math.PI * 2;
            const dist = 5 + Math.random() * 40;
            mesh.position.set(
                Math.cos(angle) * dist,
                Math.sin(angle) * dist,
                (Math.random() - 0.5) * 100
            );
            mesh.scale.set(1, 1, 2 + Math.random() * 10);
        }

        function attemptGrapple() {
            const camPos = new THREE.Vector3();
            camera.getWorldPosition(camPos);
            const camDir = new THREE.Vector3();
            camera.getWorldDirection(camDir);
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const intersects = raycaster.intersectObjects(spheres);
            
            if (intersects.length > 0 && playerPos.distanceTo(intersects[0].point) <= maxGrappleDist) {
                startGrapple(intersects[0].point);
                return;
            }

            let bestDot = 0.92; 
            let bestPoint = null;
            for (let i = 0; i < spheres.length; i++) {
                const s = spheres[i];
                const vecToS = new THREE.Vector3().subVectors(s.position, camPos);
                const d = vecToS.length();
                if (d < maxGrappleDist) {
                    vecToS.normalize();
                    const dot = camDir.dot(vecToS);
                    if (dot > bestDot) {
                        bestDot = dot;
                        const radius = s.geometry.parameters.radius * s.scale.x;
                        bestPoint = s.position.clone().sub(vecToS.multiplyScalar(radius));
                    }
                }
            }
            if (bestPoint) startGrapple(bestPoint);
        }

        function startGrapple(hitPoint) {
            isGrappling = true;
            grapplePoint.copy(hitPoint);
            grappleLength = playerPos.distanceTo(hitPoint);
            grappleLine.visible = true;

            const speed = playerVelocity.length();
            if (speed > 5) {
                const ropeNorm = new THREE.Vector3().subVectors(playerPos, grapplePoint).normalize();
                const tangentialVel = new THREE.Vector3().copy(playerVelocity).sub(
                    ropeNorm.clone().multiplyScalar(playerVelocity.dot(ropeNorm))
                );
                
                if (tangentialVel.lengthSq() > 0.01) {
                    playerVelocity.copy(tangentialVel.normalize().multiplyScalar(speed));
                } else {
                    const fallbackDir = new THREE.Vector3(0, 1, 0).cross(ropeNorm);
                    playerVelocity.copy(fallbackDir.normalize().multiplyScalar(speed));
                }
            }
        }

        function relocateSphere(mesh, origin, isInit = false) {
            const minRad = isInit ? 30 : worldRadius * 0.8;
            const radius = minRad + Math.random() * (worldRadius - minRad);
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            mesh.position.set(
                origin.x + radius * Math.sin(phi) * Math.cos(theta),
                origin.y + radius * Math.sin(phi) * Math.sin(theta),
                origin.z + radius * Math.cos(phi)
            );
            const scale = 2 + Math.random() * 6;
            mesh.scale.set(scale, scale, scale);
        }

        function updatePhysics(delta) {
            playerVelocity.y -= gravity * delta;

            const moveDir = new THREE.Vector3();
            if (keys.w) moveDir.z -= 1;
            if (keys.s) moveDir.z += 1;
            if (keys.a) moveDir.x -= 1;
            if (keys.d) moveDir.x += 1;

            if (moveDir.lengthSq() > 0) {
                moveDir.normalize().applyEuler(new THREE.Euler(0, yawObject.rotation.y, 0));
                
                // Calculate move force with sprint bonus
                const currentMoveForce = keys.shift ? baseMoveForce * sprintMultiplier : baseMoveForce;
                playerVelocity.add(moveDir.multiplyScalar(currentMoveForce * delta));
            }

            playerVelocity.multiplyScalar(Math.pow(damping, delta * 60));
            const nextPos = playerPos.clone().add(playerVelocity.clone().multiplyScalar(delta));

            if (isGrappling) {
                const speed = playerVelocity.length();
                const ropeVec = nextPos.clone().sub(grapplePoint);
                ropeVec.normalize().multiplyScalar(grappleLength);
                nextPos.copy(grapplePoint).add(ropeVec);
                
                const ropeNorm = nextPos.clone().sub(grapplePoint).normalize();
                const radialVelocityComponent = playerVelocity.dot(ropeNorm);
                playerVelocity.sub(ropeNorm.multiplyScalar(radialVelocityComponent));
                
                if (speed > 0.01) {
                    playerVelocity.normalize().multiplyScalar(speed);
                }
                
                grappleLine.position.addVectors(nextPos, grapplePoint).multiplyScalar(0.5);
                grappleLine.scale.set(1, 1, grappleLength);
                grappleLine.lookAt(grapplePoint);
            }

            playerPos.copy(nextPos);
        }

        function updateWind(delta) {
            const speed = playerVelocity.length();
            
            // UI Update
            speedMeterValue.innerText = `${Math.round(speed)} km/h`;
            sprintLabel.style.opacity = (keys.shift && speed > 10) ? "1" : "0";
            
            // Dynamic FOV based on speed + sprint
            const sprintFOVBonus = keys.shift ? 10 : 0;
            const targetFOV = 75 + Math.min(speed * 0.1, 45) + sprintFOVBonus;
            camera.fov = THREE.MathUtils.lerp(camera.fov, targetFOV, 0.1);
            camera.updateProjectionMatrix();

            // Wind streaks movement
            windContainer.position.copy(playerPos);
            if (speed > 1) {
                windContainer.lookAt(playerPos.clone().add(playerVelocity));
                
                windStreaks.forEach(streak => {
                    const streakSpeed = keys.shift ? speed * 2.5 : speed * 1.5;
                    streak.position.z += streakSpeed * delta;
                    if (streak.position.z > 50) {
                        streak.position.z = -50;
                    }
                    streak.material.opacity = Math.min(speed / 300, 0.4);
                });
            } else {
                windStreaks.forEach(s => s.material.opacity = 0);
            }

            // Camera Shake scales with speed
            if (speed > 150) {
                const shakeMultiplier = keys.shift ? 0.001 : 0.0005;
                const shakeIntensity = (speed - 150) * shakeMultiplier;
                camera.position.x = (Math.random() - 0.5) * shakeIntensity;
                camera.position.y = 5 + (Math.random() - 0.5) * shakeIntensity;
            } else {
                camera.position.x = 0;
                camera.position.y = 5;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            let delta = Math.min(clock.getDelta(), 0.1);
            if (isLocked) {
                updatePhysics(delta);
                updateWind(delta);

                playerMesh.position.copy(playerPos);
                sky.position.copy(playerPos);

                if (playerVelocity.lengthSq() > 0.1) {
                    playerMesh.lookAt(playerPos.clone().add(playerVelocity));
                }
                yawObject.position.copy(playerPos);
                
                for (let i = 0; i < spheres.length; i++) {
                    if (spheres[i].position.distanceToSquared(playerPos) > worldRadius * worldRadius * 4) {
                        relocateSphere(spheres[i], playerPos);
                    }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
