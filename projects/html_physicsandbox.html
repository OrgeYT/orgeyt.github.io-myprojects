<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Physics Sandbox</title>
    <!-- Import Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Import Cannon.js for physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <!-- Import OrbitControls for camera interaction -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        /* Base styling */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            /* Disable selection to prevent issues when dragging */
            user-select: none; 
        }

        /* Full screen canvas */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* UI overlay styling */
        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.8);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            user-select: none;
            max-width: 300px;
        }

        h1 {
            margin: 0 0 15px 0;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #4ade80;
        }

        /* Control groups styling */
        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            color: #aaa;
        }

        /* Button grid styling */
        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        button:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .action-button {
            background: #ef4444;
            width: 100%;
            margin-top: 10px;
        }

        .action-button:hover {
            background: #dc2626;
        }

        /* Slider styling */
        input[type="range"] {
            width: 100%;
            accent-color: #4ade80;
        }

        /* Info text styling */
        #info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.8rem;
            pointer-events: none;
            color: #ccc;
        }
        
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none; /* Let clicks pass through to canvas */
            z-index: 100;
        }

        /* Statistics counter */
        #stats {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>

<div id="ui-container">
    <h1>Physics Sandbox</h1>
    
    <div class="control-group">
        <label>Spawn Shape</label>
        <div class="button-grid">
            <button onclick="spawnShape('cube')">Cube</button>
            <button onclick="spawnShape('sphere')">Sphere</button>
            <button onclick="spawnShape('cylinder')">Cylinder</button>
            <button onclick="spawnShape('pyramid')">Pyramid</button>
        </div>
    </div>

    <div class="control-group">
        <label for="height-slider">Spawn Height: <span id="height-val">10</span>m</label>
        <input type="range" id="height-slider" min="2" max="30" value="10" oninput="updateHeightVal(this.value)">
    </div>

    <div class="control-group">
        <label for="mass-slider">Mass: <span id="mass-val">1</span>kg</label>
        <input type="range" id="mass-slider" min="0.1" max="10" step="0.1" value="1" oninput="updateMassVal(this.value)">
    </div>

    <button class="action-button" onclick="clearObjects()">Clear Objects</button>

    <div id="stats">
        Objects: <span id="obj-count">0</span>
    </div>
</div>

<div id="crosshair"></div>

<div id="info">
    Click canvas to lock mouse | WASD: Move | Space/Shift: Up/Down | Left Click + Hold: Grab Object
</div>

<script>
    // System variables
    let scene, camera, renderer;
    let world;
    
    // Arrays to keep track of visual (Three.js) and physical (Cannon.js) bodies
    const visualObjects = [];
    const physicsBodies = [];
    
    // Materials
    let defaultMaterial, defaultContactMaterial;
    
    // Animation timing variables
    const timeStep = 1 / 60;
    let lastCallTime = performance.now() / 1000;
    
    // First-person controls and interaction variables
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    let isPointerLocked = false;
    let pitch = 0;
    let yaw = 0;
    const moveSpeed = 20.0;
    const lookSpeed = 0.002;
    
    // Input state
    const keys = {
        Forward: false, Backward: false, Left: false, Right: false, Up: false, Down: false
    };
    
    // Raycaster for object interaction
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(); // Will always be (0,0) when pointer is locked
    
    // Physics interaction constraints
    let jointBody, mouseConstraint;
    let grabbedMesh = null;
    let gPlane = new THREE.Plane();
    
    // Initial setup
    init();
    initControls();
    initInteraction();
    animate();

    function init() {
        // --- Three.js Setup ---
        
        // Create Scene
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e24);
        scene.fog = new THREE.Fog(0x1e1e24, 20, 100);

        // Create Camera
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);

        // Create Renderer
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.body.appendChild(renderer.domElement);

        // --- Lighting ---
        
        // Ambient Light
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        // Directional Light (Sun)
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        dirLight.castShadow = true;
        
        // Optimize shadow map
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        dirLight.shadow.camera.far = 100;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // Hemisphere light for softer shadows
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.4);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        // --- Cannon.js Setup ---
        
        // Create Physics World
        world = new CANNON.World();
        world.gravity.set(0, -9.82, 0); // Earth gravity
        world.broadphase = new CANNON.SAPBroadphase(world);
        world.solver.iterations = 10;
        
        // A kinematic body for the mouse to attach to
        const jointShape = new CANNON.Sphere(0.1);
        jointBody = new CANNON.Body({ mass: 0 });
        jointBody.addShape(jointShape);
        jointBody.collisionFilterGroup = 0; // Don't collide with anything
        jointBody.collisionFilterMask = 0;
        world.addBody(jointBody);

        // Materials setup
        defaultMaterial = new CANNON.Material('default');
        
        // Define how objects bounce and slide against each other
        defaultContactMaterial = new CANNON.ContactMaterial(defaultMaterial, defaultMaterial, {
            friction: 0.3,
            restitution: 0.5 // Bounciness (0 = no bounce, 1 = super bouncy)
        });
        world.addContactMaterial(defaultContactMaterial);

        // Create Ground Plane
        createGround();

        // Handle window resize
        window.addEventListener('resize', onWindowResize, false);
    }

    function createGround() {
        // Visual Ground (Three.js)
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        
        // Create a grid texture procedurally
        const gridHelper = new THREE.GridHelper(100, 50, 0x555555, 0x333333);
        gridHelper.position.y = 0.01; // Slightly above ground to prevent z-fighting
        scene.add(gridHelper);

        const groundMaterial = new THREE.MeshStandardMaterial({ 
            color: 0x222222,
            roughness: 0.8,
            metalness: 0.1
        });
        const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
        groundMesh.rotation.x = -Math.PI / 2; // Rotate flat
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // Physical Ground (Cannon.js)
        const groundShape = new CANNON.Plane();
        const groundBody = new CANNON.Body({ 
            mass: 0, // Static object
            material: defaultMaterial,
            type: CANNON.Body.STATIC
        });
        groundBody.addShape(groundShape);
        groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
        world.addBody(groundBody);
    }
    
    function initControls() {
        // Pointer Lock Setup
        renderer.domElement.addEventListener('click', () => {
            if (!isPointerLocked) {
                document.body.requestPointerLock();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === document.body;
        });

        // Mouse Look
        document.addEventListener('mousemove', (event) => {
            if (isPointerLocked) {
                yaw -= event.movementX * lookSpeed;
                pitch -= event.movementY * lookSpeed;
                
                // Clamp pitch to prevent looking past straight up/down
                // We subtract 0.001 to prevent math errors exactly at 90 degrees
                const PI_2 = Math.PI / 2 - 0.001;
                pitch = Math.max(-PI_2, Math.min(PI_2, pitch));
                
                const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);
            }
        });

        // Keyboard Movement
        const onKeyDown = (event) => {
            switch (event.code) {
                case 'KeyW': keys.Forward = true; break;
                case 'KeyA': keys.Left = true; break;
                case 'KeyS': keys.Backward = true; break;
                case 'KeyD': keys.Right = true; break;
                case 'Space': keys.Up = true; break;
                case 'ShiftLeft':
                case 'ShiftRight': keys.Down = true; break;
            }
        };

        const onKeyUp = (event) => {
            switch (event.code) {
                case 'KeyW': keys.Forward = false; break;
                case 'KeyA': keys.Left = false; break;
                case 'KeyS': keys.Backward = false; break;
                case 'KeyD': keys.Right = false; break;
                case 'Space': keys.Up = false; break;
                case 'ShiftLeft':
                case 'ShiftRight': keys.Down = false; break;
            }
        };

        document.addEventListener('keydown', onKeyDown);
        document.addEventListener('keyup', onKeyUp);
    }
    
    function initInteraction() {
        document.addEventListener('mousedown', (e) => {
            if (!isPointerLocked) return;
            if (e.button !== 0) return; // Only left click

            // Raycast from center of screen
            raycaster.setFromCamera({x: 0, y: 0}, camera);

            // Find intersections with visual objects
            const intersects = raycaster.intersectObjects(visualObjects);

            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                
                // Find corresponding physics body
                const bodyIndex = visualObjects.indexOf(hitMesh);
                if (bodyIndex === -1) return;
                
                const hitBody = physicsBodies[bodyIndex];
                
                if (hitBody) {
                    grabbedMesh = hitMesh;
                    
                    // Wake up the body if it's sleeping
                    hitBody.wakeUp();
                    
                    // Set joint position to exact hit point
                    const hitPoint = intersects[0].point;
                    jointBody.position.copy(hitPoint);
                    
                    // Add constraint between dummy joint and the grabbed body
                    // PointToPoint constraint allows it to swing
                    mouseConstraint = new CANNON.PointToPointConstraint(
                        hitBody,
                        new CANNON.Vec3(
                            hitPoint.x - hitBody.position.x,
                            hitPoint.y - hitBody.position.y,
                            hitPoint.z - hitBody.position.z
                        ),
                        jointBody,
                        new CANNON.Vec3(0, 0, 0)
                    );
                    world.addConstraint(mouseConstraint);
                    
                    // Calculate distance from camera to hit point to maintain it while dragging
                    const distance = camera.position.distanceTo(hitPoint);
                    
                    // Setup plane for moving the object in 3D space relative to camera view
                    const normal = new THREE.Vector3().subVectors(camera.position, hitPoint).normalize();
                    gPlane.setFromNormalAndCoplanarPoint(normal, hitPoint);
                }
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (e.button !== 0) return;
            
            // Release constraint
            if (mouseConstraint) {
                world.removeConstraint(mouseConstraint);
                mouseConstraint = null;
                grabbedMesh = null;
            }
        });
    }

    function spawnShape(type) {
        // Get user settings from UI
        const spawnHeight = parseFloat(document.getElementById('height-slider').value);
        const mass = parseFloat(document.getElementById('mass-slider').value);
        
        // Randomize spawn position slightly so they don't all perfectly stack
        const px = (Math.random() - 0.5) * 4;
        const pz = (Math.random() - 0.5) * 4;
        const position = new CANNON.Vec3(px, spawnHeight, pz);

        // Generate a random bright color
        const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.6);

        let geometry, shape;
        const size = 1 + Math.random() * 0.5; // Random size variation

        // Configure geometry based on requested type
        switch (type) {
            case 'cube':
                const extents = size / 2;
                geometry = new THREE.BoxGeometry(size, size, size);
                shape = new CANNON.Box(new CANNON.Vec3(extents, extents, extents));
                break;
                
            case 'sphere':
                const radius = size / 2;
                geometry = new THREE.SphereGeometry(radius, 32, 32);
                shape = new CANNON.Sphere(radius);
                break;
                
            case 'cylinder':
                const cRadius = size / 2;
                const cHeight = size * 1.5;
                geometry = new THREE.CylinderGeometry(cRadius, cRadius, cHeight, 32);
                // Cannon.js cylinder requires orientation adjustment
                shape = new CANNON.Cylinder(cRadius, cRadius, cHeight, 16);
                
                // Rotate visual mesh to align with physics body
                geometry.rotateX(Math.PI / 2);
                
                // Cannon's cylinder aligns along Z by default, we want Y for falling
                const q = new CANNON.Quaternion();
                q.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
                break;
                
            case 'pyramid':
                // A pyramid is essentially a tetrahedron or a cone with 4 sides
                const pRadius = size;
                const pHeight = size * 1.5;
                // Create visual pyramid (Cone with 4 radial segments)
                geometry = new THREE.ConeGeometry(pRadius, pHeight, 4);
                
                // Create physical pyramid (Cylinder with 4 segments and 0 top radius acts as a cone)
                // Note: Cannon.js lacks a native Cone shape in older versions, 
                // so we approximate it with a generic convex polyhedron or a heavily tessellated cylinder.
                // Using a cylinder with a tiny top radius as a simple approximation for stability
                shape = new CANNON.Cylinder(0.01, pRadius, pHeight, 4);
                
                // Align rotations
                geometry.rotateX(Math.PI / 2);
                const qp = new CANNON.Quaternion();
                qp.setFromAxisAngle(new CANNON.Vec3(1,0,0), -Math.PI/2);
                
                break;
        }

        // --- Create Visual Object (Three.js) ---
        const material = new THREE.MeshStandardMaterial({ 
            color: color,
            roughness: 0.3,
            metalness: 0.2
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        visualObjects.push(mesh);

        // --- Create Physical Object (Cannon.js) ---
        const body = new CANNON.Body({
            mass: mass,
            material: defaultMaterial,
            position: position,
            shape: shape
        });
        
        // Apply orientation adjustment if necessary (for cylinders/pyramids)
        if (type === 'cylinder' || type === 'pyramid') {
             const q = new CANNON.Quaternion();
             // Adjust base orientation for Cannon.js cylinders
             q.setFromAxisAngle(new CANNON.Vec3(1,0,0), Math.PI/2);
             
             // Random initial rotation
             const randomQ = new CANNON.Quaternion();
             randomQ.setFromEuler(
                 Math.random() * Math.PI,
                 Math.random() * Math.PI,
                 Math.random() * Math.PI
             );
             
             body.quaternion = randomQ.mult(q);
             
             // Add a little random spin
             body.angularVelocity.set(
                 (Math.random() - 0.5) * 5,
                 (Math.random() - 0.5) * 5,
                 (Math.random() - 0.5) * 5
             );
        } else {
             // Random starting rotation for cubes/spheres
             body.quaternion.setFromEuler(
                 Math.random() * Math.PI,
                 Math.random() * Math.PI,
                 Math.random() * Math.PI
             );
        }

        world.addBody(body);
        physicsBodies.push(body);

        updateStats();
    }

    function clearObjects() {
        // Remove objects from Three.js scene
        for (let i = 0; i < visualObjects.length; i++) {
            scene.remove(visualObjects[i]);
            // Clean up memory
            if (visualObjects[i].geometry) visualObjects[i].geometry.dispose();
            if (visualObjects[i].material) visualObjects[i].material.dispose();
        }
        
        // Remove objects from Cannon.js world
        for (let i = 0; i < physicsBodies.length; i++) {
            world.remove(physicsBodies[i]);
        }

        // Clear arrays
        visualObjects.length = 0;
        physicsBodies.length = 0;
        
        updateStats();
    }

    function updateHeightVal(val) {
        document.getElementById('height-val').innerText = val;
    }

    function updateMassVal(val) {
        document.getElementById('mass-val').innerText = val;
    }

    function updateStats() {
        document.getElementById('obj-count').innerText = visualObjects.length;
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now() / 1000;
        // Cap dt to prevent huge jumps if tab becomes inactive
        const dt = Math.min(time - lastCallTime, 0.1); 
        lastCallTime = time;
        
        if (isPointerLocked) {
            // Calculate movement direction relative to camera facing
            direction.z = Number(keys.Forward) - Number(keys.Backward);
            direction.x = Number(keys.Right) - Number(keys.Left);
            direction.y = Number(keys.Up) - Number(keys.Down);
            direction.normalize();

            // Calculate forward and right vectors strictly based on yaw
            // This prevents the camera from getting stuck or outputting NaNs when looking straight up or down
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
            const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw)).normalize();

            // Apply movement velocity
            if (keys.Forward || keys.Backward) {
                camera.position.add(forward.multiplyScalar(direction.z * moveSpeed * dt));
            }
            if (keys.Left || keys.Right) {
                camera.position.add(right.multiplyScalar(direction.x * moveSpeed * dt));
            }
            if (keys.Up || keys.Down) {
                // Absolute up/down movement
                camera.position.y += direction.y * moveSpeed * dt;
            }
            
            // Prevent camera from clipping through floor
            if (camera.position.y < 1) camera.position.y = 1;
            
            // Update grabbed object position if holding something
            if (mouseConstraint) {
                // Cast ray forward from camera
                raycaster.setFromCamera({x: 0, y: 0}, camera);
                
                // Determine target point based on original grab distance
                // We recreate the plane so the object stays in front of the camera as we look around
                gPlane.setFromNormalAndCoplanarPoint(
                    camera.getWorldDirection(new THREE.Vector3()).negate(),
                    jointBody.position // Current joint pos
                );
                
                const targetPos = new THREE.Vector3();
                raycaster.ray.intersectPlane(gPlane, targetPos);
                
                if (targetPos) {
                    // Smoothly move the kinematic joint body to target
                    jointBody.position.x += (targetPos.x - jointBody.position.x) * 0.1;
                    jointBody.position.y += (targetPos.y - jointBody.position.y) * 0.1;
                    jointBody.position.z += (targetPos.z - jointBody.position.z) * 0.1;
                    
                    // Wake up the physical body in case it fell asleep while held still
                    mouseConstraint.bodyA.wakeUp();
                }
            }
        }

        // Step physics world forward
        world.step(timeStep, dt, 3);

        // Sync visual objects with physics bodies
        for (let i = 0; i < physicsBodies.length; i++) {
            visualObjects[i].position.copy(physicsBodies[i].position);
            visualObjects[i].quaternion.copy(physicsBodies[i].quaternion);
            
            // Optimization: If object falls too far off map, remove it
            if (physicsBodies[i].position.y < -50) {
                scene.remove(visualObjects[i]);
                world.remove(physicsBodies[i]);
                
                visualObjects[i].geometry.dispose();
                visualObjects[i].material.dispose();
                
                visualObjects.splice(i, 1);
                physicsBodies.splice(i, 1);
                
                updateStats();
                i--; // Adjust index after removal
            }
        }

        // Render scene
        renderer.render(scene, camera);
    }
</script>
</body>
</html>
