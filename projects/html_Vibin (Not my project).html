<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vibin Project</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        height: 100vh;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        overflow: hidden;
    }

    #popup {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.75);
        z-index: 10;
    }

    .box {
        width: min(90%, 500px);
        padding: 30px;
        background: #222;
        border: 2px solid #444;
        border-radius: 18px;
        box-shadow: 0 10px 40px rgba(0,0,0,.5);
        text-align: center;
    }

    .box h2 {
        margin-top: 0;
        font-size: 26px;
    }

    .box p {
        font-size: 18px;
        margin: 18px 0;
    }

    .creator {
        display: inline-block;
        padding: 8px 14px;
        margin-left: 5px;
        border: 0;
        border-radius: 8px;
        background: #5865f2;
        color: white;
        font-size: 16px;
        cursor: pointer;
        transition: .2s;
    }

    .creator:hover {
        transform: scale(1.05);
        background: #7280ff;
    }

    #ok {
        margin-top: 15px;
        padding: 11px 30px;
        border: 0;
        border-radius: 10px;
        background: #4caf50;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }

    #ok:hover {
        background: #5bc65f;
    }

    #game {
        width: 100%;
        height: 100%;
        border: 0;
        display: none;
    }
</style>
</head>

<body>

<div id="popup">
    <div class="box">
        <h2>I rlly like this project, cuz its fun :D</h2>

        <p>
            This was made by
            <button class="creator" id="creatorButton">
                idkthisisausername2323
            </button>
            on WebSim
        </p>

        <button id="ok">OK</button>
    </div>
</div>

<iframe
    id="game"
    src="https://vibin--idkthisisausername2323.on.websim.com/"
    allow="fullscreen"
></iframe>

<script>
    const username = "idkthisisausername2323";

    const creatorButton = document.getElementById("creatorButton");
    const popup = document.getElementById("popup");
    const game = document.getElementById("game");
    const ok = document.getElementById("ok");

    creatorButton.textContent = username;

    creatorButton.onclick = () => {
        window.open(
            "https://websim.com/@" + username,
            "_blank"
        );
    };

    ok.onclick = () => {
        popup.style.display = "none";
        game.style.display = "block";
    };
</script>

</body>
</html>
