<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pass the Bomb 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Inter', sans-serif; user-select: none; }
        #game-ui, #main-menu, #settings-menu, #customize-menu, #game-over, #pause-menu { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #main-menu:not(.hidden), #settings-menu:not(.hidden), #customize-menu:not(.hidden), #game-over:not(.hidden), #pause-menu:not(.hidden) { pointer-events: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); }
        .btn { pointer-events: auto; transition: transform 0.1s, background-color 0.2s; }
        .btn:active { transform: scale(0.95); }
        #crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 10px; height: 10px; background: rgba(255,255,255,0.8); border-radius: 50%; display: none; pointer-events: none; z-index: 100; }
        .nametag { position: absolute; color: white; font-weight: bold; font-size: 1rem; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100%; height: 100%; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); border-radius: 1rem; }
        
        /* Custom scrollbar for settings */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.5); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.8); }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js",
                "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <div id="game-ui" class="hidden flex flex-col justify-between p-4">

            <p class="mb-8 font-semibold text-gray-300">Don't be left holding it!</p>

            <div class="w-full space-y-4 mb-8">

    <!-- Settings Menu -->

    <!-- Game Over Screen -->

        // --- Audio Setup ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;

            bgm: new Audio('https://file.garden/Zj01o_oh-G9Y8APf/pass%20the%20bomb/Quick%2C%20Pass%20that%20bomb.mp3'),
            land: new Audio('https://file.garden/Zj01o_oh-G9Y8APf/pass%20the%20bomb/freesound_community-land2-43790.mp3'),

        sounds.bgm.volume = 0.4;
        
        function playSound(name) {
            try {
                const s = sounds[name].cloneNode();
                s.volume = sounds[name].volume || 1;
                s.play().catch(e => {});
            } catch(e) {}
        }

        // --- Global Variables ---
        let scene, camera, renderer, physicsWorld, dirLight;
        let gameState = 'menu'; // menu, intro, playing, paused, gameover
        let gameMode = 'play'; // play, spectate
        let players = [];
        let platforms = [];
        let debris = [];
        let mapObjects = [];
        let physicsBodies = [];
        let myPlayer = null;
        
        let bombHolder = null;
        let bombTimer = 10;
        let initialBombTimer = 10;
        let globalPassCooldown = 0;
        let bombSpawnDelay = 0;
        let bombMesh = null;
        let lastTickInt = 0;
        let clock = new THREE.Clock();

        let introTimer = 0;
        let introEndPanCamPos = new THREE.Vector3();
        let introEndPanLookPos = new THREE.Vector3();

        let playerBodyColor = '#22c55e';
        let playerHeadArmColor = '#ffab66';
        let playerLegColor = '#000000';
        let playerHatType = 'none';
        let playerHatColor = '#ff0000';
        let isRobloxMode = false;

        let MAP_SIZE = 100;
        let platformMultiplier = 1.0;
        let maxAllowedJumps = 2;
        let spectateTarget = null;
        let raycaster = new THREE.Raycaster();
        
        let previewScene, previewCamera, previewRenderer, previewGroup;

        // R6 Model Data based on the reference game
        const R6_MODEL_DATA = {
            "head":  { "type": "head",  "color": "#ffab66", "px": 0, "py": 4.01, "pz": 0, "sx": 1, "sy": 1, "sz": 1 },
            "torso": { "type": "torso", "color": "#ff0000", "px": 0, "py": 2.67, "pz": 0, "sx": 1.7, "sy": 1.65, "sz": 1.06 },
            "r_arm": { "type": "arm",   "color": "#ffab66", "px": 1.32, "py": 2.66, "pz": 0, "sx": 1, "sy": 1.67, "sz": 1.02 },
            "l_arm": { "type": "arm",   "color": "#ffab66", "px": -1.35, "py": 2.66, "pz": 0, "sx": 1, "sy": 1.67, "sz": 1.02 },
            "r_leg": { "type": "leg",   "color": "#000000", "px": 0.47, "py": 0.98, "pz": 0, "sx": 1, "sy": 1.82, "sz": 1 },
            "l_leg": { "type": "leg",   "color": "#000000", "px": -0.44, "py": 0.98, "pz": 0, "sx": 1, "sy": 1.82, "sz": 1 }
        };

        const GRAVITY = -30;
        const JUMP_FORCE = 15;
        const MOVE_SPEED = 30;

        const keys = { w: false, a: false, s: false, d: false, q: false, e: false, space: false };
        let camYaw = 0;
        let camPitch = 0;
        let camZoom = 15;
        let isPointerLocked = false;

        function initScene() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            
            dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
            dirLight.position.set(20, 50, -20);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            scene.add(dirLight);

            physicsWorld = new CANNON.World({ gravity: new CANNON.Vec3(0, -20, 0) });
            const groundMat = new CANNON.Material();
            physicsWorld.addBody(new CANNON.Body({
                mass: 0,
                shape: new CANNON.Plane(),
                material: groundMat,
                quaternion: new CANNON.Quaternion().setFromEuler(-Math.PI/2, 0, 0)
            }));

            buildMap();
            createBomb();
            populateNamesList();
            initPreview(); 
            
            window.addEventListener('resize', onWindowResize);
        }

        function initPreview() {
            const container = document.getElementById('preview-3d');
            previewScene = new THREE.Scene();
            
            const amb = new THREE.AmbientLight(0xffffff, 0.6);
            previewScene.add(amb);
            const dir = new THREE.DirectionalLight(0xffffff, 0.8);
            dir.position.set(5, 10, 5);
            previewScene.add(dir);

            previewCamera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
            previewCamera.position.set(0, 2, 8);
            
            previewRenderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            previewRenderer.setSize(192, 192); 
            container.appendChild(previewRenderer.domElement);

            previewGroup = new THREE.Group();
            previewScene.add(previewGroup);
            updatePreview();
        }

        function updatePreview() {
            while(previewGroup.children.length > 0){ previewGroup.remove(previewGroup.children[0]); }
            
            const bodyColor = document.getElementById('edit-body-color').value;
            const headArmColor = document.getElementById('edit-head-color').value;
            const legColor = document.getElementById('edit-leg-color').value;
            const hatType = document.getElementById('edit-hat').value;
            const hatColor = document.getElementById('edit-hat-color').value;

            const bodyMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(bodyColor), roughness: 0.4 });
            const eyeGeo = new THREE.SphereGeometry(0.3, 16, 16);
            eyeGeo.scale(1, 2, 0.4);
            const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            
            let headAnchor = null;

            if (isRobloxMode) {
                const robloxGroup = new THREE.Group();
                robloxGroup.scale.setScalar(0.75); // Scaled up
                robloxGroup.position.y = 0; // Adjusted grounding offset
                const yOffset = -0.07; // Grounding offset
                
                for (const key in R6_MODEL_DATA) {
                    const part = R6_MODEL_DATA[key];
                    let matColor;
                    if (part.type === 'torso') matColor = new THREE.Color(bodyColor);
                    else if (part.type === 'head' || part.type === 'arm') matColor = new THREE.Color(headArmColor);
                    else if (part.type === 'leg') matColor = new THREE.Color(legColor);
                    else matColor = new THREE.Color(part.color);
                    
                    const mat = new THREE.MeshStandardMaterial({ color: matColor, roughness: 0.4 });
                    const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
                    mesh.scale.set(part.sx, part.sy, part.sz);
                    
                    const pivot = new THREE.Group();
                    pivot.position.set(part.px, part.py + yOffset, part.pz);
                    
                    if (part.type === 'arm') {
                        mesh.position.y = -part.sy / 2 + 0.2;
                        pivot.position.y += part.sy / 2 - 0.2;
                    } else if (part.type === 'leg') {
                        mesh.position.y = -part.sy / 2;
                        pivot.position.y += part.sy / 2;
                    } else if (part.type === 'head') {
                        headAnchor = pivot; 
                        // Removed eyes for the Roblox model
                    }
                    
                    pivot.add(mesh);
                    robloxGroup.add(pivot);
                }
                
                previewGroup.add(robloxGroup);
            } else {
                const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), bodyMat);
                bodyMesh.position.y = 1;
                previewGroup.add(bodyMesh);
                headAnchor = bodyMesh; // Hat goes on body

                const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                leftEye.position.set(-0.4, 1.2, 1.05);
                const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
                rightEye.position.set(0.4, 1.2, 1.05);
                previewGroup.add(leftEye, rightEye);
            }

            const myHat = buildHat(hatType, hatColor);
            if (myHat) {
                myHat.position.y = isRobloxMode ? 0.55 : 1; 
                headAnchor.add(myHat);
            }
            
            previewGroup.scale.setScalar(1.5);
            previewGroup.position.y = -1.5;
        }

        function createStudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#4ade80';
            ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(32, 32, 12, 0, Math.PI * 2);
            ctx.fill();
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function createWhiteStudTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 64, 64);
            ctx.fillStyle = '#e5e5e5';
            ctx.beginPath();
            ctx.arc(32, 32, 12, 0, Math.PI * 2);
            ctx.fill();
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            return tex;
        }

        function buildMap() {
            mapObjects.forEach(obj => {
                scene.remove(obj);
                if(obj.geometry) obj.geometry.dispose();
                if(obj.material) {
                    if(Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
                    else obj.material.dispose();
                }
            });
            physicsBodies.forEach(body => physicsWorld.removeBody(body));
            mapObjects = [];
            platforms = [];
            physicsBodies = [];

            const floorGeo = new THREE.PlaneGeometry(MAP_SIZE, MAP_SIZE);
            const tex = createStudTexture();
            tex.repeat.set(MAP_SIZE/4, MAP_SIZE/4);
            const floorMat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            floor.receiveShadow = true;
            scene.add(floor);
            mapObjects.push(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3 });
            const wGeo = new THREE.BoxGeometry(MAP_SIZE, 40, 2);
            
            const walls = [
                { x: 0, z: -MAP_SIZE/2, rot: 0 },
                { x: 0, z: MAP_SIZE/2, rot: 0 },
                { x: -MAP_SIZE/2, z: 0, rot: Math.PI/2 },
                { x: MAP_SIZE/2, z: 0, rot: Math.PI/2 }
            ];
            walls.forEach(w => {
                const mesh = new THREE.Mesh(wGeo, wallMat);
                mesh.position.set(w.x, 20, w.z);
                mesh.rotation.y = w.rot;
                scene.add(mesh);
                mapObjects.push(mesh);
            });

            const platGeo = new THREE.BoxGeometry(8, 1, 8);
            const platMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.5 });
            const numPlatforms = Math.floor(25 * platformMultiplier * (MAP_SIZE / 100));
            
            for(let i=0; i<numPlatforms; i++) {
                const mesh = new THREE.Mesh(platGeo, platMat);
                mesh.position.set(
                    (Math.random() - 0.5) * (MAP_SIZE - 10),
                    2 + Math.random() * 20,
                    (Math.random() - 0.5) * (MAP_SIZE - 10)
                );
                mesh.receiveShadow = true;
                mesh.castShadow = true;
                scene.add(mesh);
                
                platforms.push({
                    mesh: mesh,
                    box: new THREE.Box3().setFromObject(mesh),
                    topY: mesh.position.y + 0.5
                });
                mapObjects.push(mesh);
            }

            // --- Intro Map ---
            const introY = 1000;
            const introGeo = new THREE.CylinderGeometry(40, 40, 2, 32);
            
            const introTex = createWhiteStudTexture();
            introTex.repeat.set(20, 20);
            const introMat = new THREE.MeshStandardMaterial({ map: introTex, roughness: 0.8 });
            
            const introFloor = new THREE.Mesh(introGeo, introMat);
            introFloor.position.set(0, introY - 1, 0);
            scene.add(introFloor);
            mapObjects.push(introFloor);
            
            platforms.push({
                mesh: introFloor,
                box: new THREE.Box3().setFromObject(introFloor),
                topY: introFloor.position.y + 1,
                isIntro: true
            });
            
            const ringGeo = new THREE.TorusGeometry(38, 0.5, 16, 64);
            const ringMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.position.set(0, introY, 0);
            ring.rotation.x = Math.PI/2;
            scene.add(ring);
            mapObjects.push(ring);
            
            const introShape = new CANNON.Box(new CANNON.Vec3(40, 1, 40));
            const introBody = new CANNON.Body({ mass: 0, shape: introShape });
            introBody.position.set(0, introY - 1, 0);
            physicsWorld.addBody(introBody);
            physicsBodies.push(introBody);

            dirLight.shadow.camera.left = -MAP_SIZE/2;
            dirLight.shadow.camera.right = MAP_SIZE/2;
            dirLight.shadow.camera.top = MAP_SIZE/2;
            dirLight.shadow.camera.bottom = -MAP_SIZE/2;
            dirLight.shadow.camera.updateProjectionMatrix();
        }

        function createBomb() {
            const grp = new THREE.Group();
            const geo = new THREE.SphereGeometry(0.6, 16, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.2 });
            const mesh = new THREE.Mesh(geo, mat);
            grp.add(mesh);

            const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4), new THREE.MeshBasicMaterial({ color: 0x884400 }));
            fuse.position.y = 0.7;
            grp.add(fuse);
            
            const spark = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
            spark.position.y = 0.9;
            grp.add(spark);

            bombMesh = grp;
        }

        function buildHat(type, colorHex) {
            if (!type || type === 'none') return null;
            const hatGroup = new THREE.Group();
            const color = new THREE.Color(colorHex);
            
            if (type === 'santa') {
                const cone = new THREE.Mesh(new THREE.ConeGeometry(0.8, 1.5, 16), new THREE.MeshStandardMaterial({ color: color }));
                cone.position.y = 0.75;
                const brim = new THREE.Mesh(new THREE.TorusGeometry(0.7, 0.2, 8, 24), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                brim.rotation.x = Math.PI / 2;
                const ball = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                ball.position.y = 1.5;
                hatGroup.add(cone, brim, ball);
            } else if (type === 'cone') {
                const base = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.1, 1.8), new THREE.MeshStandardMaterial({ color: color }));
                const cone = new THREE.Mesh(new THREE.ConeGeometry(0.7, 1.6, 16), new THREE.MeshStandardMaterial({ color: color }));
                cone.position.y = 0.8;
                const stripe = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.55, 0.4, 16), new THREE.MeshStandardMaterial({ color: 0xffffff }));
                stripe.position.y = 0.7;
                hatGroup.add(base, cone, stripe);
            } else if (type === 'beanie') {
                const dome = new THREE.Mesh(new THREE.SphereGeometry(0.85, 16, 16, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({ color: color }));
                const ball = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 16), new THREE.MeshStandardMaterial({ color: color }));
                ball.position.y = 0.85;
                hatGroup.add(dome, ball);
            } else if (type === 'bomb') {
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), new THREE.MeshStandardMaterial({ color: color, roughness: 0.2 }));
                mesh.position.y = 0.6;
                const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4), new THREE.MeshBasicMaterial({ color: 0x884400 }));
                fuse.position.y = 1.3;
                const spark = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
                spark.position.y = 1.5;
                hatGroup.add(mesh, fuse, spark);
            } else if (type === 'crown') {
                const crown = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.8, 0.8, 8, 1, true), new THREE.MeshStandardMaterial({ color: color, side: THREE.DoubleSide }));
                crown.position.y = 0.4;
                for (let i=0; i<4; i++) {
                    const gem = new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), new THREE.MeshStandardMaterial({ color: 0xef4444 }));
                    gem.position.set(Math.cos(i*Math.PI/2)*0.9, 0.4, Math.sin(i*Math.PI/2)*0.9);
                    hatGroup.add(gem);
                }
                hatGroup.add(crown);
            }
            return hatGroup;
        }

        class Character {
            constructor(isPlayer, id, name, bodyColorHex, hatType, hatColorHex, headArmColorHex = '#ffab66', legColorHex = '#000000') {
                this.id = id;
                this.isPlayer = isPlayer;
                this.name = name;
                this.color = new THREE.Color(bodyColorHex);
                this.headArmColor = new THREE.Color(headArmColorHex);
                this.legColor = new THREE.Color(legColorHex);
                this.hatType = hatType;
                this.hatColorHex = hatColorHex;
                
                const spawnRange = (MAP_SIZE / 2) - 5;
                this.position = new THREE.Vector3((Math.random()-0.5)*spawnRange*2, 10, (Math.random()-0.5)*spawnRange*2);
                
                this.velocity = new THREE.Vector3(0,0,0);
                this.isOnGround = false;
                this.isDead = false;
                this.jumps = 0;
                
                this.squash = new THREE.Vector3(1, 1, 1);
                this.targetSquash = new THREE.Vector3(1, 1, 1);
                
                this.cannotPassTo = null;
                this.cannotPassTimer = 0;
                this.handedness = Math.random() > 0.5 ? 'left' : 'right';

                this.baseScale = 1.5;
                this.animOffset = Math.random() * Math.PI * 2;

                this.targetPos = new THREE.Vector3();
                this.stuckTimer = 0;
                this.lastPos = this.position.clone();

                this.buildMesh();
            }

            buildMesh() {
                this.mesh = new THREE.Group();
                const bodyMat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.4 });
                
                const eyeGeo = new THREE.SphereGeometry(0.3, 16, 16);
                eyeGeo.scale(1, 2, 0.4);
                const eyeMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
                this.leftEye = new THREE.Mesh(eyeGeo, eyeMat);
                this.rightEye = new THREE.Mesh(eyeGeo, eyeMat);

                if (isRobloxMode) {
                    this.robloxGroup = new THREE.Group();
                    this.robloxGroup.scale.setScalar(0.75); // Scaled up
                    this.robloxGroup.position.y = 0; // Adjusted grounding offset
                    this.limbs = {};
                    
                    const yOffset = -0.07;
                    
                    for (const key in R6_MODEL_DATA) {
                        const part = R6_MODEL_DATA[key];
                        let matColor;
                        if (part.type === 'torso') matColor = this.color;
                        else if (part.type === 'head' || part.type === 'arm') matColor = this.headArmColor;
                        else if (part.type === 'leg') matColor = this.legColor;
                        else matColor = new THREE.Color(part.color);
                        
                        const mat = new THREE.MeshStandardMaterial({ color: matColor, roughness: 0.4 });
                        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), mat);
                        mesh.scale.set(part.sx, part.sy, part.sz);
                        
                        const pivotGroup = new THREE.Group();
                        pivotGroup.position.set(part.px, part.py + yOffset, part.pz);
                        
                        if (part.type === 'arm') {
                            mesh.position.y = -part.sy / 2 + 0.2;
                            pivotGroup.position.y += part.sy / 2 - 0.2;
                            this.limbs[key] = pivotGroup;
                        } else if (part.type === 'leg') {
                            mesh.position.y = -part.sy / 2;
                            pivotGroup.position.y += part.sy / 2;
                            this.limbs[key] = pivotGroup;
                        } else if (part.type === 'head') {
                            this.headMesh = pivotGroup;
                            // Removed eyes for the Roblox model
                        }

                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        pivotGroup.add(mesh);
                        this.robloxGroup.add(pivotGroup);
                    }
                    
                    // Attach hands (for bomb passing)
                    this.leftHand = new THREE.Group();
                    this.leftHand.position.y = -0.8;
                    this.limbs['l_arm'].add(this.leftHand);
                    
                    this.rightHand = new THREE.Group();
                    this.rightHand.position.y = -0.8;
                    this.limbs['r_arm'].add(this.rightHand);

                    const myHat = buildHat(this.hatType, this.hatColorHex);
                    if (myHat) {
                        myHat.position.y = 0.55; 
                        this.headMesh.add(myHat);
                    }

                    this.mesh.add(this.robloxGroup);
                } else {
                    this.bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 2), bodyMat);
                    this.bodyMesh.position.y = 1; 
                    
                    this.leftEye.position.set(-0.4, 1.2, 1.05);
                    this.rightEye.position.set(0.4, 1.2, 1.05);
                    this.mesh.add(this.leftEye, this.rightEye);

                    const handGeo = new THREE.SphereGeometry(0.4, 16, 16);
                    this.leftHand = new THREE.Mesh(handGeo, bodyMat);
                    this.leftHand.position.set(-1.5, 1, 0);
                    this.rightHand = new THREE.Mesh(handGeo, bodyMat);
                    this.rightHand.position.set(1.5, 1, 0);
                    this.mesh.add(this.leftHand, this.rightHand);

                    const myHat = buildHat(this.hatType, this.hatColorHex);
                    if (myHat) {
                        myHat.position.y = 1;
                        this.bodyMesh.add(myHat);
                    }

                    this.mesh.add(this.bodyMesh);
                }
                
                this.mesh.traverse(child => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                    }
                });

                this.mesh.position.copy(this.position);
                scene.add(this.mesh);

                this.nametag = document.createElement('div');
                this.nametag.className = 'nametag';
                this.nametag.innerText = this.name;
                document.getElementById('nametags-container').appendChild(this.nametag);
            }

            update(dt, time, isIntro = false) {
                if(this.isDead) return;

                if (isRobloxMode && this.limbs) {
                    if (!this.isOnGround) {
                        this.limbs['l_arm'].rotation.x = Math.PI; 
                        this.limbs['r_arm'].rotation.x = Math.PI;
                        this.limbs['l_leg'].rotation.x = 0;
                        this.limbs['r_leg'].rotation.x = 0;
                    } else if (Math.abs(this.velocity.x) > 1 || Math.abs(this.velocity.z) > 1) {
                        const walkCycle = Math.sin(time * 15);
                        this.limbs['l_arm'].rotation.x = walkCycle * 0.8;
                        this.limbs['r_arm'].rotation.x = -walkCycle * 0.8;
                        this.limbs['l_leg'].rotation.x = -walkCycle * 0.8;
                        this.limbs['r_leg'].rotation.x = walkCycle * 0.8;
                    } else {
                        this.limbs['l_arm'].rotation.x = 0;
                        this.limbs['r_arm'].rotation.x = 0;
                        this.limbs['l_leg'].rotation.x = 0;
                        this.limbs['r_leg'].rotation.x = 0;
                    }
                } else {
                    this.leftHand.position.y = 1 + Math.sin(time * 5 + this.animOffset) * 0.2;
                    this.rightHand.position.y = 1 + Math.sin(time * 5 + this.animOffset + Math.PI) * 0.2;
                }

                if(this.cannotPassTimer > 0) this.cannotPassTimer -= dt;

                let wasOnGround = this.isOnGround;

                this.prevY = this.position.y;
                this.velocity.y += GRAVITY * dt;
                
                this.position.x += this.velocity.x * dt;
                this.position.z += this.velocity.z * dt;

                const limit = MAP_SIZE/2 - 1;
                if(this.position.x < -limit) this.position.x = -limit;
                if(this.position.x > limit) this.position.x = limit;
                if(this.position.z < -limit) this.position.z = -limit;
                if(this.position.z > limit) this.position.z = limit;

                this.resolveCharacterCollisionXZ();

                this.position.y += this.velocity.y * dt;
                this.isOnGround = false;

                if (this.position.y <= 0) {
                    if(this.velocity.y < -5) playSound('land');
                    this.position.y = 0;
                    this.velocity.y = 0;
                    this.isOnGround = true;
                }

                const myBox = new THREE.Box3().setFromCenterAndSize(
                    new THREE.Vector3(this.position.x, this.position.y + 1 * this.baseScale, this.position.z),
                    new THREE.Vector3(2 * this.baseScale, 2 * this.baseScale, 2 * this.baseScale)
                );
                
                for(let p of platforms) {
                    if(myBox.intersectsBox(p.box)) {
                        if (this.prevY >= p.topY - 0.05 && this.velocity.y <= 0) {
                            if(this.velocity.y < -5) playSound('land');
                            this.position.y = p.topY;
                            this.velocity.y = 0;
                            this.isOnGround = true;
                        } else {
                            // Physics Edge Climbing
                            const toCenter = new THREE.Vector2(p.mesh.position.x - this.position.x, p.mesh.position.z - this.position.z);
                            const vel2D = new THREE.Vector2(this.velocity.x, this.velocity.z);
                            if (vel2D.lengthSq() > 0.1 && toCenter.dot(vel2D) > 0) {
                                this.velocity.y = 12; // Snap/Climb upwards
                                this.isOnGround = false;
                            }
                        }
                    }
                }

                this.resolveCharacterCollisionY();

                if (this.isOnGround) {
                    this.jumps = 0;
                    if (!wasOnGround && this.velocity.y < -5) {
                        this.squash.set(1.5, 0.5, 1.5);
                    }
                    this.targetSquash.set(1, 1, 1);
                } else {
                    let stretch = Math.max(1, 1 + Math.abs(this.velocity.y) * 0.015);
                    let sq = 1 / Math.sqrt(stretch);
                    this.targetSquash.set(sq, stretch, sq);
                }

                this.squash.lerp(this.targetSquash, dt * 15);
                this.mesh.scale.set(this.squash.x * this.baseScale, this.squash.y * this.baseScale, this.squash.z * this.baseScale);

                this.velocity.x *= 0.8;
                this.velocity.z *= 0.8;

                this.mesh.position.copy(this.position);

                if(!this.isPlayer && !isIntro) {
                    this.runAI(dt, time);

                    if(this.position.distanceToSquared(this.lastPos) < 0.001) {
                        this.stuckTimer += dt;
                        if(this.stuckTimer > 0.3) { 
                            if(this.jumps < maxAllowedJumps) this.jump();
                            this.stuckTimer = 0;
                        }
                    } else {
                        this.stuckTimer = 0;
                    }
                }
                this.lastPos.copy(this.position);

                if(isIntro) {
                    this.velocity.x = 0;
                    this.velocity.z = 0;
                }

                if (this.isPlayer && !isIntro) {
                    this.mesh.rotation.y = camYaw + Math.PI;
                } else if(Math.abs(this.velocity.x) > 0.1 || Math.abs(this.velocity.z) > 0.1) {
                    const angle = Math.atan2(this.velocity.x, this.velocity.z);
                    this.mesh.rotation.y = angle;
                } else if (isIntro) {
                    this.mesh.rotation.y = 0; 
                }
            }

            resolveCharacterCollisionXZ() {
                const collisionRad = 1.0 * this.baseScale;
                const minDistSq = (collisionRad * 2) * (collisionRad * 2);

                for(let other of players) {
                    if(other === this || other.isDead) continue;
                    const dx = this.position.x - other.position.x;
                    const dz = this.position.z - other.position.z;
                    const distSq = dx*dx + dz*dz;
                    const dy = Math.abs(this.position.y - other.position.y);
                    
                    if(distSq < minDistSq && dy < 1.8 * this.baseScale) {
                        const dist = Math.sqrt(distSq);
                        if(dist === 0) continue;
                        const push = ((collisionRad * 2) - dist) / 2;
                        this.position.x += (dx/dist) * push;
                        this.position.z += (dz/dist) * push;
                    }
                }
            }

            resolveCharacterCollisionY() {
                const collisionRad = 1.0 * this.baseScale;
                for(let other of players) {
                    if(other === this || other.isDead) continue;
                    const dx = this.position.x - other.position.x;
                    const dz = this.position.z - other.position.z;
                    
                    if(dx*dx + dz*dz < (collisionRad * 2) * (collisionRad * 2)) {
                        const otherTop = other.position.y + (2.0 * other.baseScale);
                        if(this.prevY >= otherTop - 0.1 && this.position.y < otherTop && this.velocity.y <= 0) {
                            this.position.y = otherTop;
                            this.velocity.y = 0;
                            this.isOnGround = true;
                        }
                    }
                }
            }

            jump() {
                if(this.isOnGround) {
                    this.velocity.y = JUMP_FORCE;
                    this.jumps = 1;
                    playSound('jump');
                    this.squash.set(0.6, 1.5, 0.6);
                } else if (this.jumps < maxAllowedJumps) {
                    this.velocity.y = JUMP_FORCE;
                    this.jumps++; 
                    playSound('jump');
                    this.squash.set(0.6, 1.5, 0.6);
                }
            }

            runAI(dt, time) {
                let moveDir = new THREE.Vector3();

                if (!bombHolder) {
                    let tooClose = false;
                    for (let p of players) {
                        if (p !== this && !p.isDead) {
                            let distSq = this.position.distanceToSquared(p.position);
                            if (distSq < 300) { 
                                let awayP = new THREE.Vector3().subVectors(this.position, p.position);
                                awayP.y = 0;
                                moveDir.add(awayP.normalize());
                                tooClose = true;
                            }
                        }
                    }

                    if (tooClose) {
                        const wallMargin = 15;
                        const limit = MAP_SIZE / 2;
                        if (this.position.x < -limit + wallMargin) moveDir.x += (wallMargin - (this.position.x - -limit)) * 0.15;
                        if (this.position.x > limit - wallMargin) moveDir.x -= (wallMargin - (limit - this.position.x)) * 0.15;
                        if (this.position.z < -limit + wallMargin) moveDir.z += (wallMargin - (this.position.z - -limit)) * 0.15;
                        if (this.position.z > limit - wallMargin) moveDir.z -= (wallMargin - (limit - this.position.z)) * 0.15;

                        moveDir.normalize();
                        
                        this.velocity.x += moveDir.x * MOVE_SPEED * dt * 4;
                        this.velocity.z += moveDir.z * MOVE_SPEED * dt * 4;
                    }
                } else {
                    let target = null;
                    const distToBombSq = this.position.distanceToSquared(bombHolder.position);
                    const distToBomb = Math.sqrt(distToBombSq);

                    if (bombHolder === this) {
                        let minDist = Infinity;
                        for(let p of players) {
                            if(p === this || p.isDead || this.cannotPassTo === p) continue;
                            const dist = this.position.distanceToSquared(p.position);
                            if(dist < minDist) {
                                minDist = dist;
                                target = p;
                            }
                        }
                        if(target) {
                            let predictedTargetPos = target.position.clone().addScaledVector(target.velocity, 0.4);
                            let dx = predictedTargetPos.x - this.position.x;
                            let dz = predictedTargetPos.z - this.position.z;
                            let dy = predictedTargetPos.y - this.position.y;
                            let distXZSq = dx*dx + dz*dz;

                            if (dy > 3 && distXZSq < 35) {
                                let bestPlatform = null;
                                let bestScore = -Infinity;
                                
                                for (let p of platforms) {
                                    let pdy = p.topY - this.position.y;
                                    if (pdy > 1 && pdy < 11) {
                                        let pdx = p.mesh.position.x - this.position.x;
                                        let pdz = p.mesh.position.z - this.position.z;
                                        let pDistSq = pdx*pdx + pdz*pdz;
                                        
                                        let tdx = p.mesh.position.x - predictedTargetPos.x;
                                        let tdz = p.mesh.position.z - predictedTargetPos.z;
                                        let tDistSq = tdx*tdx + tdz*tdz;

                                        if (tDistSq > 20) { 
                                            let score = -pDistSq + (pdy * 20);
                                            if (score > bestScore) {
                                                bestScore = score;
                                                bestPlatform = p.mesh.position;
                                            }
                                        }
                                    }
                                }

                                if (bestPlatform) {
                                    moveDir.subVectors(bestPlatform, this.position);
                                } else {
                                    moveDir.set(-dx, 0, -dz);
                                    if (moveDir.lengthSq() < 0.1) moveDir.set(Math.sin(time*3 + this.animOffset), 0, Math.cos(time*3 + this.animOffset));
                                }
                                if (Math.random() < 0.05) this.jump();
                            } else {
                                moveDir.subVectors(predictedTargetPos, this.position);
                                if (dy > 1.5 && distXZSq < 100 && Math.random() < 0.05) this.jump();
                            }
                            moveDir.y = 0;
                            moveDir.normalize();
                        }
                    } else {
                        const panicThreshold = 5.0;
                        let isPanicking = bombTimer < panicThreshold || distToBomb < 14;
                        let isTeasing = !isPanicking && distToBomb > 15 && distToBomb < 30;
                        
                        if (isTeasing) {
                            moveDir.subVectors(bombHolder.position, this.position).normalize();
                            let tempX = moveDir.x; moveDir.x = -moveDir.z; moveDir.z = tempX;
                            if (Math.sin(time * 2.5 + this.animOffset) > 0) moveDir.negate();
                            if (Math.random() < 0.015) this.jump();
                        } else {
                            let dirFromBomb = new THREE.Vector3().subVectors(this.position, bombHolder.position);
                            dirFromBomb.y = 0;
                            dirFromBomb.normalize();

                            const wallMargin = 15;
                            const limit = MAP_SIZE / 2;
                            let wallForce = new THREE.Vector3();
                            if (this.position.x < -limit + wallMargin) wallForce.x += (wallMargin - (this.position.x - -limit)) * 0.3;
                            if (this.position.x > limit - wallMargin) wallForce.x -= (wallMargin - (limit - this.position.x)) * 0.3;
                            if (this.position.z < -limit + wallMargin) wallForce.z += (wallMargin - (this.position.z - -limit)) * 0.3;
                            if (this.position.z > limit - wallMargin) wallForce.z -= (wallMargin - (limit - this.position.z)) * 0.3;
                            
                            if (wallForce.lengthSq() > 0.5 && dirFromBomb.dot(wallForce) < -0.2) {
                                let strafe = new THREE.Vector3(-dirFromBomb.z, 0, dirFromBomb.x);
                                if (strafe.dot(this.position) > 0) strafe.negate(); 
                                moveDir.addScaledVector(strafe, 1.5);
                                if (Math.random() < 0.05) this.jump();
                            } else {
                                moveDir.copy(dirFromBomb); 
                            }
                            
                            moveDir.add(wallForce); 
                            moveDir.normalize();
                        }
                    }

                    this.velocity.x += moveDir.x * MOVE_SPEED * dt * 5;
                    this.velocity.z += moveDir.z * MOVE_SPEED * dt * 5;
                }

                let intentDir = moveDir.clone();
                if (intentDir.lengthSq() === 0) intentDir.set(this.velocity.x, 0, this.velocity.z);
                intentDir.normalize();
                
                if (intentDir.lengthSq() > 0.1) {
                    let lookAheadX = this.position.x + intentDir.x * 3.0;
                    let lookAheadZ = this.position.z + intentDir.z * 3.0;

                    for (let p of platforms) {
                        let px = p.mesh.position.x;
                        let pz = p.mesh.position.z;
                        let dx = px - lookAheadX;
                        let dz = pz - lookAheadZ;
                        
                        if (dx*dx + dz*dz < 25) {
                            if (p.topY > this.position.y + 0.2 && p.topY < this.position.y + 11) {
                                if (this.isOnGround && Math.random() < 0.2) {
                                    this.jump();
                                } else if (this.jumps < maxAllowedJumps && this.velocity.y < 3 && p.topY > this.position.y + 2 && Math.random() < 0.15) {
                                    this.jump();
                                }
                            }
                        }
                    }
                }
            }

            explode() {
                this.isDead = true;
                scene.remove(this.mesh);
                if (this.nametag) this.nametag.remove();
                playSound('explode');
                
                if (spectateTarget === this) spectateTarget = null;
                
                const pieces = 15;
                for(let i=0; i<pieces; i++) {
                    const size = (0.5 + Math.random() * 0.5) * this.baseScale;
                    const geo = new THREE.BoxGeometry(size, size, size);
                    const mat = new THREE.MeshStandardMaterial({ color: this.color, roughness: 0.5 });
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.copy(this.position);
                    mesh.position.y += 1 + Math.random();
                    scene.add(mesh);

                    const shape = new CANNON.Box(new CANNON.Vec3(size/2, size/2, size/2));
                    const body = new CANNON.Body({ mass: 1, shape: shape });
                    body.position.copy(mesh.position);
                    body.velocity.set((Math.random()-0.5)*30, 10 + Math.random()*20, (Math.random()-0.5)*30);
                    body.angularVelocity.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
                    physicsWorld.addBody(body);
                    debris.push({ mesh, body, timer: 3.0 });
                }
            }
        }

        function assignBombToRandom() {
            if(players.length === 0) return;
            const target = players[Math.floor(Math.random() * players.length)];

            lastTickInt = Math.ceil(bombTimer);

        function passBombTo(newHolder, oldHolder) {
            bombHolder = newHolder;
            globalPassCooldown = 0.5;
            if(oldHolder) {
                newHolder.cannotPassTo = oldHolder;
                newHolder.cannotPassTimer = 3.0;
            }
            newHolder.handedness = Math.random() > 0.5 ? 'left' : 'right';
            if(newHolder.handedness === 'left') newHolder.leftHand.add(bombMesh);
            else newHolder.rightHand.add(bombMesh);
            bombMesh.position.set(0, 0, 0); 
        }

        function checkBombPassing() {
            if(globalPassCooldown > 0 || !bombHolder) return;
            
            // Pre-calculate bomb holder's full body bounding box if in roblox mode
            let holderBox = null;
            if (isRobloxMode && bombHolder.robloxGroup) {
                holderBox = new THREE.Box3().setFromObject(bombHolder.robloxGroup);
            }

            for (let i = 0; i < players.length; i++) {
                const p = players[i];
                
                // Skip if it's the bomb holder, dead, or on cooldown from just passing
                if (p === bombHolder || p.isDead) continue;
                if (bombHolder.cannotPassTo === p && bombHolder.cannotPassTimer > 0) continue;

                let isCollision = false;

                if (isRobloxMode && p.robloxGroup && holderBox) {
                    // Check if ANY body part (arms, legs, head, torso) touches via Bounding Box intersection
                    const pBox = new THREE.Box3().setFromObject(p.robloxGroup);
                    isCollision = holderBox.intersectsBox(pBox);
                } else {
                    // Standard distance check for non-Roblox mode
                    if (bombHolder.position.distanceTo(p.position) < 2.5 * (p.baseScale || 1.5)) {
                        isCollision = true;
                    }
                }

                if (isCollision) {
                    passBombTo(p, bombHolder);
                    return; // Stop checking once successfully passed
                }
            }
        }

        function updatePlayerInput(dt) {
            if(!myPlayer || myPlayer.isDead) return;
            
            const speed = MOVE_SPEED * dt * 5;
            
            const forward = new THREE.Vector3(Math.sin(camYaw), 0, Math.cos(camYaw));
            const right = new THREE.Vector3(forward.z, 0, -forward.x);

            let inputDir = new THREE.Vector3(0, 0, 0);

            if(keys.w) { inputDir.x -= forward.x; inputDir.z -= forward.z; }
            if(keys.s) { inputDir.x += forward.x; inputDir.z += forward.z; }
            if(keys.a) { inputDir.x -= right.x; inputDir.z -= right.z; }
            if(keys.d) { inputDir.x += right.x; inputDir.z += right.z; }

            if (inputDir.lengthSq() > 0) {
                inputDir.normalize();
                myPlayer.velocity.x += inputDir.x * speed;
                myPlayer.velocity.z += inputDir.z * speed;
            }

            if(keys.space) myPlayer.jump();
            keys.space = false;
        }

        function updateSpectatorCamera(dt) {
            const speed = MOVE_SPEED * 2 * dt;
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);
            const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();

            if(keys.w) camera.position.addScaledVector(dir, speed);
            if(keys.s) camera.position.addScaledVector(dir, -speed);
            if(keys.a) camera.position.addScaledVector(right, -speed);
            if(keys.d) camera.position.addScaledVector(right, speed);
            if(keys.e) camera.position.y += speed;
            if(keys.q) camera.position.y -= speed;

            camera.rotation.set(0,0,0);
            camera.rotateY(-camYaw);
            camera.rotateX(-camPitch);
        }

        function updateCamera() {
            let activeTarget = (gameMode === 'play') ? myPlayer : spectateTarget;

            if (activeTarget && !activeTarget.isDead) {
                const targetPos = activeTarget.position.clone();
                targetPos.y += 1 * (activeTarget.baseScale || 1.5);
                camera.position.x = targetPos.x + camZoom * Math.sin(camYaw) * Math.cos(camPitch);
                camera.position.y = targetPos.y + camZoom * Math.sin(camPitch);
                camera.position.z = targetPos.z + camZoom * Math.cos(camYaw) * Math.cos(camPitch);
                camera.lookAt(targetPos);
            }
        }

        function updateIntroCamera(dt, introTimer) {
            let activeTarget = (gameMode === 'play') ? myPlayer : spectateTarget;
            if(!activeTarget && players.length > 0) activeTarget = players[0];
            
            const INTRO_Y = 1000;
            
            if (introTimer < 4.0) {
                const N = players.length;
                const radius = Math.max(15, 10 + N * 1.5);
                const angle = -Math.PI/2 + (introTimer / 4.0) * (Math.PI * 2);
                camera.position.set(Math.sin(angle) * radius, INTRO_Y + 6 + radius*0.1, Math.cos(angle) * radius);
                camera.lookAt(0, INTRO_Y + 2, 0);
            } else {
                let t = (introTimer - 4.0) / 4.5;
                t = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; 
                
                let targetIdx = players.indexOf(activeTarget);
                if (targetIdx === -1) targetIdx = 0;
                
                let p1 = players[0].position.clone();
                let p2 = activeTarget.position.clone();
                
                let lookPos = new THREE.Vector3().lerpVectors(p1, p2, t);
                lookPos.y += 1 * (activeTarget.baseScale || 1.5);
                
                camera.position.set(lookPos.x, lookPos.y + 3, lookPos.z + 12 - (t * 5));
                camera.lookAt(lookPos);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.1);
            const time = clock.getElapsedTime();

            if (gameState === 'intro') {
                introTimer += dt;
                
                if (gameMode === 'spectate' && !spectateTarget && players.length > 0) {
                    spectateTarget = players[0];
                }

                players.forEach(p => p.update(dt, time, true));
                physicsWorld.step(dt);
                
                updateIntroCamera(dt, introTimer);
                updateUI();

                if (introTimer >= 8.5) {
                    gameState = 'playing';
                    const spawnRange = (MAP_SIZE / 2) - 5;
                    players.forEach(p => {
                        // Teleport into the main arena
                        p.position.set((Math.random()-0.5)*spawnRange*2, 10, (Math.random()-0.5)*spawnRange*2);
                        p.velocity.set(0,0,0);
                    });
                    
                    platforms.forEach(p => p.mesh.visible = true); // Unhide platforms after intro

                    assignBombToRandom();
                    document.getElementById('ui-mode-text').innerText = "WASD to Move | Mouse to Look | Scroll to Zoom | Click to Target (Spectator)";
                }
            }

            if (gameState === 'playing') {
                if (globalPassCooldown > 0) globalPassCooldown -= dt;

                if (gameMode === 'play') updatePlayerInput(dt);
                else if (gameMode === 'spectate' && !spectateTarget) updateSpectatorCamera(dt);

                players.forEach(p => p.update(dt, time));
                checkBombPassing();

                if (bombHolder) {
                    bombTimer -= dt;
                    const currentTickInt = Math.ceil(bombTimer);
                    if (currentTickInt !== lastTickInt && currentTickInt > 0) {
                        playSound('tick');
                        lastTickInt = currentTickInt;
                        if(bombMesh) {
                            const scale = 1 + (10 - bombTimer) * 0.05;
                            bombMesh.scale.set(scale, scale, scale);
                        }
                    }

                    if (bombTimer <= 0) {
                        let explodedPlayer = bombHolder;
                        explodedPlayer.explode();
                        players = players.filter(p => p !== explodedPlayer);
                        bombHolder = null;
                        
                        if(bombMesh) bombMesh.scale.set(1,1,1);
                        
                        if (explodedPlayer === myPlayer) {
                            gameState = 'gameover';
                            document.exitPointerLock();
                            document.getElementById('game-ui').classList.add('hidden');
                            document.getElementById('crosshair').style.display = 'none';
                            document.getElementById('game-over').classList.remove('hidden');
                            document.getElementById('game-over-title').innerText = "Game Over";
                            document.getElementById('game-over-desc').innerHTML = `<span style="color:#ef4444; font-size:2rem">You blew up!</span>`;
                            sounds.bgm.pause();
                        } else {
                            checkWinCondition();
                            if (players.length > 1) bombSpawnDelay = 3.0;
                        }
                    }
                }

                if (!bombHolder && players.length > 1) {
                    if (bombSpawnDelay > 0) {
                        bombSpawnDelay -= dt;
                        if (bombSpawnDelay <= 0) assignBombToRandom();
                    }
                }

                physicsWorld.step(dt);
                for (let i = debris.length - 1; i >= 0; i--) {
                    const d = debris[i];
                    d.mesh.position.copy(d.body.position);
                    d.mesh.quaternion.copy(d.body.quaternion);
                    d.timer -= dt;
                    if (d.timer <= 0) {
                        scene.remove(d.mesh);
                        physicsWorld.removeBody(d.body);
                        debris.splice(i, 1);
                    }
                }

                updateCamera();
                updateUI();
            }
            
            if (!document.getElementById('customize-menu').classList.contains('hidden') && previewGroup) {
                previewGroup.rotation.y += dt;
                previewRenderer.render(previewScene, previewCamera);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initScene();
        
        camera.position.set(0, 30, 40);
        camera.lookAt(0, 0, 0);
        camPitch = -0.5;

        animate();
    </script>
</body>
</html>
