<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cardboard Ragdoll</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://esm.sh/three@0.160.0",
      "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
      "cannon-es": "https://esm.sh/cannon-es@0.20.0"
    }
  }
  </script>

  <style>
    body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; touch-action: none; }
    /* Collapsible dark menu panel - centered near bottom */
    #menu-panel {
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      width: auto;
      height: auto;
      /* use a stacking context so the toggle can overlap the panel */
      display: block;
      pointer-events: none; /* outer container isn't interactive; inner elements control pointer-events */
    }
    /* Toggle button sits centered on top of the panel area so it remains visible when panel slides down */
    #menu-toggle {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      z-index: 14;
      pointer-events: auto;
      background: rgba(0,0,0,0.65);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.06);
      padding: 8px 10px;
      border-radius: 10px;
      font-weight:700;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
      transition: transform 140ms ease, background 140ms;
      font-size:13px;
    }
    #menu-toggle:hover { transform: translate(-50%,-3px); background: rgba(0,0,0,0.8); }

    /* actual inner container that slides up/down sits just above the toggle so the toggle overlaps it */
    #ui-panel {
      position: absolute;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      bottom: 56px; /* leave room for the toggle to overlap when open/closed */
      pointer-events: auto;
      background: rgba(10,10,10,0.88);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      transform-origin: bottom center;
      transition: transform 220ms cubic-bezier(.2,.9,.2,1), opacity 180ms ease;
      /* made wider to better fit more controls without wrapping */
      max-width: 1100px;
      min-width: 600px;
    }
    /* When closed slide the panel down slightly but not fully off-screen so the toggle remains visible */
    #ui-panel.closed { transform: translateX(-50%) translateY(44px) scale(0.98); opacity: 0; pointer-events: none; }
    #ui-panel.open { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; pointer-events: auto; }

    /* keep legacy #ui-container styling inside the panel */
    #ui-container { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; align-items:center; }
    button { padding:8px 12px; font-size:13px; font-weight:bold; color:white; background:#0078d7; border:2px solid #005a9e; border-radius:8px; cursor:pointer; box-shadow:0 3px 5px rgba(0,0,0,0.25); transition:all .1s; }
    button:hover { background:#1088e7; transform:translateY(-2px); } button:active { transform:translateY(2px); box-shadow:0 1px 2px rgba(0,0,0,0.3); }
    button.toggle-active { background:#28a745; border-color:#1e7e34; }
    #instructions { position:absolute; top:20px; left:20px; color:white; background:rgba(0,0,0,0.5); padding:15px; border-radius:8px; pointer-events:none; text-shadow:1px 1px 2px black; }
    .key-hint { color:#ffeb3b; font-weight:bold; }
  </style>
</head>
<body>
  <div id="instructions">
    <h3>Cardboard Ragdoll</h3>
    <p>• <b>Click + Drag</b> limbs to interact</p>
    <p>• <b>Right-Click</b> to orbit</p>
    <p>• <span class="key-hint">R</span> Stand/Ragdoll Toggle</p>
    <p id="freecam-hint" style="display:none;">• <span class="key-hint">WASD</span> Move | <span class="key-hint">Q/E</span> Up/Down</p>
  </div>

  <!-- Collapsible menu panel: toggle button + dark container that holds the UI -->
  <div id="menu-panel" aria-hidden="false">
    <button id="menu-toggle" aria-expanded="true">Menu ▴</button>
    <div id="ui-panel" class="open" role="region" aria-label="Controls">
      <!-- sectioned UI for easier discovery -->
      <div id="ui-container" style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;justify-content:center;">
        <div class="ui-section" style="min-width:220px;max-width:380px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);">
          <h4 style="margin:0 0 8px 0;font-size:13px;color:#ddd;font-weight:800;">Ragdoll</h4>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button id="btn-reset">Respawn</button>
            <button id="btn-rmode">RagDoll: R11 (Default)</button>
            <button id="btn-stand">Stand: OFF</button>
            <button id="btn-knock">Knock</button>
          </div>
        </div>

        <div class="ui-section" style="min-width:220px;max-width:380px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);">
          <h4 style="margin:0 0 8px 0;font-size:13px;color:#ddd;font-weight:800;">World & Physics</h4>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button id="btn-ice">Ice: OFF</button>
            <button id="btn-slow">Slow: OFF</button>
            
          </div>
        </div>

        <div class="ui-section" style="min-width:220px;max-width:380px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);">
          <h4 style="margin:0 0 8px 0;font-size:13px;color:#ddd;font-weight:800;">Launch & Spawn</h4>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button id="btn-explode">Super Launch</button>
            <button id="btn-ultra">Ultra Launch</button>
            <button id="btn-spawn">Spawn Cube</button>
          </div>
        </div>

        <div class="ui-section" style="min-width:220px;max-width:380px;padding:8px;border-radius:8px;background:rgba(255,255,255,0.02);">
          <h4 style="margin:0 0 8px 0;font-size:13px;color:#ddd;font-weight:800;">View & Session</h4>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <button id="btn-follow" class="toggle-active">Follow: ON</button>
            <button id="btn-pause">Pause</button>
          </div>
        </div>

        <!-- skin selector and any extra controls appended by JS still live in ui-container -->
      </div>

      <!-- compact helper to remind new users the panel is collapsible -->
      <div style="width:100%;text-align:center;margin-top:8px;color:rgba(255,255,255,0.5);font-size:12px;">Sections: Ragdoll • Physics • Launch • View</div>
    </div>
  </div>

  <!-- Pause menu modal -->
  <div id="pause-overlay" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;z-index:20;">
    <div id="pause-backdrop" style="position:absolute;inset:0;background:rgba(0,0,0,0.6)"></div>
    <div id="pause-menu" style="position:relative;width:320px;background:#fff;border-radius:12px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:21;">
      <h3 style="margin:0 0 10px 0;font-size:18px;">Paused</h3>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <button id="pause-resume" style="background:#0078d7;border:2px solid #005a9e;color:#fff;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;">Resume</button>
        <button id="pause-respawn" style="background:#28a745;border:2px solid #1e7e34;color:#fff;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;">Respawn ragdoll and resume</button>
        <button id="pause-meme" style="background:#e04a3f;border:2px solid #b9372b;color:#fff;padding:10px;border-radius:8px;font-weight:bold;cursor:pointer;">Watch meme made with this project</button>
        <button id="pause-close" style="background:#666;border:2px solid #444;color:#fff;padding:8px;border-radius:8px;cursor:pointer;">Close</button>
      </div>
    </div>
  </div>

  <!-- Meme viewer modal (hidden by default) -->
  <div id="meme-overlay" style="display:none;position:fixed;inset:0;align-items:center;justify-content:center;z-index:30;">
    <div id="meme-backdrop" style="position:absolute;inset:0;background:rgba(0,0,0,0.7)"></div>
    <div style="position:relative;width:min(920px,95%);height: min(600px,80%);background:#000;border-radius:12px;overflow:hidden;z-index:31;">
      <iframe id="meme-iframe" src="" style="width:100%;height:100%;border:0;" allow="autoplay; fullscreen; accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
      <button id="meme-close" style="position:absolute;top:8px;right:8px;background:rgba(255,255,255,0.12);border:0;padding:8px;border-radius:8px;color:#fff;cursor:pointer;">✕</button>
    </div>
  </div>

  <!-- Loading overlay -->
  <div id="loading-overlay" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111;color:#fff;z-index:50;">
    <div style="text-align:center;">
      <div style="width:84px;height:84px;border-radius:50%;border:8px solid rgba(255,255,255,0.08);border-top-color:#fff;animation:spin 1s linear infinite;margin:0 auto 12px;"></div>
      <div style="font-weight:700;letter-spacing:0.6px;">Loading...</div>
    </div>
  </div>

  <style>
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
