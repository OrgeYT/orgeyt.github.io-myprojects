<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rainbow Pop It</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Varela Round', sans-serif;
            background: var(--bg-grad, linear-gradient(135deg, #a8edea 0%, #fed6e3 100%));
            color: var(--text-color, #1f2937);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: pan-y; /* Prevent pull-to-refresh on mobile */
            transition: background 0.3s ease, color 0.3s ease;
        }

        body[data-theme="dark"] {
            --bg-grad: linear-gradient(135deg, #1f2937 0%, #111827 100%);
            --text-color: #f9fafb;
            --container-bg: #1f2937;
            --container-border: #374151;
            --container-shadow-light: rgba(255,255,255,0.5);
            --modal-bg: #1f2937;
            --modal-text: #f9fafb;
            --modal-text-muted: #9ca3af;
        }

        body[data-theme="dark-orange"] {
            --bg-grad: linear-gradient(135deg, #7c2d12 0%, #431407 100%);
            --text-color: #ffedd5;
            --container-bg: #431407;
            --container-border: #9a3412;
            --container-shadow-light: rgba(255,255,255,0.5);
            --modal-bg: #431407;
            --modal-text: #ffedd5;
            --modal-text-muted: #fdba74;
        }

        #popit-container {
            /* This prevents the page from scrolling while user is dragging over the Pop It on touch devices */
            touch-action: none;
            background-color: var(--container-bg, #f8fafc);
            border-radius: 2rem;
            padding: 1.5rem;
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.1),
                inset 0 -5px 15px rgba(0,0,0,0.05),
                inset 0 5px 15px var(--container-shadow-light, rgba(255,255,255,0.8));
            border: 4px solid var(--container-border, #e2e8f0);
            display: inline-grid;
            gap: var(--popit-gap, 12px);
            transition: all 0.3s ease;
        }

        .bubble {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            /* The color will be set dynamically via JS, but we use it in gradients */
            background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.6) 0%, var(--bubble-color) 40%, rgba(0,0,0,0.1) 100%);
            box-shadow: 
                -2px -2px 6px rgba(255,255,255,0.6),
                4px 4px 8px rgba(0,0,0,0.2),
                inset -2px -2px 5px rgba(0,0,0,0.1),
                inset 2px 2px 5px rgba(255,255,255,0.4);
            transition: transform 0.08s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.08s ease, filter 0.08s ease;
            filter: brightness(1);
        }

        @media (max-width: 600px) {
            .bubble {
                width: 40px;
                height: 40px;
            }
            #popit-container {
                gap: 8px;
                padding: 1rem;
            }
        }

        .bubble.popped {
            /* Invert the shadows to look pressed in and apply brightness(0.5) to make it 50% darker */
            background: radial-gradient(circle at 65% 65%, rgba(255,255,255,0.3) 0%, var(--bubble-color) 60%, rgba(0,0,0,0.2) 100%);
            box-shadow: 
                inset 4px 4px 10px rgba(0,0,0,0.4),
                inset -3px -3px 8px rgba(255,255,255,0.3),
                1px 1px 2px rgba(255,255,255,0.5);
            transform: scale(0.92) translateY(2px);
            filter: brightness(0.5); /* 50% darker dynamic color */
        }

        /* Modal transitions */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center py-10 transition-colors duration-300">

    <header class="text-center mb-6">
        <h1 class="text-5xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-yellow-400 to-purple-500 drop-shadow-sm mb-4">
            Pop It!
        </h1>
        <div class="flex gap-4 justify-center">
            <button id="btn-flip" class="bg-white hover:bg-gray-50 text-gray-700 font-bold py-2 px-6 rounded-full shadow-md transition-transform hover:scale-105 active:scale-95 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"></path><path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path><path d="M3 22v-6h6"></path><path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg>
                Flip & Reset
            </button>
            <button id="btn-settings" class="bg-white hover:bg-gray-50 text-gray-700 font-bold py-2 px-6 rounded-full shadow-md transition-transform hover:scale-105 active:scale-95 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                Settings
            </button>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4 w-full">
        <div id="popit-container">
            <!-- Bubbles injected here via JS -->
        </div>
    </main>
    
    <p class="mt-8 text-sm font-medium opacity-75" style="color: var(--modal-text-muted, #6b7280);">Click and drag to pop multiple bubbles!</p>

    <div id="settings-modal" class="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center hidden z-50 transition-opacity backdrop-blur-sm">
        <div class="rounded-3xl p-8 max-w-sm w-full mx-4 shadow-2xl transform transition-transform scale-95" id="modal-content" style="background-color: var(--modal-bg, #ffffff);">
            <h2 class="text-2xl font-bold mb-6 text-center" style="color: var(--modal-text, #1f2937);">Customize Pop It</h2>
            
            <div class="mb-5">
                <label class="block font-bold mb-2 flex justify-between" style="color: var(--modal-text, #374151);">
                    <span>Grid Size</span>
                    <span id="size-display" class="text-blue-500">6 x 6</span>
                </label>
                <input type="range" id="size-slider" min="2" max="24" value="6" class="w-full h-3 rounded-lg appearance-none cursor-pointer accent-blue-500" style="background-color: rgba(156, 163, 175, 0.3);">
                <p class="text-xs mt-2" style="color: var(--modal-text-muted, #9ca3af);">Adjusting size will reset the board.</p>
            </div>

            <div class="mb-5">
                <label class="block font-bold mb-2 flex justify-between" style="color: var(--modal-text, #374151);">
                    <span>Bubble Spacing</span>
                    <span id="spacing-display" class="text-blue-500">12px</span>
                </label>
                <input type="range" id="spacing-slider" min="0" max="30" value="12" class="w-full h-3 rounded-lg appearance-none cursor-pointer accent-blue-500" style="background-color: rgba(156, 163, 175, 0.3);">
            </div>

            <div class="mb-5">
                <label class="block font-bold mb-2" style="color: var(--modal-text, #374151);">
                    <span>Bubble Colors</span>
                </label>
                <select id="color-select" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" style="background-color: var(--container-bg, #ffffff); color: var(--modal-text, #1f2937); border-color: var(--container-border, #d1d5db);">
                    <option value="default">Default (Rainbow)</option>
                    <option value="space">Space</option>
                    <option value="fire">Fire</option>
                    <option value="cold">Cold</option>
                    <option value="grass">Grass</option>
                    <option value="cute">Cute (Pink)</option>
                    <option value="gemini">Gemini</option>
                </select>
            </div>

            <div class="mb-6">
                <label class="block font-bold mb-2" style="color: var(--modal-text, #374151);">
                    <span>Theme</span>
                </label>
                <select id="theme-select" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" style="background-color: var(--container-bg, #ffffff); color: var(--modal-text, #1f2937); border-color: var(--container-border, #d1d5db);">
                    <option value="light">Light (Default)</option>
                    <option value="dark">Dark</option>
                    <option value="dark-orange">Dark Orange</option>
                </select>
            </div>

            <button id="btn-close-settings" class="w-full bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-transform hover:scale-105 active:scale-95">
                Apply & Play
            </button>
        </div>
    </div>

    <script>
        // --- Audio System ---
        const audioUrls = [
            "https://file.garden/Zj01o_oh-G9Y8APf/pop/Pop1.wav",
            "https://file.garden/Zj01o_oh-G9Y8APf/pop/Pop2.wav",
            "https://file.garden/Zj01o_oh-G9Y8APf/pop/Pop3.wav",
            "https://file.garden/Zj01o_oh-G9Y8APf/pop/Pop4.wav",
            "https://file.garden/Zj01o_oh-G9Y8APf/pop/Pop5.wav"
        ];
        
        // Preload audios
        const audioPool = audioUrls.map(url => {
            const audio = new Audio(url);
            audio.preload = 'auto';
            return audio;
        });

        function playPopSound() {
            // Pick a random pop sound from the 5 available
            const randomIndex = Math.floor(Math.random() * audioPool.length);
            const sound = audioPool[randomIndex].cloneNode();
            sound.volume = 0.7; // Not too loud
            // Catch error in case browser blocks autoplay before user interaction
            sound.play().catch(e => console.log('Audio requires interaction first'));
        }

        // --- Game State ---
        const container = document.getElementById('popit-container');
        let gridSize = 6;
        
        // Color palettes for different styles
        const palettes = {
            default: ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899', '#14b8a6'], // Rainbow
            space: ['#1e1b4b', '#312e81', '#4c1d95', '#581c87', '#701a75', '#0f172a'],
            fire: ['#7f1d1d', '#991b1b', '#b91c1c', '#dc2626', '#ef4444', '#f87171', '#fca5a5', '#fef08a'],
            cold: ['#082f49', '#0369a1', '#0284c7', '#38bdf8', '#7dd3fc', '#bae6fd', '#e0f2fe'],
            grass: ['#14532d', '#166534', '#15803d', '#16a34a', '#22c55e', '#4ade80', '#86efac'],
            cute: ['#831843', '#be185d', '#db2777', '#f472b6', '#f9a8d4', '#fbcfe8', '#fdf2f8'],
            gemini: ['#ea4335', '#4285f4', '#34a853', '#fbbc05'] // Red, Blue, Green, Yellow
        };
        let currentPalette = 'default';

        // Dragging state
        let isDragging = false;
        // 'pop' means the current drag stroke is popping bubbles.
        // 'unpop' means the current drag stroke is unpopping bubbles.
        let dragAction = 'pop'; 
        let lastX = null;
        let lastY = null;

        // --- STREAMING_CHUNK:Generating the Pop It Grid... ---
        function renderPopIt() {
            container.innerHTML = '';
            
            // Set dynamic grid columns based on size
            container.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            
            const activeColors = palettes[currentPalette];

            for (let row = 0; row < gridSize; row++) {
                // Pick a color for the row, repeating the palette if needed
                const rowColor = activeColors[row % activeColors.length];
                
                for (let col = 0; col < gridSize; col++) {
                    const bubble = document.createElement('div');
                    bubble.classList.add('bubble');
                    // Set custom CSS variable so the gradients work with the specific color
                    bubble.style.setProperty('--bubble-color', rowColor);
                    
                    // Attach interaction events
                    setupBubbleEvents(bubble);
                    
                    container.appendChild(bubble);
                }
            }
        }

        // --- STREAMING_CHUNK:Handling Mouse and Touch Interactions... ---
        function handleBubbleInteraction(bubble) {
            const isPopped = bubble.classList.contains('popped');
            
            if (dragAction === 'pop' && !isPopped) {
                bubble.classList.add('popped');
                playPopSound();
            } else if (dragAction === 'unpop' && isPopped) {
                bubble.classList.remove('popped');
                playPopSound();
            }
        }

        function setupBubbleEvents(bubble) {
            // Mouse Events
            bubble.addEventListener('mousedown', (e) => {
                e.preventDefault(); // Prevent default text selection/dragging
                isDragging = true;
                // Determine the action for this whole drag stroke based on the FIRST bubble clicked
                dragAction = bubble.classList.contains('popped') ? 'unpop' : 'pop';
                handleBubbleInteraction(bubble);
                lastX = e.clientX;
                lastY = e.clientY;
            });

            // Touch Events (Start of touch is tracked globally or on bubble)
            bubble.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent scrolling
                isDragging = true;
                dragAction = bubble.classList.contains('popped') ? 'unpop' : 'pop';
                handleBubbleInteraction(bubble);
                lastX = e.touches[0].clientX;
                lastY = e.touches[0].clientY;
            }, { passive: false });
        }

        // --- STREAMING_CHUNK:Setting up Global Event Listeners for dragging... ---
        // Stop dragging when mouse or touch goes up anywhere on the screen
        window.addEventListener('mouseup', () => {
            isDragging = false;
            lastX = null;
            lastY = null;
        });
        window.addEventListener('touchend', () => {
            isDragging = false;
            lastX = null;
            lastY = null;
        });
        
        // Handle dragging across multiple bubbles with interpolation to prevent fast-swipe skipping
        function handlePointerMove(e) {
            if (!isDragging) return;
            
            if (e.cancelable && e.type === 'touchmove') {
                e.preventDefault(); // Prevent scrolling while playing
            }
            
            let currentX, currentY;
            if (e.type === 'touchmove') {
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
            } else {
                currentX = e.clientX;
                currentY = e.clientY;
            }

            if (lastX !== null && lastY !== null) {
                // Interpolate points between last position and current position
                // This ensures we don't skip bubbles when moving the mouse very fast!
                const dx = currentX - lastX;
                const dy = currentY - lastY;
                const distance = Math.hypot(dx, dy);
                const stepCount = Math.max(1, Math.ceil(distance / 10)); // Check every 10 pixels

                for (let i = 1; i <= stepCount; i++) {
                    const x = lastX + (dx * (i / stepCount));
                    const y = lastY + (dy * (i / stepCount));
                    const element = document.elementFromPoint(x, y);
                    if (element && element.classList.contains('bubble')) {
                        handleBubbleInteraction(element);
                    }
                }
            } else {
                // Fallback if lastX/lastY were null
                const element = document.elementFromPoint(currentX, currentY);
                if (element && element.classList.contains('bubble')) {
                    handleBubbleInteraction(element);
                }
            }

            lastX = currentX;
            lastY = currentY;
        }

        window.addEventListener('mousemove', handlePointerMove);
        window.addEventListener('touchmove', handlePointerMove, { passive: false });

        // --- STREAMING_CHUNK:Setting up UI Controls (Flip and Settings)... ---
        const btnFlip = document.getElementById('btn-flip');
        btnFlip.addEventListener('click', () => {
            const bubbles = document.querySelectorAll('.bubble');
            bubbles.forEach(b => b.classList.remove('popped'));
        });

        // Settings Logic
        const modal = document.getElementById('settings-modal');
        const modalContent = document.getElementById('modal-content');
        const btnSettings = document.getElementById('btn-settings');
        const btnCloseSettings = document.getElementById('btn-close-settings');
        const sizeSlider = document.getElementById('size-slider');
        const sizeDisplay = document.getElementById('size-display');
        const spacingSlider = document.getElementById('spacing-slider');
        const spacingDisplay = document.getElementById('spacing-display');
        const colorSelect = document.getElementById('color-select');
        const themeSelect = document.getElementById('theme-select');

        function openModal() {
            modal.classList.remove('hidden');
            // Trigger animation frame delay to allow display block to apply before animating opacity
            requestAnimationFrame(() => {
                modalContent.classList.add('scale-100');
                modalContent.classList.remove('scale-95');
            });
        }

        function closeModal() {
            modalContent.classList.add('scale-95');
            modalContent.classList.remove('scale-100');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200); // Wait for transition
        }

        btnSettings.addEventListener('click', openModal);
        
        btnCloseSettings.addEventListener('click', () => {
            closeModal();
            const newSize = parseInt(sizeSlider.value);
            const newPalette = colorSelect.value;
            
            if (newSize !== gridSize || newPalette !== currentPalette) {
                gridSize = newSize;
                currentPalette = newPalette;
                renderPopIt();
            }
        });

        sizeSlider.addEventListener('input', (e) => {
            sizeDisplay.textContent = `${e.target.value} x ${e.target.value}`;
        });

        spacingSlider.addEventListener('input', (e) => {
            const gapVal = e.target.value;
            spacingDisplay.textContent = `${gapVal}px`;
            container.style.setProperty('--popit-gap', `${gapVal}px`);
        });

        themeSelect.addEventListener('change', (e) => {
            document.body.setAttribute('data-theme', e.target.value);
        });

        // Initial render
        renderPopIt();

    </script>
</body>
</html>
