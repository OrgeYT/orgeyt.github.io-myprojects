<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Emoji Builder</title>
<style>
  :root {
    --bg: #0e0e11;
    --surface: #16161a;
    --raised: #1c1c22;
    --border: #2a2a32;
    --text: #eeeef2;
    --muted: #888896;
    --accent: #7c6af0;
    --success: #3ecf8e;
    --r: 8px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    max-width: 100%;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 14px;
    line-height: 1.4;
  }

  .app {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
    height: 100vh;
    height: 100dvh;
    max-width: 100%;
  }

  @media (max-width: 800px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      overflow: auto;
      height: auto;
      min-height: 100dvh;
    }
    html, body { overflow: auto; height: auto; min-height: 100%; }
  }

  .stage {
    display: flex;
    flex-direction: column;
    background: #0a0a0c;
    border-right: 1px solid var(--border);
    min-width: 0;
    min-height: 0;
  }

  @media (max-width: 800px) {
    .stage {
      border-right: none;
      border-bottom: 1px solid var(--border);
      min-height: 180px;
    }
  }

  .stage-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .stage-top h1 {
    font-size: 14px;
    font-weight: 650;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .stage-actions {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }

  .btn {
    height: 32px;
    padding: 0 12px;
    border: none;
    border-radius: var(--r);
    background: var(--raised);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn:hover { background: #282830; }
  .btn-main { background: var(--accent); }
  .btn-main:hover { background: #6a58e0; }
  .btn-ok { background: var(--success); color: #0a0a0d; }

  .stage-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    min-height: 0;
    overflow: auto;
  }

  .preview {
    width: 100%;
    max-width: 100%;
    text-align: center;
    font-size: clamp(2.2rem, 7vw, 4.5rem);
    line-height: 1.25;
    word-break: break-all;
    overflow-wrap: anywhere;
    user-select: all;
    padding: 12px;
  }

  .tools {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background: var(--bg);
    overflow: hidden;
  }

  .tools-scroll {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px;
    -webkit-overflow-scrolling: touch;
  }

  .block { margin-bottom: 18px; }
  .block:last-child { margin-bottom: 8px; }

  .block-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 10px;
  }
  @media (max-width: 480px) {
    .row { grid-template-columns: minmax(0, 1fr); }
  }

  .field { min-width: 0; max-width: 100%; }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #b0b0bc;
    margin-bottom: 4px;
  }

  input[type="text"],
  select {
    width: 100%;
    max-width: 100%;
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--r);
    background: var(--raised);
    color: var(--text);
    font-size: 14px;
    outline: none;
  }
  input[type="text"] {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
  }
  input[type="text"]:focus,
  select:focus { border-color: var(--accent); }

  .seg {
    display: flex;
    background: var(--raised);
    border: 1px solid var(--border);
    border-radius: var(--r);
    overflow: hidden;
    max-width: 100%;
  }
  .seg button {
    flex: 1;
    min-width: 0;
    height: 32px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    padding: 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button.on {
    background: var(--accent);
    color: #fff;
  }

  .chips {
    display: flex;
    gap: 4px;
    margin-top: 6px;
    overflow-x: auto;
    max-width: 100%;
    padding-bottom: 2px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .chips::-webkit-scrollbar { height: 4px; }
  .chips::-webkit-scrollbar-thumb {
    background: var(--border);
    border-radius: 4px;
  }
  .chip {
    flex: 0 0 auto;
    height: 28px;
    min-width: 28px;
    padding: 0 8px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
    line-height: 26px;
    text-align: center;
  }
  .chip:hover {
    border-color: #555;
    background: #25252e;
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-width: 100%;
  }
  .preset {
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: var(--r);
    background: var(--raised);
    color: var(--text);
    font-size: 14px;
    cursor: pointer;
  }
  .preset:hover { background: #25252e; }

  .note {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(12px);
    background: var(--success);
    color: #0a0a0d;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: 0.2s;
    z-index: 50;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="app">

  <aside class="stage">
    <div class="stage-top">
      <h1>Text Emoji Builder</h1>
      <div class="stage-actions">
        <button class="btn btn-main" id="copyBtn">Copy</button>
        <button class="btn" id="randomBtn">Random</button>
        <button class="btn" id="resetBtn">Reset</button>
      </div>
    </div>
    <div class="stage-body">
      <div class="preview" id="preview">:)</div>
    </div>
  </aside>

  <section class="tools">
    <div class="tools-scroll">

      <div class="block">
        <div class="block-label">Presets</div>
        <div class="presets" id="presets"></div>
      </div>

      <div class="block">
        <div class="block-label">Eyes</div>
        <div class="seg" style="margin-bottom:10px" data-group="eyes">
          <button type="button" class="on" data-value="2">Two</button>
          <button type="button" data-value="1">One</button>
        </div>
        <div class="row">
          <div class="field">
            <label>Left</label>
            <input type="text" id="leftEye" value=":" maxlength="6" spellcheck="false">
            <div class="chips" data-target="leftEye"></div>
          </div>
          <div class="field" id="rightEyeField">
            <label>Right</label>
            <input type="text" id="rightEye" value=";" maxlength="6" spellcheck="false">
            <div class="chips" data-target="rightEye"></div>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block-label">Mouth</div>
        <input type="text" id="mouth" value=")" maxlength="6" spellcheck="false">
        <div class="chips" data-target="mouth"></div>
      </div>

      <div class="block">
        <div class="block-label">Nose <span style="font-weight:500;text-transform:none;letter-spacing:0;color:#666">(optional)</span></div>
        <input type="text" id="nose" value="" maxlength="4" spellcheck="false" placeholder="—">
        <div class="chips" data-target="nose"></div>
      </div>

      <div class="block">
        <div class="block-label">Brows</div>
        <div class="seg" style="margin-bottom:10px" data-group="brows">
          <button type="button" class="on" data-value="2">Two</button>
          <button type="button" data-value="1">One</button>
          <button type="button" data-value="0">None</button>
        </div>
        <div class="row" id="browInputs">
          <div class="field">
            <label>Left</label>
            <input type="text" id="leftBrow" value="" maxlength="6" spellcheck="false" placeholder="—">
            <div class="chips" data-target="leftBrow"></div>
          </div>
          <div class="field" id="rightBrowField">
            <label>Right</label>
            <input type="text" id="rightBrow" value="" maxlength="6" spellcheck="false" placeholder="—">
            <div class="chips" data-target="rightBrow"></div>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block-label">Sides</div>
        <div class="row">
          <div class="field">
            <label>Left</label>
            <input type="text" id="leftSide" value="" maxlength="8" spellcheck="false" placeholder="—">
            <div class="chips" data-target="leftSide"></div>
          </div>
          <div class="field">
            <label>Right</label>
            <input type="text" id="rightSide" value="" maxlength="8" spellcheck="false" placeholder="—">
            <div class="chips" data-target="rightSide"></div>
          </div>
        </div>
      </div>

      <div class="block">
        <div class="block-label">Bonus</div>
        <div class="row" style="margin-bottom:8px">
          <div class="field">
            <label>Symbol</label>
            <input type="text" id="bonus" value="" maxlength="8" spellcheck="false" placeholder="—">
          </div>
          <div class="field">
            <label>Place</label>
            <div class="seg" data-group="bonusPlace">
              <button type="button" class="on" data-value="end">End</button>
              <button type="button" data-value="both">Both</button>
              <button type="button" data-value="wrap">Wrap</button>
            </div>
          </div>
        </div>
        <div class="chips" data-target="bonus"></div>
      </div>

      <div class="block">
        <div class="block-label">Frame</div>
        <select id="special">
          <option value="">None</option>
          <option value="⚞^??^⚟">⚞^??^⚟ cat ears</option>
          <option value="(˶??˶)">(˶??˶) soft</option>
          <option value="૮₍ ?? ₎ა">૮₍ ?? ₎ა bear</option>
          <option value="(„??„)">(„??„) blush</option>
          <option value="₍^??^₎⟆">₍^??^₎⟆ cat</option>
          <option value="ʕ??ʔ">ʕ??ʔ bear</option>
          <option value="(๑??๑)">(๑??๑) cute</option>
          <option value="꒰??꒱">꒰??꒱ soft</option>
          <option value="༼??༽">༼??༽ angry</option>
          <option value="(っ??ς)">(っ??ς) hug</option>
          <option value="⊂??⊃">⊂??⊃ arms</option>
          <option value="（??）">（??） fullwidth</option>
          <option value="【??】">【??】 brackets</option>
        </select>
        <p class="note">Replaces ?? with your face. Overrides bonus.</p>
      </div>

      <div class="block">
        <div class="block-label">Spacing</div>
        <div class="seg" data-group="spacing">
          <button type="button" class="on" data-value="space">Spaced</button>
          <button type="button" data-value="tight">Tight</button>
        </div>
      </div>

    </div>
  </section>

</div>

<div class="toast" id="toast">Copied</div>

<script>
(function () {
  const EYES = [":",";","=","|","ᵔ","v","^","o","0","╥","`","´","•","-","◝","◜","¬","×","ᗣ","ᗢ","●","◉","✧","★","☆","♡","◕","⊙","◎","□","≧","≦","ಠ","๑","˘"];
  const MOUTHS = [")","(","3","0","O","]","}","[","{","|","\\","/","-","_","<",">","ᵕ","⩊","ᗜ","﹏","꒳","ᴗ","v","‸","ω","∀","Д","□","▽","ε","з","‿","ᴥ","ڡ","⌣"];
  const BROWS = ["-","`","´","‾","¯","~","∿","⌢","⌣","◠","◡"];
  const SIDES = ["˶","˵","„","(",")","〔","〕","【","】","っ","ς","ʕ","ʔ","꒰","꒱","༼","༽","⊂","⊃","｡","๑"];
  const NOSES = ["․","·","•","ω","ᴥ","ڡ","ε","з","-","═"];
  const BONUSES = ["`","~","*","$","#","%","♡","♥","★","☆","✧","•","°","˚","❀","♪"];

  const PRESETS = [
    { label: ":)", face: { leftEye: ":", mouth: ")", eyes: "1", brows: "0" } },
    { label: ";)", face: { leftEye: ";", mouth: ")", eyes: "1", brows: "0" } },
    { label: ":D", face: { leftEye: ":", mouth: "D", eyes: "1", brows: "0" } },
    { label: "ᗢᵕᗣ", face: { leftEye: "ᗢ", rightEye: "ᗣ", mouth: "ᵕ", eyes: "2", brows: "0" } },
    { label: "◕‿◕", face: { leftEye: "◕", rightEye: "◕", mouth: "‿", eyes: "2", brows: "0" } },
    { label: "ಠ_ಠ", face: { leftEye: "ಠ", rightEye: "ಠ", mouth: "_", eyes: "2", brows: "0" } },
    { label: "≧ω≦", face: { leftEye: "≧", rightEye: "≦", mouth: "ω", eyes: "2", brows: "0" } },
    { label: "•ᴗ•", face: { leftEye: "•", rightEye: "•", mouth: "ᴗ", eyes: "2", brows: "0" } },
    { label: "｡◕‿◕｡", face: { leftEye: "◕", rightEye: "◕", mouth: "‿", leftSide: "｡", rightSide: "｡", eyes: "2", brows: "0" } },
    { label: "(˶ᵔᵕᵔ˶)", face: { leftEye: "ᵔ", rightEye: "ᵔ", mouth: "ᵕ", leftSide: "˶", rightSide: "˶", eyes: "2", brows: "0", bonusPlace: "wrap" } },
    { label: "ʕ•ᴥ•ʔ", face: { leftEye: "•", rightEye: "•", mouth: "ᴥ", special: "ʕ??ʔ", eyes: "2", brows: "0" } },
    { label: "【-‸-】", face: { leftEye: "-", rightEye: "-", mouth: "‸", leftSide: "【", rightSide: "】", eyes: "2", brows: "0", spacing: "tight" } }
  ];

  const state = { eyes: "2", brows: "2", bonusPlace: "end", spacing: "space" };

  const $ = id => document.getElementById(id);
  const preview = $("preview");
  const leftEye = $("leftEye"), rightEye = $("rightEye"), rightEyeField = $("rightEyeField");
  const mouth = $("mouth"), nose = $("nose");
  const leftBrow = $("leftBrow"), rightBrow = $("rightBrow"), rightBrowField = $("rightBrowField");
  const browInputs = $("browInputs");
  const leftSide = $("leftSide"), rightSide = $("rightSide");
  const bonus = $("bonus"), special = $("special");
  const toast = $("toast");

  function fillChips(id, chars) {
    const row = document.querySelector('.chips[data-target="' + id + '"]');
    if (!row) return;
    row.innerHTML = "";
    [...new Set(chars)].forEach(ch => {
      if (!ch) return;
      const b = document.createElement("button");
      b.type = "button";
      b.className = "chip";
      b.textContent = ch;
      b.addEventListener("click", () => {
        $(id).value = ch;
        update();
      });
      row.appendChild(b);
    });
  }

  function join(parts, tight) {
    const f = parts.filter(p => p);
    return tight ? f.join("") : f.join(" ").replace(/\s+/g, " ").trim();
  }

  function build() {
    const tight = state.spacing === "tight";
    const parts = [];
    if (leftSide.value) parts.push(leftSide.value);
    if (state.brows !== "0") parts.push(leftBrow.value || "");
    let core = state.eyes === "2"
      ? (leftEye.value || "") + (nose.value || "") + (mouth.value || "") + (rightEye.value || "")
      : (leftEye.value || "") + (nose.value || "") + (mouth.value || "");
    parts.push(core);
    if (state.brows === "2") parts.push(rightBrow.value || "");
    if (rightSide.value) parts.push(rightSide.value);

    let face = join(parts, tight);
    if (special.value) return special.value.replace("??", face);
    if (bonus.value) {
      if (state.bonusPlace === "wrap") face = "(" + face + ")";
      else if (state.bonusPlace === "both") face = bonus.value + face + bonus.value;
      else face += bonus.value;
    }
    return face || " ";
  }

  function update() { preview.textContent = build(); }

  function setGroup(group, value) {
    state[group] = value;
    document.querySelectorAll('.seg[data-group="' + group + '"] button').forEach(b => {
      b.classList.toggle("on", b.dataset.value === value);
    });
    if (group === "eyes") rightEyeField.style.display = value === "2" ? "" : "none";
    if (group === "brows") {
      browInputs.style.display = value === "0" ? "none" : "";
      rightBrowField.style.display = value === "2" ? "" : "none";
    }
    update();
  }

  function showToast(msg) {
    toast.textContent = msg || "Copied";
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 1400);
  }

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  function randomFace() {
    state.eyes = Math.random() < 0.75 ? "2" : "1";
    state.brows = Math.random() < 0.5 ? "2" : (Math.random() < 0.5 ? "1" : "0");
    state.bonusPlace = pick(["end", "both", "wrap"]);
    state.spacing = Math.random() < 0.65 ? "space" : "tight";
    leftEye.value = pick(EYES);
    rightEye.value = state.eyes === "2" ? pick(EYES) : "";
    mouth.value = pick(MOUTHS);
    leftBrow.value = state.brows !== "0" ? pick(BROWS) : "";
    rightBrow.value = state.brows === "2" ? pick(BROWS) : "";
    leftSide.value = Math.random() < 0.3 ? pick(SIDES) : "";
    rightSide.value = Math.random() < 0.3 ? pick(SIDES) : "";
    nose.value = Math.random() < 0.2 ? pick(NOSES) : "";
    bonus.value = Math.random() < 0.3 ? pick(BONUSES) : "";
    special.value = Math.random() < 0.15
      ? pick([...special.options].map(o => o.value).filter(Boolean))
      : "";
    ["eyes", "brows", "bonusPlace", "spacing"].forEach(g => setGroup(g, state[g]));
    update();
  }

  function resetFace() {
    Object.assign(state, { eyes: "2", brows: "2", bonusPlace: "end", spacing: "space" });
    leftEye.value = ":"; rightEye.value = ";"; mouth.value = ")";
    leftBrow.value = ""; rightBrow.value = "";
    leftSide.value = ""; rightSide.value = "";
    nose.value = ""; bonus.value = ""; special.value = "";
    ["eyes", "brows", "bonusPlace", "spacing"].forEach(g => setGroup(g, state[g]));
    update();
  }

  function applyPreset(p) {
    const f = p.face;
    state.eyes = f.eyes || "2";
    state.brows = f.brows || "0";
    state.bonusPlace = f.bonusPlace || "end";
    state.spacing = f.spacing || "space";
    leftEye.value = f.leftEye || "";
    rightEye.value = f.rightEye || "";
    mouth.value = f.mouth || "";
    leftBrow.value = f.leftBrow || "";
    rightBrow.value = f.rightBrow || "";
    leftSide.value = f.leftSide || "";
    rightSide.value = f.rightSide || "";
    nose.value = f.nose || "";
    bonus.value = f.bonus || "";
    special.value = f.special || "";
    ["eyes", "brows", "bonusPlace", "spacing"].forEach(g => setGroup(g, state[g]));
    update();
  }

  fillChips("leftEye", EYES);
  fillChips("rightEye", EYES);
  fillChips("mouth", MOUTHS);
  fillChips("leftBrow", BROWS);
  fillChips("rightBrow", BROWS);
  fillChips("leftSide", SIDES);
  fillChips("rightSide", SIDES);
  fillChips("nose", NOSES);
  fillChips("bonus", BONUSES);

  const presetsEl = $("presets");
  PRESETS.forEach(p => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "preset";
    b.textContent = p.label;
    b.addEventListener("click", () => applyPreset(p));
    presetsEl.appendChild(b);
  });

  document.querySelectorAll(".seg").forEach(seg => {
    seg.querySelectorAll("button").forEach(btn => {
      btn.addEventListener("click", () => setGroup(seg.dataset.group, btn.dataset.value));
    });
  });

  [leftEye, rightEye, mouth, nose, leftBrow, rightBrow, leftSide, rightSide, bonus, special]
    .forEach(el => {
      el.addEventListener("input", update);
      el.addEventListener("change", update);
    });

  $("copyBtn").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(preview.textContent);
      showToast("Copied");
      const btn = $("copyBtn");
      btn.classList.add("btn-ok");
      btn.textContent = "Copied";
      setTimeout(() => { btn.classList.remove("btn-ok"); btn.textContent = "Copy"; }, 1000);
    } catch { showToast("Copy failed"); }
  });

  $("randomBtn").addEventListener("click", randomFace);
  $("resetBtn").addEventListener("click", resetFace);

  setGroup("eyes", "2");
  setGroup("brows", "2");
  setGroup("bonusPlace", "end");
  setGroup("spacing", "space");
  update();
})();
</script>
</body>
</html>
