<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bumfuzzle Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Loading & Start UI -->
  <div id="loading">
    <h1 class="text-4xl font-bold mb-6 animate-pulse text-gray-800">Loading Assets...</h1>
    <button id="startBtn" class="px-8 py-4 bg-blue-600 text-white font-bold rounded-xl text-xl hover:bg-blue-500 shadow-xl transform hover:scale-105 transition-all">
      Start Preview
    </button>
  </div>

  <!-- Pause Button -->
  <button id="pauseBtn" class="absolute top-6 right-6 px-6 py-2 bg-gray-800 text-white font-bold rounded-lg opacity-50 hover:opacity-100 transition-opacity z-20 hidden shadow-lg">
    Pause (ESC)
  </button>

  <!-- Pause Menu Overlay -->
  <div id="pauseMenu" class="absolute inset-0 bg-black/70 flex-col items-center justify-center space-y-6 z-40 hidden backdrop-blur-sm">
    <h2 class="text-white text-5xl font-black mb-4 drop-shadow-lg">PAUSED</h2>
    <button id="resumeBtn" class="w-64 py-4 bg-green-500 hover:bg-green-400 text-white font-bold rounded-xl text-2xl shadow-lg transform hover:scale-105 transition-all">
      Resume
    </button>
    <button id="restartBtn" class="w-64 py-4 bg-blue-500 hover:bg-blue-400 text-white font-bold rounded-xl text-2xl shadow-lg transform hover:scale-105 transition-all">
      Restart
    </button>
    <button id="toStartBtn" class="w-64 py-4 bg-gray-700 hover:bg-gray-600 text-white font-bold rounded-xl text-2xl shadow-lg transform hover:scale-105 transition-all">
      Main Menu
    </button>
  </div>

  <canvas id="gameCanvas"></canvas>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
