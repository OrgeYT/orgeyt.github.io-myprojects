<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blob Warfare 3D Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        
        /* UI Layers */
        #ui-layer, #resume-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.75);
            z-index: 10;
        }
        
        #resume-layer {
            display: none;
            flex-direction: column;
            color: white;
            cursor: pointer;
            z-index: 9;
        }

        #game-over-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.85);
            z-index: 11;
            color: white;
        }
        
        #game-over-layer h2 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .panel {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 12px;
            color: white;
            width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        h1, h2 {
            margin-top: 0;
            text-align: center;
            color: #fff;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
            background: #2a2a2a;
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #3a3a3a;
        }

        .team-row label {
            flex-grow: 1;
            margin-left: 12px;
            font-weight: bold;
        }

        .team-row input[type="color"] {
            cursor: pointer;
            border: none;
            background: none;
            width: 32px;
            height: 32px;
            padding: 0;
        }

        .team-row input[type="number"] {
            width: 60px;
            padding: 0.3rem;
            border-radius: 4px;
            border: 1px solid #555;
            background: #111;
            color: white;
            text-align: center;
        }

        button {
            width: 100%;
            padding: 1rem;
            margin-top: 1rem;
            background: #4CAF50;
            color: white;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #45a049;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            display: none;
            mix-blend-mode: difference;
            z-index: 5;
        }

        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            color: white;
            z-index: 5;
            display: none;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        .instructions {
            text-align: center;
            font-size: 0.9em;
            color: #aaa;
            margin-bottom: 1.5rem;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-layer">
        <div class="panel">
            <h1>Blob Warfare 3D</h1>
            <p class="instructions">Set team sizes (0 disables the team).<br>Custom colors supported.</p>
            
            <div class="team-row">
                <input type="color" id="t1-color" value="#ff3333">
                <label>Red Team</label>
                <input type="number" id="t1-count" value="4" min="0" max="50">
            </div>
            <div class="team-row">
                <input type="color" id="t2-color" value="#3333ff">
                <label>Blue Team</label>
                <input type="number" id="t2-count" value="4" min="0" max="50">
            </div>
            <div class="team-row">
                <input type="color" id="t3-color" value="#ffff33">
                <label>Yellow Team</label>
                <input type="number" id="t3-count" value="0" min="0" max="50">
            </div>
            <div class="team-row">
                <input type="color" id="t4-color" value="#33ff33">
                <label>Green Team</label>
                <input type="number" id="t4-count" value="0" min="0" max="50">
            </div>

            <button id="start-btn">Start Simulation</button>
        </div>
    </div>

    <div id="resume-layer">
        <h2>Simulation Paused</h2>
        <p>Click anywhere to resume</p>
        <div style="margin-top: 20px; text-align: center; color: #ccc;">
            <p><b>W A S D</b> - Move</p>
            <p><b>Space</b> - Fly Up &nbsp;|&nbsp; <b>Shift</b> - Fly Down</p>
            <p><b>Mouse</b> - Look Around</p>
        </div>
    </div>

    <div id="game-over-layer">
        <h2 id="game-over-text">Team Wins!</h2>
        <button id="back-btn" style="width: 250px;">Back to Menu</button>
    </div>

    <div id="crosshair"></div>
    <div id="hud">Blobs Alive: 0</div>

    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.rotation.order = 'YXZ';

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 50, 20);
        scene.add(dirLight);

        function createArena() {
            const floorGeo = new THREE.CylinderGeometry(50, 50, 1, 64);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.position.y = -0.5;
            scene.add(floor);

            const innerGeo = new THREE.CylinderGeometry(20, 20, 1.05, 64);
            const innerMat = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.9 });
            const inner = new THREE.Mesh(innerGeo, innerMat);
            inner.position.y = -0.5;
            scene.add(inner);

            const wallGeo = new THREE.CylinderGeometry(50, 50, 4, 64, 1, true);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x666666, side: THREE.DoubleSide });
            const wall = new THREE.Mesh(wallGeo, wallMat);
            wall.position.y = 2;
            scene.add(wall);
            
            const rimGeo = new THREE.TorusGeometry(50, 0.5, 16, 64);
            const rimMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const rim = new THREE.Mesh(rimGeo, rimMat);
            rim.position.y = 4;
            rim.rotation.x = Math.PI / 2;
            scene.add(rim);
        }
        createArena();

        let audioCtx;
        function initAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            else if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            if(type === 'hit') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(800 + Math.random()*400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if(type === 'death') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        let blobs = [];
        let particles = [];
        let clock = new THREE.Clock();
        let gameStarted = false;
        let isGameOver = false;

        let pitch = 0;
        let yaw = 0;
        const keys = {};

        class Particle {
            constructor(pos, color) {
                this.mesh = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), new THREE.MeshBasicMaterial({ color: color }));
                this.mesh.position.copy(pos);
                this.mesh.position.y += 0.5;
                this.vel = new THREE.Vector3((Math.random() - 0.5) * 25, Math.random() * 15 + 10, (Math.random() - 0.5) * 25);
                this.life = 1.0;
                scene.add(this.mesh);
            }
            update(delta) {
                this.life -= delta * 1.5;
                if(this.life > 0) {
                    this.vel.y -= 20 * delta;
                    this.mesh.position.addScaledVector(this.vel, delta);
                    this.mesh.scale.setScalar(this.life);
                    return true;
                }
                this.dispose();
                scene.remove(this.mesh);
                return false;
            }
            dispose() { this.mesh.geometry.dispose(); this.mesh.material.dispose(); }
        }

        class Blob {
            constructor(teamName, color, position) {
                this.teamName = teamName;
                this.color = color;
                this.hp = 100;
                this.walkTime = Math.random() * 100;
                this.attackCooldown = 0;
                this.isAttacking = false;
                this.attackAnimTime = 0;
                this.velocity = new THREE.Vector3(0, 0, 0);
                this.isDead = false;
                this.deathTime = 0;

                this.mesh = new THREE.Group();
                this.mesh.position.copy(position);

                this.canvas = document.createElement('canvas');
                this.canvas.width = 512;
                this.canvas.height = 256;
                this.texture = new THREE.CanvasTexture(this.canvas);
                
                this.body = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 32), new THREE.MeshStandardMaterial({ map: this.texture, roughness: 0.6 }));
                this.mesh.add(this.body);
                this.updateHPMaterial();

                this.swordPivot = new THREE.Group();
                this.swordPivot.position.set(1.2, 0, 0);
                this.sword = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 2.5), new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.3, metalness: 0.8 }));
                this.sword.position.set(0, 0, -1.25);
                this.swordPivot.add(this.sword);
                this.mesh.add(this.swordPivot);
            }

            updateHPMaterial() {
                const ctx = this.canvas.getContext('2d');
                ctx.fillStyle = this.isDead ? '#333333' : this.color;
                ctx.fillRect(0, 0, 512, 256);
                
                if(!this.isDead) {
                    ctx.fillStyle = 'black';
                    ctx.font = 'bold 70px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const displayHP = Math.max(0, this.hp);
                    ctx.fillText(displayHP, 64, 128);
                    ctx.fillText(displayHP, 192, 128);
                    ctx.fillText(displayHP, 320, 128);
                    ctx.fillText(displayHP, 448, 128);
                }
                this.texture.needsUpdate = true;
            }

            takeDamage(amount, attackerPos) {
                if (this.isDead) return;
                this.hp -= amount;
                this.updateHPMaterial();
                if (attackerPos) {
                    const kbDir = new THREE.Vector3().subVectors(this.mesh.position, attackerPos);
                    kbDir.y = 0;
                    if(kbDir.lengthSq() > 0) kbDir.normalize();
                    this.velocity.x += kbDir.x * 15;
                    this.velocity.z += kbDir.z * 15;
                    this.velocity.y = (this.velocity.y > 0 ? this.velocity.y : 0) + 12;
                }
                for(let i=0; i<10; i++) particles.push(new Particle(this.mesh.position, this.color));
                playSound('hit');
                if(this.hp <= 0) {
                    this.isDead = true;
                    playSound('death');
                    for(let i=0; i<40; i++) particles.push(new Particle(this.mesh.position, this.color));
                    this.swordPivot.visible = false;
                    this.updateHPMaterial();
                    this.velocity.y = 15;
                }
            }

            update(delta, allBlobs) {
                this.velocity.y -= 30 * delta;
                this.mesh.position.addScaledVector(this.velocity, delta);
                const distFromCenter = Math.sqrt(this.mesh.position.x**2 + this.mesh.position.z**2);

                if (this.mesh.position.y <= 1 && distFromCenter < 50) {
                    this.mesh.position.y = 1;
                    if (this.velocity.y < 0) {
                        if (this.isDead) this.velocity.y *= -0.5;
                        else this.velocity.y = 0;
                    }
                    if (!this.isDead) {
                        this.velocity.x -= this.velocity.x * 8 * delta;
                        this.velocity.z -= this.velocity.z * 8 * delta;
                    } else {
                        this.velocity.x -= this.velocity.x * 1 * delta;
                        this.velocity.z -= this.velocity.z * 1 * delta;
                    }
                } else if (!this.isDead) {
                    this.velocity.x -= this.velocity.x * 2 * delta;
                    this.velocity.z -= this.velocity.z * 2 * delta;
                }

                if (this.isDead) {
                    this.body.rotation.x += this.velocity.z * delta;
                    this.body.rotation.z -= this.velocity.x * delta;
                    this.deathTime += delta;
                    return;
                }

                if (this.mesh.position.y <= 1.01 && Math.random() < 0.8 * delta) this.velocity.y = 14;

                for(let b of allBlobs) {
                    if(b === this || b.isDead) continue;
                    const isEnemy = (b.teamName !== this.teamName);
                    const repelDist = isEnemy ? 1.2 : 1.8; 
                    const dist = this.mesh.position.distanceTo(b.mesh.position);
                    if(dist > 0 && dist < repelDist) {
                        const push = new THREE.Vector3().subVectors(this.mesh.position, b.mesh.position);
                        push.y = 0;
                        push.normalize().multiplyScalar((repelDist - dist) * 4 * delta);
                        this.mesh.position.add(push);
                    }
                }

                if(distFromCenter > 48) {
                    this.mesh.position.x *= 48 / distFromCenter;
                    this.mesh.position.z *= 48 / distFromCenter;
                }

                let closestEnemy = null;
                let minDist = Infinity;
                for(let b of allBlobs) {
                    if(b === this || b.isDead || b.teamName === this.teamName) continue;
                    const dist = this.mesh.position.distanceTo(b.mesh.position);
                    if(dist < minDist) { minDist = dist; closestEnemy = b; }
                }

                if(closestEnemy) {
                    const targetPos = closestEnemy.mesh.position.clone();
                    targetPos.y = this.mesh.position.y;
                    this.mesh.lookAt(targetPos);
                    if(minDist > 1.8) {
                        const dir = new THREE.Vector3().subVectors(targetPos, this.mesh.position);
                        dir.y = 0; dir.normalize();
                        this.mesh.position.addScaledVector(dir, 8 * delta);
                        this.walkTime += delta * 15;
                        const hopHeight = Math.abs(Math.sin(this.walkTime)) * 0.6;
                        this.body.position.y = hopHeight;
                        this.swordPivot.position.y = hopHeight;
                    } else {
                        this.body.position.y = 0;
                        this.swordPivot.position.y = 0;
                        if(this.attackCooldown <= 0) {
                            this.isAttacking = true;
                            this.attackCooldown = 0.7;
                            const lungeDir = new THREE.Vector3().subVectors(targetPos, this.mesh.position);
                            lungeDir.y = 0;
                            if(lungeDir.lengthSq() > 0) lungeDir.normalize();
                            this.velocity.set(lungeDir.x * 12, 3, lungeDir.z * 12);
                            closestEnemy.takeDamage(Math.floor(Math.random() * 11) + 10, this.mesh.position);
                        }
                    }
                } else {
                    this.body.position.y = 0;
                    this.swordPivot.position.y = 0;
                }

                if(this.attackCooldown > 0) this.attackCooldown -= delta;
                if(this.isAttacking) {
                    this.attackAnimTime += delta;
                    if(this.attackAnimTime < 0.2) {
                        this.swordPivot.rotation.x = -Math.sin((this.attackAnimTime / 0.2) * Math.PI) * (Math.PI * 1.2);
                        this.swordPivot.rotation.y = Math.sin((this.attackAnimTime / 0.2) * Math.PI) * 0.8;
                        this.swordPivot.rotation.z = -Math.sin((this.attackAnimTime / 0.2) * Math.PI) * 0.4;
                    } else {
                        this.isAttacking = false;
                        this.attackAnimTime = 0;
                        this.swordPivot.rotation.set(0, 0, 0);
                    }
                }
            }

            dispose() {
                this.texture.dispose();
                this.body.geometry.dispose();
                this.body.material.dispose();
                this.sword.geometry.dispose();
                this.sword.material.dispose();
            }
        }

        function startGame() {
            blobs.forEach(b => { b.dispose(); scene.remove(b.mesh); });
            blobs = [];
            particles.forEach(p => { p.dispose(); scene.remove(p.mesh); });
            particles = [];
            
            const activeTeams = [];
            for(let i=1; i<=4; i++) {
                const count = parseInt(document.getElementById(`t${i}-count`).value) || 0;
                if(count > 0) {
                    const names = ["Red", "Blue", "Yellow", "Green"];
                    activeTeams.push({ name: names[i-1], color: document.getElementById(`t${i}-color`).value, count: count });
                }
            }
            const angleStep = (Math.PI * 2) / activeTeams.length;
            activeTeams.forEach((team, index) => {
                const baseAngle = index * angleStep;
                for(let i=0; i<team.count; i++) {
                    const angle = baseAngle + (Math.random() - 0.5) * 1.5;
                    const radius = 35 + (Math.random() - 0.5) * 10;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    const blob = new Blob(team.name, team.color, new THREE.Vector3(x, 1, z));
                    blobs.push(blob);
                    scene.add(blob.mesh);
                }
            });
            camera.position.set(0, 5, 40);
            yaw = 0; pitch = 0; camera.rotation.set(pitch, yaw, 0, 'YXZ');
            document.getElementById('ui-layer').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            isGameOver = false;
            if(!gameStarted) { gameStarted = true; clock.start(); animate(); }
        }

        function checkWinCondition() {
            if(isGameOver) return;
            const aliveBlobs = blobs.filter(b => !b.isDead);
            let gameOverTriggered = false;
            let winText = "";

            if(aliveBlobs.length === 0) { winText = "All destroyed!"; gameOverTriggered = true; }
            else {
                const firstTeam = aliveBlobs[0].teamName;
                if(aliveBlobs.every(b => b.teamName === firstTeam)) {
                    winText = `${firstTeam} Team Wins!`;
                    gameOverTriggered = true;
                } else document.getElementById('hud').innerText = `Blobs Alive: ${aliveBlobs.length}`;
            }

            if(gameOverTriggered) {
                isGameOver = true;
                document.getElementById('hud').innerText = winText;
                document.getElementById('game-over-text').innerText = winText;
                document.exitPointerLock();
                document.getElementById('game-over-layer').style.display = 'flex';
                document.getElementById('crosshair').style.display = 'none';
            }
        }

        function updateCamera(delta) {
            if (document.pointerLockElement !== document.body) return;
            const moveSpeed = 30 * delta;
            const forward = new THREE.Vector3(0, 0, -1).applyEuler(new THREE.Euler(0, yaw, 0));
            const right = new THREE.Vector3(1, 0, 0).applyEuler(new THREE.Euler(0, yaw, 0));
            if (keys['KeyW']) camera.position.addScaledVector(forward, moveSpeed);
            if (keys['KeyS']) camera.position.addScaledVector(forward, -moveSpeed);
            if (keys['KeyA']) camera.position.addScaledVector(right, -moveSpeed);
            if (keys['KeyD']) camera.position.addScaledVector(right, moveSpeed);
            if (keys['Space']) camera.position.y += moveSpeed;
            if (keys['ShiftLeft']) camera.position.y -= moveSpeed;
            if(camera.position.y < 1) camera.position.y = 1;
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = Math.min(clock.getDelta(), 0.1);
            updateCamera(delta);
            for(let i = particles.length - 1; i >= 0; i--) if(!particles[i].update(delta)) particles.splice(i, 1);
            for(let i = blobs.length - 1; i >= 0; i--) {
                blobs[i].update(delta, blobs);
                if(blobs[i].mesh.position.y < -20 || (blobs[i].isDead && blobs[i].deathTime > 6)) {
                    blobs[i].dispose();
                    scene.remove(blobs[i].mesh);
                    blobs.splice(i, 1);
                }
            }
            checkWinCondition();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        document.getElementById('start-btn').addEventListener('click', () => { initAudio(); startGame(); document.body.requestPointerLock(); });
        document.getElementById('back-btn').addEventListener('click', () => {
            document.getElementById('game-over-layer').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
            document.getElementById('hud').style.display = 'none';
            blobs.forEach(b => { b.dispose(); scene.remove(b.mesh); });
            blobs = [];
        });
        document.getElementById('resume-layer').addEventListener('click', () => { document.body.requestPointerLock(); });
        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                document.getElementById('resume-layer').style.display = 'none';
                if(!isGameOver) document.getElementById('crosshair').style.display = 'block';
            } else if(gameStarted && !isGameOver) { document.getElementById('resume-layer').style.display = 'flex'; document.getElementById('crosshair').style.display = 'none'; }
        });
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === document.body) {
                yaw -= e.movementX * 0.002;
                pitch -= e.movementY * 0.002;
                pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
                camera.rotation.set(pitch, yaw, 0, 'YXZ');
            }
        });
        document.addEventListener('keydown', e => keys[e.code] = true);
        document.addEventListener('keyup', e => keys[e.code] = false);
    </script>
</body>
</html>
