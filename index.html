<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrgeYT's HTML Projects</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Gallery Carousel Styles */
        .gallery-section {
            margin-top: 20px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            text-align: center;
        }
        .gallery-section h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
        .gallery-carousel {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .gallery-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .gallery-btn:hover { background: rgba(255, 255, 255, 0.3); }
        .gallery-content {
            flex-grow: 1;
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gallery-content img {
            width: 100%;
            max-width: 160px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .gallery-content p {
            font-size: 0.85rem;
            opacity: 0.8;
            margin: 0;
            font-style: italic;
            min-height: 2.5em;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>My Projects</h2>
        <p class="subtitle">Choose a project to load</p>

        <button id="toggle-ui-btn" class="toggle-btn">Toggle UI (`)</button>

        <div id="file-list"></div>

        <div class="gallery-section">
            <h3>Gallery</h3>
            <div class="gallery-carousel">
                <button id="prev-btn" class="gallery-btn">&lt;</button>
                <div class="gallery-content">
                    <img id="gallery-img" src="" alt="Gallery Image">
                    <p id="gallery-caption"></p>
                </div>
                <button id="next-btn" class="gallery-btn">&gt;</button>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <button id="fullscreen-btn">Full Screen</button>
        <button id="share-btn">Share Project</button>
        <iframe id="runner-frame" src="about:blank" title="Project Runner"></iframe>
    </div>

    <script>
        const galleryImages = [
            { src: "Gallery/AAUGH.png", caption: '"Fun fact, this was actually the first file uploaded."' },
            { src: "Gallery/NOO.png", caption: '"NOO THEY CHANGED THE GOOGLE DRIVE LOGO"' },
            { src: "Gallery/avatar.png", caption: '"this is fine"' },
            { src: "Gallery/cards.jpg", caption: "" },
            { src: "Gallery/finaltest.jpg", caption: "" },
            { src: "Gallery/darn.jpg", caption: "fr"}
        ];

        let currentIndex = 0;
        const galleryImg = document.getElementById("gallery-img");
        const galleryCaption = document.getElementById("gallery-caption");

        function updateGallery() {
            galleryImg.src = galleryImages[currentIndex].src;
            galleryCaption.textContent = galleryImages[currentIndex].caption;
        }

        document.getElementById("prev-btn").addEventListener("click", () => {
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
            updateGallery();
        });

        document.getElementById("next-btn").addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % galleryImages.length;
            updateGallery();
        });

        updateGallery();

        // --- New UI Toggle Logic ---
        const toggleBtn = document.getElementById('toggle-ui-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const shareBtn = document.getElementById('share-btn');

        function toggleOverlayButtons() {
            fullscreenBtn.classList.toggle('hidden');
            shareBtn.classList.toggle('hidden');
        }

        // Listen for button click
        toggleBtn.addEventListener('click', toggleOverlayButtons);

        // Listen for backtick (`) keypress
        document.addEventListener('keydown', (event) => {
            if (event.key === '`') {
                toggleOverlayButtons();
            }
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
