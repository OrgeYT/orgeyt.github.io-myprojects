<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrgeYT's HTML Projects</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="sidebar">
        <img id="sidebar-logo" src="Logo.png" alt="OrgeYT Logo">
        
        <h2>My Projects</h2>
        <p class="subtitle">Choose a project to load</p>

        <div id="project-counter" style="font-size: 0.8rem; color: var(--text-accent);"></div>
        <div id="time-counter">Time: 0s</div>

        <div class="sidebar-controls" style="display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap;">
            <button id="toggle-ui-btn" class="toggle-btn" style="margin-bottom: 0; flex: 1 1 45%;">Toggle UI (`)</button>
            <button id="tab-modifier-btn" class="toggle-btn" style="margin-bottom: 0; flex: 1 1 45%;">Tab Settings</button>
            <button id="theme-settings-btn" class="toggle-btn" style="margin-top: 5px; margin-bottom: 0; flex: 1 1 45%;">Theme Settings</button>
            <button id="random-project-btn" class="toggle-btn" style="margin-top: 5px; margin-bottom: 0; flex: 1 1 45%;">Random Project</button>
            <button id="favorite-btn" class="toggle-btn" style="margin-top: 5px; margin-bottom: 0; flex: 1 1 100%;">Favorite Current Project</button>
            <button id="friends-website-btn" class="toggle-btn" style="margin-top: 5px; margin-bottom: 0; flex: 1 1 45%;">My friend's website</button>
            <button id="achievements-btn" class="toggle-btn" style="margin-top: 5px; margin-bottom: 0; flex: 1 1 45%;">Achievements</button>
            <button id="open-gallery-btn" class="toggle-btn" style="margin-top: 5px; margin-bottom: 0; flex: 1 1 100%;">Gallery</button>
        </div>

        <input type="text" id="search-bar" placeholder="Search projects...">

        <div id="file-list"></div>
    </div>
    
    <div class="main-content">
        <button id="open-full-btn">View Full Project</button>
        <button id="share-btn">Share Project</button>
        <button id="fullscreen-btn">Full Screen</button>
        <iframe id="runner-frame" src="about:blank" title="Project Runner"></iframe>
    </div>

    <div id="theme-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-theme-btn" class="close-btn">&times;</span>
            <h3>Theme Settings</h3>
            <div class="setting-group" id="theme-buttons" style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <button class="modal-btn" data-set-theme="default">Dark Orange (Default)</button>
                <button class="modal-btn" data-set-theme="grass-dark">Grass Dark</button>
                <button class="modal-btn" data-set-theme="sky-dark">Sky Dark</button>
                <button class="modal-btn" data-set-theme="fire-dark">Fire Dark</button>
                <button class="modal-btn" data-set-theme="white">White</button>
                <button class="modal-btn" data-set-theme="black">Black</button>
                <button class="modal-btn" data-set-theme="flower-dark">Flower Dark</button>
                <button class="modal-btn" data-set-theme="discord">Discord</button>
                <button class="modal-btn" data-set-theme="ultrabox">Ultrabox</button>
                <button class="modal-btn" data-set-theme="rainbow-dark">Rainbow Dark</button>
                <button class="modal-btn" data-set-theme="retake">Retake</button>
                <button class="modal-btn" data-set-theme="youtube">Youtube</button>
                <button class="modal-btn" data-set-theme="void">Void</button>
                <button class="modal-btn" data-set-theme="minisoon-light">Mini Soon Light</button>
                <button class="modal-btn" data-set-theme="bnoob">Cooking with Bnoob</button>
            </div>
        </div>
    </div>

    <div id="tab-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>
            <h3>Tab Settings</h3>
            
            <div class="setting-group">
                <label for="tab-title-input">Tab Title:</label>
                <input type="text" id="tab-title-input" placeholder="Enter new title...">
                <button id="apply-title-btn" class="modal-btn">Apply Title</button>
            </div>

            <div class="setting-group">
                <label>Quick Icons:</label>
                <div class="icon-buttons">
                    <button class="modal-btn icon-btn" data-icon="favicon.ico">Default</button>
                    <button class="modal-btn icon-btn" data-icon="icons/mungus.ico">Mungus</button>
                    <button class="modal-btn icon-btn" data-icon="icons/googleclassroom.ico">Classroom</button>
                     <button class="modal-btn icon-btn" data-icon="icons/fcr.ico">RETAKE</button>
                </div>
            </div>

            <div class="setting-group">
                <label for="icon-url-input">Custom Icon URL:</label>
                <input type="text" id="icon-url-input" placeholder="https://example.com/icon.ico">
                <button id="apply-url-btn" class="modal-btn">Apply URL</button>
            </div>

            <div class="setting-group">
                <label for="icon-file-input">Upload Icon File:</label>
                <input type="file" id="icon-file-input" accept="image/*,.ico">
            </div>
        </div>
    </div>

    <div id="friends-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-friends-modal-btn" class="close-btn">&times;</span>
            <h3>My friend's website</h3>
            <div class="setting-group" style="text-align: center; margin-top: 10px;">
                <p style="margin-bottom: 15px; color: var(--text-accent);">Check out my friend's website!</p>
                <a id="fcr-link" href="https://fcr-official.github.io/RETAKE/" target="_blank" class="retake-btn">
                    RETAKE
                    <img src="https://fcr-official.github.io/RETAKE/favicon.ico" alt="RETAKE Icon" style="width: 16px; height: 16px; margin-left: 8px;">
                </a>
            </div>
        </div>
    </div>

    <div id="achievements-modal" class="modal hidden">
        <div class="modal-content" style="width: 350px;">
            <span id="close-achievements-btn" class="close-btn">&times;</span>
            <h3>Achievements</h3>
            <div id="achievements-list"></div>
        </div>
    </div>

    <div id="gallery-modal" class="modal hidden">
        <div class="modal-content gallery-modal-content">
            <span id="close-gallery-btn" class="close-btn">&times;</span>
            <h3>Gallery</h3>
            <div class="gallery-carousel">
                <button id="prev-btn" class="gallery-btn">&lt;</button>
                <div class="gallery-content">
                    <img id="gallery-img" src="" alt="Gallery Image">
                    <p id="gallery-caption"></p>
                </div>
                <button id="next-btn" class="gallery-btn">&gt;</button>
            </div>
        </div>
    </div>

    <div id="achievement-toast" class="hidden">
        <div class="toast-content">
            <strong>Achievement Unlocked!</strong><br>
            <span id="toast-text">Name</span>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
