<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrgeYT's HTML Projects</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Gallery Carousel Styles */
        .gallery-section {
            margin-top: 20px;
            padding: 10px;
            background: rgba(204, 85, 0, 0.15); /* Orange tinted background */
            border-radius: 10px;
            text-align: center;
        }
        .gallery-section h3 {
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(204, 85, 0, 0.3); /* Orange bottom border */
            padding-bottom: 5px;
        }
        .gallery-carousel {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .gallery-btn {
            background: rgba(204, 85, 0, 0.2); /* Orange button background */
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
        }
        .gallery-btn:hover { background: rgba(204, 85, 0, 0.5); }
        .gallery-content {
            flex-grow: 1;
            padding: 0 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .gallery-content img {
            width: 100%;
            max-width: 160px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .gallery-content p {
            font-size: 0.85rem;
            opacity: 0.8;
            margin: 0;
            font-style: italic;
            min-height: 2.5em;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <img id="sidebar-logo" src="Logo.png" alt="OrgeYT Logo">
        
        <h2>My Projects</h2>
        <p class="subtitle">Choose a project to load</p>

        <div class="sidebar-controls" style="display: flex; gap: 5px; margin-bottom: 15px; flex-wrap: wrap;">
            <button id="toggle-ui-btn" class="toggle-btn" style="margin-bottom: 0; flex: 1 1 45%;">Toggle UI (`)</button>
            <button id="tab-modifier-btn" class="toggle-btn" style="margin-bottom: 0; flex: 1 1 45%;">Tab Settings</button>
            <button id="friends-website-btn" class="toggle-btn" style="margin-top: 5px; margin-bottom: 0; flex: 1 1 100%;">My friend's website</button>
        </div>

        <div id="file-list"></div>

        <div class="gallery-section">
            <h3>Gallery</h3>
            <div class="gallery-carousel">
                <button id="prev-btn" class="gallery-btn">&lt;</button>
                <div class="gallery-content">
                    <img id="gallery-img" src="" alt="Gallery Image">
                    <p id="gallery-caption"></p>
                </div>
                <button id="next-btn" class="gallery-btn">&gt;</button>
            </div>
        </div>
    </div>
    
    <div class="main-content">
        <button id="open-full-btn">View Full Project</button>
        <button id="share-btn">Share Project</button>
        <button id="fullscreen-btn">Full Screen</button>
        <iframe id="runner-frame" src="about:blank" title="Project Runner"></iframe>
    </div>

    <div id="tab-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-modal-btn" class="close-btn">&times;</span>
            <h3>Tab Settings</h3>
            
            <div class="setting-group">
                <label for="tab-title-input">Tab Title:</label>
                <input type="text" id="tab-title-input" placeholder="Enter new title...">
                <button id="apply-title-btn" class="modal-btn">Apply Title</button>
            </div>

            <div class="setting-group">
                <label>Quick Icons:</label>
                <div class="icon-buttons">
                    <button class="modal-btn icon-btn" data-icon="favicon.ico">Default</button>
                    <button class="modal-btn icon-btn" data-icon="icons/mungus.ico">Mungus</button>
                    <button class="modal-btn icon-btn" data-icon="icons/googleclassroom.ico">Classroom</button>
                     <button class="modal-btn icon-btn" data-icon="icons/fcr.ico">RETAKE</button>
                </div>
            </div>

            <div class="setting-group">
                <label for="icon-url-input">Custom Icon URL:</label>
                <input type="text" id="icon-url-input" placeholder="https://example.com/icon.ico">
                <button id="apply-url-btn" class="modal-btn">Apply URL</button>
            </div>

            <div class="setting-group">
                <label for="icon-file-input">Upload Icon File:</label>
                <input type="file" id="icon-file-input" accept="image/*,.ico">
            </div>
        </div>
    </div>

    <div id="friends-modal" class="modal hidden">
        <div class="modal-content">
            <span id="close-friends-modal-btn" class="close-btn">&times;</span>
            <h3>My friend's website</h3>
            <div class="setting-group" style="text-align: center; margin-top: 10px;">
                <p style="margin-bottom: 15px; color: #e6a873;">Check out my friend's website!</p>
                <a href="https://fcr-official.github.io/RETAKE/" target="_blank" class="retake-btn">
                    RETAKE
                    <img src="https://fcr-official.github.io/RETAKE/favicon.ico" alt="RETAKE Icon" style="width: 16px; height: 16px; margin-left: 8px;">
                </a>
            </div>
        </div>
    </div>

    <script>
        const galleryImages = [
            { src: "Gallery/AAUGH.png", caption: '"Fun fact, this was actually the first file uploaded."' },
            { src: "Gallery/NOO.png", caption: '"NOO THEY CHANGED THE GOOGLE DRIVE LOGO"' },
            { src: "Gallery/avatar.png", caption: '"this is fine"' },
            { src: "Gallery/cards.jpg", caption: "" },
            { src: "Gallery/finaltest.jpg", caption: "" },
            { src: "Gallery/darn.jpg", caption: "fr"},
            { src: "Gallery/amongus art.png", caption: "among us art i made on my phone. not my original character" },
            { src: "Gallery/Untitled178.png", caption: "more art i made on my phone xd"}
        ];

        let currentIndex = 0;
        const galleryImg = document.getElementById("gallery-img");
        const galleryCaption = document.getElementById("gallery-caption");

        function updateGallery() {
            galleryImg.src = galleryImages[currentIndex].src;
            galleryCaption.textContent = galleryImages[currentIndex].caption;
        }

        document.getElementById("prev-btn").addEventListener("click", () => {
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
            updateGallery();
        });

        document.getElementById("next-btn").addEventListener("click", () => {
            currentIndex = (currentIndex + 1) % galleryImages.length;
            updateGallery();
        });

        updateGallery();
    </script>
    <script src="app.js"></script>
</body>
</html>
